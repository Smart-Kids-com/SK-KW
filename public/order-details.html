<script>
  const API_BASE = '/api/orders';
  const PRODUCTS_API = '/api/products';

  const HELPERS_FALLBACK = {
    formatCurrency(value) {
      const num = Number(value || 0);
      return `KWD ${num.toFixed(3)}`;
    },
    formatDate(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (isNaN(d)) return value;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    },
    formatDateTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (isNaN(d)) return value;
      return d.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }
  };

  const H = (typeof HELPERS !== 'undefined' && HELPERS) ? HELPERS : HELPERS_FALLBACK;

  let currentOrder = null;
  let productsCatalogCache = [];
  let currentDiscountTargetIndex = null;

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value ?? '';
  }

  function setHTML(id, value) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = value ?? '';
  }

  function showAlert(message, type = 'success') {
    ['desktopAlert', 'mobileAlert'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = message;
      el.className = `alert active ${type}`;
      setTimeout(() => el.classList.remove('active'), 3500);
    });
  }

  function setLoading(isLoading) {
    document.getElementById('desktopLoading')?.classList.toggle('hidden', !isLoading);
    document.getElementById('mobileLoading')?.classList.toggle('hidden', !isLoading);
  }

  function nl2br(value) {
    return String(value || '').replace(/\n/g, '<br>');
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function buildAddress(order) {
    return [
      order.customer_address,
      order.customer_district,
      order.customer_city
    ].filter(Boolean).join('\n') || '—';
  }

  function getPaymentLabel(order) {
    return Number(order.balance || 0) > 0 ? 'Payment pending' : 'Paid';
  }

  function getFulfillmentLabel(order) {
    const s = String(order.status || '').toLowerCase();
    if (s === 'processing') return 'In progress';
    if (s === 'shipped' || s === 'completed') return 'Fulfilled';
    if (s === 'on_hold') return 'On hold';
    if (s === 'cancelled') return 'Cancelled';
    return 'Unfulfilled';
  }

  function formatOrderDateLine(value) {
    if (!value) return '-';
    const d = new Date(value);
    if (isNaN(d)) return '-';
    return d.toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric'
    });
  }

  function formatDetailDate(value) {
    return H.formatDateTime(value);
  }

  function setStatusChip(id, text, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = `status-chip ${type}`;
    el.innerHTML = `<span class="dot"></span>${escapeHtml(text)}`;
  }

  function renderProductThumb(id, image) {
    const el = document.getElementById(id);
    if (!el) return;
    if (image) {
      el.innerHTML = `<img src="${escapeHtml(image)}" alt="">`;
    } else {
      el.textContent = '📦';
    }
  }

  function getShippingText(order) {
    const shipping = Number(order.shipping_cost || 0);
    return shipping <= 0 ? 'Free shipping' : 'Standard shipping';
  }

  function normalizeOrder(order) {
    const items = Array.isArray(order.items) ? order.items.map((item, index) => {
      const unitPrice = Number(item.product_price ?? item.price ?? 0);
      const quantity = Math.max(1, Number(item.quantity ?? 1));
      const subtotal = Number(item.subtotal ?? (unitPrice * quantity));
      return {
        ...item,
        product_id: item.product_id || item.productId || '',
        product_name: item.product_name || item.name || `Product ${index + 1}`,
        unit_price: unitPrice,
        price: unitPrice,
        quantity,
        subtotal,
        image: item.product_image || item.image_url || ''
      };
    }) : [];

    const firstItem = items[0] || {
      product_name: 'Order item',
      unit_price: Number(order.total || 0),
      quantity: 1,
      subtotal: Number(order.total || 0),
      image: ''
    };

    const total = Number(order.total || 0);
    const shipping = Number(order.shipping_cost || 0);
    const subtotal = Number(order.subtotal || Math.max(total - shipping, 0));
    const paid = order.status === 'completed' ? total : 0;
    const balance = Math.max(total - paid, 0);

    return {
      ...order,
      tags: Array.isArray(order.tags) ? order.tags : [],
      items,
      firstItem,
      total,
      shipping_cost: shipping,
      subtotal,
      paid,
      balance,
      itemsCount: items.reduce((sum, item) => sum + Number(item.quantity || 0), 0) || 1
    };
  }

  async function apiJson(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok || !data.success) {
      throw new Error(data?.error || 'Request failed');
    }
    return data;
  }

  async function loadOrder() {
    try {
      setLoading(true);

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const orderNumber = params.get('order');

      if (!id && !orderNumber) throw new Error('Order id is missing');

      let data;
      if (id) {
        data = await apiJson(`${API_BASE}/${encodeURIComponent(id)}`);
      } else {
        data = await apiJson(`${API_BASE}/track/${encodeURIComponent(orderNumber)}`);
      }

      currentOrder = normalizeOrder(data.data);
      renderOrder(currentOrder);
    } catch (error) {
      showAlert(error.message || 'Failed to load order', 'error');
    } finally {
      setLoading(false);
    }
  }

  function renderOrder(order) {
    const orderNumber = order.order_number || `#${order.id || ''}`;
    const paymentLabel = getPaymentLabel(order);
    const fulfillmentLabel = getFulfillmentLabel(order);
    const orderSub = `${formatOrderDateLine(order.created_at)} • Online Store`;

    setText('desktopOrdersCountBadge', '1');

    setText('desktopOrderNumber', orderNumber);
    setText('desktopOrderSubLine', orderSub);
    setStatusChip('desktopPaymentChipTop', paymentLabel, 'payment');
    setStatusChip('desktopPaymentChipCard', paymentLabel, 'payment');
    setStatusChip('desktopFulfillmentChipTop', fulfillmentLabel, 'fulfillment');
    setStatusChip('desktopFulfillmentChipCard', fulfillmentLabel, 'fulfillment');
    setText('desktopFulfillmentRef', orderNumber);
    setText('desktopFulfilledDate', formatDetailDate(order.updated_at || order.created_at));

    renderProductThumb('desktopProductThumb', order.firstItem.image);
    setText('desktopProductTitle', order.firstItem.product_name);
    setText('desktopProductUnitPrice', H.formatCurrency(order.firstItem.unit_price));
    setText('desktopProductQty', String(order.firstItem.quantity));
    setText('desktopProductLineTotal', H.formatCurrency(order.firstItem.subtotal));

    setText('desktopSubtotal', H.formatCurrency(order.subtotal));
    setText('desktopShippingCost', H.formatCurrency(order.shipping_cost));
    setText('desktopShippingText', getShippingText(order));
    setText('desktopTotal', H.formatCurrency(order.total));
    setText('desktopPaid', H.formatCurrency(order.paid));
    setText('desktopBalance', H.formatCurrency(order.balance));

    setText('desktopNotesText', order.notes || 'No notes from customer');
    setText('desktopCustomerName', order.customer_name || '-');
    setText('desktopCustomerOrdersHint', '1 order');
    setText('desktopCustomerEmail', order.customer_email || '-');
    setText('desktopCustomerPhone', order.customer_phone || '-');
    setHTML('desktopAddressBlock', nl2br(buildAddress(order)));
    setText('desktopConversion1', 'This is their 1st order');
    setText('desktopConversion3', '1 session over 1 day');

    setText('mobileOrderNumber', orderNumber);
    setText('mobileOrderSubLine', orderSub);
    setStatusChip('mobilePaymentChipTop', paymentLabel, 'payment');
    setStatusChip('mobilePaymentChipCard', paymentLabel, 'payment');
    setStatusChip('mobileFulfillmentChipTop', fulfillmentLabel, 'fulfillment');
    setStatusChip('mobileFulfillmentChipCard', fulfillmentLabel, 'fulfillment');

    renderProductThumb('mobileProductThumb', order.firstItem.image);
    setText('mobileProductTitle', order.firstItem.product_name);
    setText('mobileProductUnitPrice', `${H.formatCurrency(order.firstItem.unit_price)} × ${order.firstItem.quantity}`);
    setText('mobileProductQty', String(order.firstItem.quantity));
    setText('mobileProductLineTotal', H.formatCurrency(order.firstItem.subtotal));

    setText('mobileSubtotal', H.formatCurrency(order.subtotal));
    setText('mobileShippingCost', H.formatCurrency(order.shipping_cost));
    setText('mobileTotal', H.formatCurrency(order.total));
    setText('mobilePaid', H.formatCurrency(order.paid));
    setText('mobileBalance', H.formatCurrency(order.balance));

    setText('mobileCustomerName', order.customer_name || '-');
    setText('mobileCustomerOrdersHint', '1 order');
    setHTML('mobileAddressBlock', nl2br(buildAddress(order)));
    setText('mobileNotesText', order.notes || 'No notes from customer');

    const emailBtn = document.getElementById('mobileEmailBtn');
    const phoneBtn = document.getElementById('mobilePhoneBtn');
    if (emailBtn) emailBtn.href = order.customer_email ? `mailto:${order.customer_email}` : '#';
    if (phoneBtn) phoneBtn.href = order.customer_phone ? `tel:${order.customer_phone}` : '#';

    syncTagsInput(order.tags || []);
    renderTimeline(order);

    document.getElementById('desktopOrderContent')?.classList.remove('hidden');
    document.getElementById('mobileOrderContent')?.classList.remove('hidden');
    document.title = `${orderNumber} - Order Details`;
  }

  function renderTimeline(order) {
    const items = [];

    items.push({
      time: H.formatDateTime(order.created_at),
      text: `Order ${order.order_number || ''} was created`
    });

    if (order.invoice_sent_at) {
      items.push({
        time: H.formatDateTime(order.invoice_sent_at),
        text: 'Invoice was sent'
      });
    }

    if (order.completed_at) {
      items.push({
        time: H.formatDateTime(order.completed_at),
        text: 'Order marked as paid'
      });
    }

    if (order.shipped_at) {
      items.push({
        time: H.formatDateTime(order.shipped_at),
        text: 'Order marked as fulfilled'
      });
    }

    if (order.fulfillment_requested) {
      items.push({
        time: H.formatDateTime(order.updated_at),
        text: 'Fulfillment was requested'
      });
    }

    if (order.archived) {
      items.push({
        time: H.formatDateTime(order.updated_at),
        text: 'Order archived'
      });
    }

    if (order.returned) {
      items.push({
        time: H.formatDateTime(order.updated_at),
        text: 'Return recorded'
      });
    }

    if (order.restocked) {
      items.push({
        time: H.formatDateTime(order.updated_at),
        text: 'Restock recorded'
      });
    }

    if (order.notes) {
      items.push({
        time: H.formatDateTime(order.updated_at || order.created_at),
        text: `Note: ${order.notes}`
      });
    }

    const desktopHtml = items.map(item => `
      <div class="timeline-item">
        <div class="timeline-item-text">${escapeHtml(item.text)}</div>
        <div class="timeline-item-time">${escapeHtml(item.time)}</div>
      </div>
    `).join('');

    const mobileHtml = items.map(item => `
      <div class="mobile-timeline-item">
        <div class="mobile-timeline-time">${escapeHtml(item.time)}</div>
        <div class="mobile-timeline-text">${escapeHtml(item.text)}</div>
      </div>
    `).join('');

    setHTML('desktopTimelineList', desktopHtml || '<div class="timeline-item"><div class="timeline-item-text">No timeline activity</div><div class="timeline-item-time">—</div></div>');
    setHTML('mobileTimelineList', mobileHtml || '<div class="mobile-timeline-item"><div class="mobile-timeline-time">—</div><div class="mobile-timeline-text">No timeline activity</div></div>');
  }

  function goBackToOrders() {
    window.location.href = '/orders-admin.html';
  }

  function openModal(id) {
    document.getElementById(id)?.classList.add('active');
  }

  function closeModal(id) {
    document.getElementById(id)?.classList.remove('active');
  }

  function closeMobileActionsMenu() {
    document.getElementById('mobileActionsMenu')?.classList.remove('active');
  }

  function toggleMobileActionsMenu(event) {
    event?.stopPropagation?.();
    document.getElementById('mobileActionsMenu')?.classList.toggle('active');
  }

  function syncTagsInput(tags) {
    const input = document.querySelector('.sidebar-card input[type="text"]');
    if (input) {
      input.value = Array.isArray(tags) ? tags.join(', ') : '';
      input.onchange = saveTags;
      input.onblur = saveTags;
    }
  }

  async function saveTags() {
    try {
      if (!currentOrder?.id) return;
      const input = document.querySelector('.sidebar-card input[type="text"]');
      if (!input) return;
      const tags = input.value.split(',').map(v => v.trim()).filter(Boolean);

      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/tags`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'set', tags })
      });

      currentOrder = normalizeOrder(data.data);
      renderOrder(currentOrder);
      showAlert('Tags updated', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to update tags', 'error');
    }
  }

  async function sendInvoice() {
    try {
      if (!currentOrder?.id) throw new Error('Order id is missing');
      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/send-invoice`, {
        method: 'POST'
      });
      currentOrder = normalizeOrder(data.data);
      renderOrder(currentOrder);
      showAlert('Invoice sent', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to send invoice', 'error');
    }
  }

  async function markAsPaid() {
    try {
      if (!currentOrder?.id) throw new Error('Order id is missing');
      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/mark-paid`, {
        method: 'POST'
      });
      currentOrder = normalizeOrder(data.data);
      renderOrder(currentOrder);
      showAlert('Order marked as paid', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to mark order as paid', 'error');
    }
  }

  async function archiveCurrentOrder() {
    try {
      if (!currentOrder?.id) throw new Error('Order id is missing');
      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/archive`, {
        method: 'POST'
      });
      currentOrder = normalizeOrder(data.data);
      renderOrder(currentOrder);
      showAlert('Order archived', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to archive order', 'error');
    }
  }

  async function cancelCurrentOrder() {
    try {
      if (!currentOrder?.id) throw new Error('Order id is missing');
      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/cancel`, {
        method: 'POST'
      });
      currentOrder = normalizeOrder(data.data);
      renderOrder(currentOrder);
      showAlert('Order cancelled', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to cancel order', 'error');
    }
  }

  async function duplicateCurrentOrder() {
    try {
      if (!currentOrder?.id) throw new Error('Order id is missing');
      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/duplicate`, {
        method: 'POST'
      });
      showAlert('Order duplicated', 'success');
      if (data.data?.id) {
        window.location.href = `/order-details.html?id=${encodeURIComponent(data.data.id)}`;
      }
    } catch (error) {
      showAlert(error.message || 'Failed to duplicate order', 'error');
    }
  }

  async function restockCurrentOrder() {
    try {
      if (!currentOrder?.id) throw new Error('Order id is missing');
      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/restock`, {
        method: 'POST'
      });
      currentOrder = normalizeOrder(data.data);
      renderOrder(currentOrder);
      showAlert('Restock recorded', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to restock order', 'error');
    }
  }

  async function returnCurrentOrder() {
    try {
      if (!currentOrder?.id) throw new Error('Order id is missing');
      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/return`, {
        method: 'POST'
      });
      currentOrder = normalizeOrder(data.data);
      renderOrder(currentOrder);
      showAlert('Return recorded', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to return order', 'error');
    }
  }

  function handleMobileAction(action) {
    closeMobileActionsMenu();

    if (action === 'edit') return openMainOrderEdit();
    if (action === 'duplicate') return duplicateCurrentOrder();
    if (action === 'cancel') return cancelCurrentOrder();
    if (action === 'restock') return restockCurrentOrder();
    if (action === 'archive') return archiveCurrentOrder();
    if (action === 'paid') return markAsPaid();
    if (action === 'note') return openQuickEdit('notes');
    if (action === 'status') return openQuickEdit('shipping');
    if (action === 'share') return shareOrderWithStaff();
  }

  function shareOrderWithStaff() {
    const url = window.location.href;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        showAlert('Order link copied', 'success');
      }).catch(() => {
        window.prompt('Copy this link', url);
      });
    } else {
      window.prompt('Copy this link', url);
    }
  }

  function openQuickEdit(mode) {
    if (!currentOrder) {
      showAlert('Order is not loaded yet', 'error');
      return;
    }

    document.getElementById('quickEditMode').value = mode;
    ['quickEditNotesFields', 'quickEditContactFields', 'quickEditShippingFields'].forEach(id => {
      document.getElementById(id)?.classList.add('hidden');
    });

    if (mode === 'notes') {
      document.getElementById('quickEditTitle').textContent = 'Edit notes';
      document.getElementById('quickEditNotesFields').classList.remove('hidden');
      document.getElementById('quickEditNotes').value = currentOrder.notes || '';
    } else if (mode === 'contact') {
      document.getElementById('quickEditTitle').textContent = 'Edit contact';
      document.getElementById('quickEditContactFields').classList.remove('hidden');
      document.getElementById('quickEditName').value = currentOrder.customer_name || '';
      document.getElementById('quickEditEmail').value = currentOrder.customer_email || '';
      document.getElementById('quickEditPhone').value = currentOrder.customer_phone || '';
    } else if (mode === 'shipping') {
      document.getElementById('quickEditTitle').textContent = 'Edit shipping';
      document.getElementById('quickEditShippingFields').classList.remove('hidden');
      document.getElementById('quickEditAddress').value = currentOrder.customer_address || '';
      document.getElementById('quickEditDistrict').value = currentOrder.customer_district || '';
      document.getElementById('quickEditCity').value = currentOrder.customer_city || '';
      document.getElementById('quickEditShippingCharge').value = Number(currentOrder.shipping_cost || 0).toFixed(3);
    }

    openModal('quickEditModal');
  }

  async function saveQuickEdit(event) {
    event.preventDefault();

    if (!currentOrder?.id) {
      showAlert('Order id is missing', 'error');
      return;
    }

    try {
      const mode = document.getElementById('quickEditMode').value;
      let data;

      if (mode === 'notes') {
        data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/notes`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            notes: document.getElementById('quickEditNotes').value
          })
        });
      } else if (mode === 'contact') {
        data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/customer`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName: document.getElementById('quickEditName').value.trim(),
            customerEmail: document.getElementById('quickEditEmail').value.trim(),
            customerPhone: document.getElementById('quickEditPhone').value.trim()
          })
        });
      } else {
        data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}/shipping`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerAddress: document.getElementById('quickEditAddress').value.trim(),
            customerDistrict: document.getElementById('quickEditDistrict').value.trim(),
            customerCity: document.getElementById('quickEditCity').value.trim(),
            shippingCost: Number(document.getElementById('quickEditShippingCharge').value || 0)
          })
        });
      }

      currentOrder = normalizeOrder(data.data);
      closeModal('quickEditModal');
      renderOrder(currentOrder);
      showAlert('Order updated', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to update order', 'error');
    }
  }

  function getMainEditItemMarkup(item = {}, index = 0) {
    const name = item.product_name || item.name || '';
    const productId = item.product_id || '';
    const price = Number(item.unit_price ?? item.price ?? 0);
    const qty = Math.max(1, Number(item.quantity ?? 1));
    const subtotal = Number(item.subtotal ?? (price * qty));

    return `
      <div class="editor-item-card" data-index="${index}" data-discount-type="" data-discount-value="0" data-discount-reason="">
        <div class="editor-item-head">
          <div class="editor-item-title">${escapeHtml(name || 'Item')}</div>
          <button class="editor-remove-btn" type="button" onclick="removeMainEditItem(this)">Remove</button>
        </div>

        <div class="editor-item-grid">
          <div class="form-group">
            <label>Product name</label>
            <input class="main-edit-name" type="text" value="${escapeHtml(name)}" oninput="recalculateMainEditTotals()">
          </div>
          <div class="form-group">
            <label>Price</label>
            <input class="main-edit-price" type="number" min="0" step="0.001" value="${price.toFixed(3)}" oninput="recalculateMainEditTotals()">
          </div>
          <div class="form-group">
            <label>Qty</label>
            <input class="main-edit-qty" type="number" min="1" step="1" value="${qty}" oninput="recalculateMainEditTotals()">
          </div>
          <div class="form-group">
            <label>Line total</label>
            <input class="main-edit-line-total" type="text" value="${H.formatCurrency(subtotal)}" readonly>
          </div>
        </div>

        <input class="main-edit-product-id" type="hidden" value="${escapeHtml(productId)}">
        <input class="main-edit-image" type="hidden" value="${escapeHtml(item.image || item.product_image || '')}">

        <button class="editor-price-btn" type="button" onclick="openDiscountModal(this)">
          <span class="price-label">${H.formatCurrency(price)}</span>
          <span>Discount</span>
        </button>
        <div class="editor-price-meta">No discount</div>
      </div>
    `;
  }

  function openMainOrderEdit() {
    if (!currentOrder) {
      showAlert('Order is not loaded yet', 'error');
      return;
    }

    document.getElementById('mainEditOrderId').value = currentOrder.id || '';
    document.getElementById('mainEditStatus').value = currentOrder.status || 'pending';
    document.getElementById('mainEditShippingCost').value = Number(currentOrder.shipping_cost || 0).toFixed(3);

    const list = document.getElementById('mainEditItemsList');
    list.innerHTML = '';
    (currentOrder.items || []).forEach((item, index) => {
      list.insertAdjacentHTML('beforeend', getMainEditItemMarkup(item, index));
    });

    if (!list.children.length) addMainEditItem();

    recalculateMainEditTotals();
    closeMobileActionsMenu();
    openModal('mainOrderEditModal');
  }

  async function loadProductsCatalog() {
    if (productsCatalogCache.length) return productsCatalogCache;
    const data = await apiJson(`${PRODUCTS_API}?status=active&limit=300`, { cache: 'no-store' });
    productsCatalogCache = Array.isArray(data.data) ? data.data : [];
    return productsCatalogCache;
  }

  async function openAddProductModal() {
    try {
      await loadProductsCatalog();
      renderAddProductResults('');
      openModal('addProductModal');
    } catch (error) {
      showAlert(error.message || 'Failed to load products', 'error');
    }
  }

  function renderAddProductResults(query) {
    const container = document.getElementById('addProductResults');
    const q = String(query || '').trim().toLowerCase();

    const rows = productsCatalogCache.filter(product => {
      if (!q) return true;
      const hay = [
        product.product_name,
        product.sku,
        product.vendor,
        product.category
      ].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0, 50);

    container.innerHTML = rows.map(product => {
      const image = product.primary_image || product.image_url || '';
      return `
        <div class="picker-item">
          <div class="picker-thumb">${image ? `<img src="${escapeHtml(image)}" alt="">` : '📦'}</div>
          <div>
            <div class="picker-title">${escapeHtml(product.product_name || 'Product')}</div>
            <div class="picker-sub">${escapeHtml(product.sku || '')} • ${H.formatCurrency(product.sale_price || product.price || 0)}</div>
          </div>
          <button class="dark-btn" type="button" onclick='addProductToMainEdit(${JSON.stringify({
            id: product.id,
            product_name: product.product_name || '',
            price: Number(product.sale_price || product.price || 0),
            image: product.primary_image || product.image_url || ''
          }).replace(/'/g, "&apos;")})'>Add</button>
        </div>
      `;
    }).join('') || '<div class="loading">No products found</div>';
  }

  function addProductToMainEdit(product) {
    const list = document.getElementById('mainEditItemsList');
    list.insertAdjacentHTML('beforeend', getMainEditItemMarkup({
      product_id: product.id || '',
      product_name: product.product_name || '',
      price: Number(product.price || 0),
      quantity: 1,
      subtotal: Number(product.price || 0),
      image: product.image || ''
    }, list.children.length));
    recalculateMainEditTotals();
    closeModal('addProductModal');
  }

  function openCustomItemModal() {
    document.getElementById('customItemForm')?.reset();
    document.getElementById('customItemQty').value = '1';
    document.getElementById('customItemPhysical').checked = true;
    openModal('customItemModal');
  }

  function saveCustomItem(event) {
    event.preventDefault();
    const list = document.getElementById('mainEditItemsList');
    const name = document.getElementById('customItemName').value.trim();
    const price = Number(document.getElementById('customItemPrice').value || 0);
    const qty = Math.max(1, Number(document.getElementById('customItemQty').value || 1));

    list.insertAdjacentHTML('beforeend', getMainEditItemMarkup({
      product_id: `custom_${Date.now()}`,
      product_name: name,
      price,
      quantity: qty,
      subtotal: price * qty,
      image: ''
    }, list.children.length));

    recalculateMainEditTotals();
    closeModal('customItemModal');
  }

  function addMainEditItem() {
    const list = document.getElementById('mainEditItemsList');
    list.insertAdjacentHTML('beforeend', getMainEditItemMarkup({}, list.children.length));
    recalculateMainEditTotals();
  }

  function removeMainEditItem(button) {
    button.closest('.editor-item-card')?.remove();
    recalculateMainEditTotals();
  }

  function getEditorDiscountedUnitPrice(basePrice, discountType, discountValue) {
    const price = Number(basePrice || 0);
    const value = Number(discountValue || 0);

    if (discountType === 'percentage') {
      return Math.max(Number((price - (price * value / 100)).toFixed(3)), 0);
    }
    if (discountType === 'amount') {
      return Math.max(Number((price - value).toFixed(3)), 0);
    }
    return price;
  }

  function getDiscountMetaText(discountType, discountValue, discountReason) {
    if (!discountType || Number(discountValue || 0) <= 0) return 'No discount';
    const reason = discountReason ? ` • ${discountReason}` : '';
    if (discountType === 'percentage') return `${discountValue}% discount${reason}`;
    return `${H.formatCurrency(discountValue)} discount${reason}`;
  }

  function collectMainEditItems() {
    return Array.from(document.querySelectorAll('#mainEditItemsList .editor-item-card')).map(card => {
      const productId = card.querySelector('.main-edit-product-id')?.value || `manual_${Date.now()}`;
      const image = card.querySelector('.main-edit-image')?.value || '';
      const name = card.querySelector('.main-edit-name')?.value.trim() || 'Item';
      const basePrice = Number(card.querySelector('.main-edit-price')?.value || 0);
      const qty = Math.max(1, Number(card.querySelector('.main-edit-qty')?.value || 1));

      const discountType = String(card.dataset.discountType || '').trim();
      const discountValue = Number(card.dataset.discountValue || 0);
      const unitPrice = getEditorDiscountedUnitPrice(basePrice, discountType, discountValue);
      const subtotal = Number((unitPrice * qty).toFixed(3));

      return {
        product_id: productId,
        product_name: name,
        product_image: image,
        price: unitPrice,
        quantity: qty,
        subtotal
      };
    }).filter(item => item.product_name);
  }

  function recalculateMainEditTotals() {
    const items = collectMainEditItems();
    const subtotal = Number(items.reduce((sum, item) => sum + Number(item.subtotal || 0), 0).toFixed(3));
    const shipping = Number(document.getElementById('mainEditShippingCost').value || 0);
    const status = document.getElementById('mainEditStatus').value || 'pending';
    const total = Number((subtotal + shipping).toFixed(3));
    const paid = status === 'completed' ? total : 0;
    const balance = Math.max(Number((total - paid).toFixed(3)), 0);

    document.querySelectorAll('#mainEditItemsList .editor-item-card').forEach(card => {
      const basePrice = Number(card.querySelector('.main-edit-price')?.value || 0);
      const qty = Math.max(1, Number(card.querySelector('.main-edit-qty')?.value || 1));
      const discountType = String(card.dataset.discountType || '').trim();
      const discountValue = Number(card.dataset.discountValue || 0);
      const discountReason = String(card.dataset.discountReason || '').trim();
      const discountedUnit = getEditorDiscountedUnitPrice(basePrice, discountType, discountValue);
      const line = Number((discountedUnit * qty).toFixed(3));

      const lineField = card.querySelector('.main-edit-line-total');
      if (lineField) lineField.value = H.formatCurrency(line);

      const priceLabel = card.querySelector('.price-label');
      if (priceLabel) priceLabel.textContent = H.formatCurrency(basePrice);

      const meta = card.querySelector('.editor-price-meta');
      if (meta) meta.textContent = getDiscountMetaText(discountType, discountValue, discountReason);
    });

    setText('mainEditSubtotalText', H.formatCurrency(subtotal));
    setText('mainEditShippingText', H.formatCurrency(shipping));
    setText('mainEditTotalText', H.formatCurrency(total));
    setText('mainEditPaidText', H.formatCurrency(paid));
    setText('mainEditBalanceText', H.formatCurrency(balance));
  }

  async function saveMainOrderChanges(event) {
    event.preventDefault();

    if (!currentOrder?.id) {
      showAlert('Unable to determine order id', 'error');
      return;
    }

    try {
      const items = collectMainEditItems();
      if (!items.length) {
        showAlert('Add at least one product', 'error');
        return;
      }

      const shipping = Number(document.getElementById('mainEditShippingCost').value || 0);
      const status = document.getElementById('mainEditStatus').value || currentOrder.status || 'pending';

      const data = await apiJson(`${API_BASE}/${encodeURIComponent(currentOrder.id)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          status,
          items,
          shippingCost: shipping
        })
      });

      currentOrder = normalizeOrder(data.data);
      closeModal('mainOrderEditModal');
      renderOrder(currentOrder);
      showAlert('Order updated', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to update order', 'error');
    }
  }

  function openDiscountModal(button) {
    const card = button.closest('.editor-item-card');
    if (!card) return;

    currentDiscountTargetIndex = Array.from(document.querySelectorAll('#mainEditItemsList .editor-item-card')).indexOf(card);
    const type = card.dataset.discountType || 'amount';
    const value = Number(card.dataset.discountValue || 0);
    const reason = card.dataset.discountReason || '';

    setDiscountType(type);
    document.getElementById('discountValueInput').value = value;
    document.getElementById('discountReasonInput').value = reason;
    document.getElementById('discountTargetIndex').value = String(currentDiscountTargetIndex);

    openModal('discountModal');
  }

  function setDiscountType(type) {
    document.getElementById('discountTypeInput').value = type;
    document.getElementById('discountAmountBtn').classList.toggle('active', type === 'amount');
    document.getElementById('discountPercentageBtn').classList.toggle('active', type === 'percentage');
    document.getElementById('discountValueHelp').textContent =
      type === 'percentage'
        ? 'Enter discount percentage per unit.'
        : 'Enter discount amount per unit.';
  }

  function saveDiscountEdit(event) {
    event.preventDefault();

    const index = Number(document.getElementById('discountTargetIndex').value || -1);
    const card = document.querySelectorAll('#mainEditItemsList .editor-item-card')[index];
    if (!card) return;

    card.dataset.discountType = document.getElementById('discountTypeInput').value || '';
    card.dataset.discountValue = String(Number(document.getElementById('discountValueInput').value || 0));
    card.dataset.discountReason = document.getElementById('discountReasonInput').value.trim();

    recalculateMainEditTotals();
    closeModal('discountModal');
  }

  function clearDiscountEdit() {
    const index = Number(document.getElementById('discountTargetIndex').value || -1);
    const card = document.querySelectorAll('#mainEditItemsList .editor-item-card')[index];
    if (!card) return;

    card.dataset.discountType = '';
    card.dataset.discountValue = '0';
    card.dataset.discountReason = '';
    recalculateMainEditTotals();
    closeModal('discountModal');
  }

  function openShippingFeeModal() {
    document.getElementById('shippingFeeInput').value = document.getElementById('mainEditShippingCost').value || '0';
    openModal('shippingFeeModal');
  }

  function saveShippingFeeEdit(event) {
    event.preventDefault();
    document.getElementById('mainEditShippingCost').value = Number(document.getElementById('shippingFeeInput').value || 0).toFixed(3);
    recalculateMainEditTotals();
    closeModal('shippingFeeModal');
  }

  function setShippingFree() {
    document.getElementById('shippingFeeInput').value = '0.000';
  }

  function removeShippingFee() {
    document.getElementById('shippingFeeInput').value = '0.000';
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadOrder();

    document.addEventListener('click', event => {
      const wrap = event.target.closest('.mobile-actions-wrap');
      if (!wrap) closeMobileActionsMenu();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeMobileActionsMenu();
        closeModal('mainOrderEditModal');
        closeModal('quickEditModal');
        closeModal('addProductModal');
        closeModal('customItemModal');
        closeModal('discountModal');
        closeModal('shippingFeeModal');
      }
    });

    document.getElementById('mainEditStatus')?.addEventListener('change', recalculateMainEditTotals);
    document.getElementById('mainEditShippingCost')?.addEventListener('input', recalculateMainEditTotals);
  });
</script>
