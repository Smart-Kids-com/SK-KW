<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - Smart Kids Kuwait</title>
    <meta name="description" content="تسجيل الدخول إلى حسابك في Smart Kids Kuwait">
    <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        :root{
            --purple-dark:#6a4c93;
            --purple:#7b56a8;
            --purple-light:#9b59b6;
            --bg:#f5f2fa;
            --card:#ffffff;
            --text:#2f2a38;
            --muted:#746d80;
            --line:#e7deef;
            --shadow:0 10px 30px rgba(106,76,147,.12);
            --success-color:#28a745;
            --error-color:#dc3545;
        }

        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background:linear-gradient(180deg,#ede5f8 0%, #f7f3fc 260px, #f7f4fb 100%);
            min-height:100vh;
            color:var(--text);
        }

        a{text-decoration:none;color:inherit}
        button,input{font-family:inherit}

        .topbar{
            background:#000;
            color:#fff;
            padding:16px 18px;
            position:sticky;
            top:0;
            z-index:1000;
            box-shadow:0 8px 24px rgba(0,0,0,.12);
        }

        .topbar-inner{
            max-width:1100px;
            margin:0 auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:14px;
            min-width:0;
        }

        .brand-logo{
            width:60px;
            height:60px;
            object-fit:contain;
            border-radius:50%;
            background:#fff;
            padding:4px;
            flex:0 0 auto;
        }

        .brand-text{
            min-width:0;
        }

        .brand-text h1{
            font-size:clamp(1.3rem,2.5vw,2rem);
            line-height:1.15;
            margin-bottom:2px;
            color:#fff;
            font-weight:800;
        }

        .brand-text p{
            color:#d9d3e3;
            font-size:.95rem;
        }

        .header-actions{
            display:flex;
            align-items:center;
            gap:10px;
            flex:0 0 auto;
        }

        .circle-btn{
            width:56px;
            height:56px;
            border-radius:18px;
            border:none;
            background:linear-gradient(180deg,#f5f0fb,#e7daf7);
            box-shadow:0 8px 18px rgba(0,0,0,.12);
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            transition:.2s ease;
            padding:0;
            overflow:hidden;
        }

        .circle-btn:hover{
            transform:translateY(-2px);
        }

        .circle-btn svg{
            width:26px;
            height:26px;
            stroke:#6a4c93;
        }

        .page-wrap{
            max-width:1100px;
            margin:22px auto 40px;
            padding:0 16px;
        }

        .hero{
            background:var(--card);
            border:1px solid var(--line);
            border-radius:32px;
            box-shadow:var(--shadow);
            padding:26px 20px;
            text-align:center;
            margin-bottom:20px;
        }

        .hero-logo{
            width:min(380px, 88%);
            margin:0 auto 10px;
            object-fit:contain;
        }

        .hero h1{
            font-size:clamp(2rem,4vw,3rem);
            color:var(--purple-dark);
            font-weight:900;
            margin-bottom:6px;
        }

        .hero p{
            font-size:clamp(1rem,2vw,1.2rem);
            color:var(--text);
        }

        .login-container{
            max-width:460px;
            margin:0 auto;
            background:var(--card);
            border:1px solid var(--line);
            border-radius:28px;
            padding:28px 22px;
            box-shadow:var(--shadow);
        }

        .login-header{
            text-align:center;
            margin-bottom:1.8rem;
        }

        .login-header h2{
            color:var(--purple-dark);
            font-size:1.9rem;
            margin-bottom:.35rem;
            font-weight:900;
        }

        .login-header p{
            color:var(--muted);
            font-size:.98rem;
        }

        .form-group{
            margin-bottom:1.25rem;
        }

        .form-group label{
            display:block;
            margin-bottom:.55rem;
            font-weight:800;
            color:var(--purple-dark);
            font-size:.98rem;
        }

        .form-group input{
            width:100%;
            padding:15px 16px;
            border:1.5px solid #ddd7e6;
            border-radius:16px;
            background:#faf8fd;
            font-size:1rem;
            color:#333;
            transition:all .25s;
        }

        .form-group input:focus{
            outline:none;
            border-color:var(--purple-dark);
            background:#fff;
            box-shadow:0 0 0 4px rgba(106,76,147,.08);
        }

        .login-btn{
            width:100%;
            padding:15px;
            background:linear-gradient(45deg,var(--purple-dark),var(--purple-light));
            color:#fff;
            border:none;
            border-radius:16px;
            font-size:1.08rem;
            font-weight:800;
            cursor:pointer;
            transition:all .25s;
            margin-top:.35rem;
        }

        .login-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 20px rgba(106,76,147,.25);
        }

        .login-options{
            text-align:center;
            margin-top:1.35rem;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-wrap:wrap;
            gap:10px;
            color:var(--muted);
        }

        .login-options a{
            color:var(--purple-dark);
            font-size:.95rem;
            font-weight:700;
        }

        .login-options a:hover{
            text-decoration:underline;
        }

        .back-link{
            text-align:center;
            margin-top:1.4rem;
        }

        .back-link a{
            display:inline-block;
            padding:12px 22px;
            background:#fff;
            color:var(--purple-dark);
            border:1px solid var(--line);
            border-radius:999px;
            font-weight:800;
            transition:.2s ease;
            box-shadow:var(--shadow);
        }

        .back-link a:hover{
            transform:translateY(-2px);
        }

        .error-message,
        .success-message{
            padding:1rem;
            border-radius:14px;
            margin-bottom:1rem;
            display:none;
            font-weight:700;
            font-size:.95rem;
        }

        .error-message{
            background:rgba(220,53,69,.08);
            color:var(--error-color);
            border:1px solid rgba(220,53,69,.16);
        }

        .success-message{
            background:rgba(40,167,69,.08);
            color:var(--success-color);
            border:1px solid rgba(40,167,69,.16);
        }

        @media (max-width:768px){
            .topbar{
                padding:14px 12px;
            }

            .brand-logo{
                width:54px;
                height:54px;
            }

            .circle-btn{
                width:52px;
                height:52px;
                border-radius:16px;
            }

            .page-wrap{
                padding:0 12px;
            }

            .hero{
                padding:22px 16px;
                border-radius:28px;
            }

            .login-container{
                padding:22px 16px;
                border-radius:24px;
            }
        }

        @media (max-width:460px){
            .brand-text h1{
                font-size:1.05rem;
            }

            .brand-text p{
                font-size:.82rem;
            }

            .hero h1{
                font-size:2.2rem;
            }

            .login-header h2{
                font-size:1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img class="brand-logo" src="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457" alt="Smart Kids Kuwait">
                <div class="brand-text">
                    <h1>الأطفال المبتكرون الكويت</h1>
                    <p>Smart Kids Kuwait</p>
                </div>
            </div>

            <div class="header-actions">
                <a href="./cart.html" class="circle-btn" title="السلة" aria-label="السلة">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="20" r="1.6"></circle>
                        <circle cx="18" cy="20" r="1.6"></circle>
                        <path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h9.8a1 1 0 0 0 1-.8L21 7H7"></path>
                    </svg>
                </a>

                <a href="./profile.html" class="circle-btn" title="حسابي" aria-label="حسابي">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21a8 8 0 0 0-16 0"></path>
                        <circle cx="12" cy="8" r="4"></circle>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <div class="page-wrap">
        <section class="hero">
            <img class="hero-logo" src="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Logo_smart_kids-of-header-tag.png?v=1756574543" alt="Smart Kids Kuwait Logo">
            <h1>تسجيل الدخول</h1>
            <p>Smart Kids Kuwait</p>
        </section>

        <div class="login-container">
            <div class="login-header">
                <h2>مرحباً بعودتك</h2>
                <p>سجل الدخول للوصول إلى حسابك</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required placeholder="أدخل بريدك الإلكتروني">
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
                </div>

                <button type="submit" class="login-btn">تسجيل الدخول</button>
            </form>

            <div class="login-options">
                <a href="#" onclick="forgotPassword()">نسيت كلمة المرور؟</a>
                <span>|</span>
                <a href="#" onclick="createAccount()">إنشاء حساب جديد</a>
            </div>
        </div>

        <div class="back-link">
            <a href="./index.html">العودة للصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                showSuccess('تم تسجيل الدخول بنجاح');

                localStorage.setItem('userLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', email.split('@')[0]);

                setTimeout(() => {
                    window.location.href = './index.html';
                }, 1200);
            } else {
                showError('يرجى ملء جميع الحقول المطلوبة');
            }
        }

        function forgotPassword() {
            alert('سيتم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني');
        }

        function createAccount() {
            alert('ميزة إنشاء حساب جديد ستكون متوفرة قريباً');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';

            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 4000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        window.onload = function() {
            if (localStorage.getItem('userLoggedIn') === 'true') {
                showSuccess('أنت مسجل دخول بالفعل');
                setTimeout(() => {
                    window.location.href = './profile.html';
                }, 1200);
            }
        };
    </script>
</body>
</html>
