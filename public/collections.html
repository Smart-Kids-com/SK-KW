    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-dark: #6a4c93;
      --purple-light: #9b59b6;
      --header-blue: #3160e0;
      --topbar-bg: #3f0448;
      --page-bg-1: #5b267f;
      --page-bg-2: #7b3fa8;
      --page-bg-3: #5b126d;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 18% 10%, rgba(255, 134, 232, 0.18), transparent 28%),
        radial-gradient(circle at 85% 16%, rgba(100, 156, 255, 0.13), transparent 25%),

        linear-gradient(180deg, var(--page-bg-1) 0%, var(--page-bg-2) 46%, var(--page-bg-3) 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; }

    .topbar {
      background: var(--topbar-bg);
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .topbar-arrow { font-size: 1.2rem; line-height: 1; flex: 0 0 auto; }

    .site-header {
      background: #fff;
      min-height: 86px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .site-menu-btn,
    .site-icon-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      text-decoration: none;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      position: relative;
    }

    .site-header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .site-header-logo img {
      width: 320px;
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      display: block;
    }

    .site-header-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 1190;
    }

    body.menu-open .menu-backdrop { opacity: 1; pointer-events: auto; }

    .side-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(92vw, 400px);
      height: 100vh;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-left: 1px solid rgba(0,0,0,0.08);
      box-shadow: -12px 0 30px rgba(0,0,0,0.18);
      z-index: 1200;
      transform: translateX(105%);
      transition: transform .25s ease;
      display: flex;
      flex-direction: column;
    }

    body.menu-open .side-menu { transform: translateX(0); }

    .side-menu__head {
      min-height: 82px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      flex-shrink: 0;
      background: #fff;
    }

    .side-menu__close {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    .side-menu__logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .side-menu__logo img {
      width: 300px;
      max-width: 100%;
      max-height: 56px;
      object-fit: contain;
      display: block;
    }

    .side-menu__icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .side-menu__body {
      flex: 1;
      overflow: auto;
      padding: 8px 0 0;
      background: #4a064f;
      color: #fff;
    }

    .side-menu__nav a {

      padding: 18px 26px;
      font-size: 1.08rem;

      border-bottom: 1px solid rgba(255,255,255,.05);
      color: #fff;
    }

    .side-menu__footer {
      padding: 18px 22px 24px;
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      color: #fff;
    }

    .side-menu__social {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .side-menu__social a {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .side-menu__social img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 2rem 1rem 2.5rem;
      position: relative;
      z-index: 1;
    }

    .page-title {
      text-align: center;
      color: #fff;
      margin-bottom: 1.55rem;
    }

    .page-title h1 {
      font-size: clamp(1.8rem, 5vw, 2.75rem);
      margin-bottom: 0.42rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-shadow: 0 8px 28px rgba(35, 0, 55, 0.35);
    }

    .page-title p {
      color: rgba(255,255,255,0.88);
      font-size: 1rem;
      font-weight: 800;
      text-shadow: 0 4px 16px rgba(35, 0, 55, 0.25);
    }

    .collections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 1.1rem;
      margin: 0;
      align-items: stretch;
    }

    .collection-card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border-radius: 28px;
      padding: 1.15rem;
      min-height: 168px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.075));
      border: 1px solid rgba(255,255,255,0.26);
      box-shadow:
        0 24px 55px rgba(35, 5, 58, 0.30),
        inset 0 1px 0 rgba(255,255,255,0.34),
        inset 0 -1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px) saturate(145%);
      -webkit-backdrop-filter: blur(18px) saturate(145%);
      cursor: pointer;
      transition: transform .26s ease, box-shadow .26s ease, border-color .26s ease;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px;
      grid-template-rows: auto 1fr auto;
      gap: .62rem 1rem;
      align-items: center;
      text-align: right;
    }

    .collection-card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      top: -128px;
      left: -115px;
      border-radius: 45% 55% 60% 40%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.50), transparent 17%),
        radial-gradient(circle at 63% 42%, rgba(255, 113, 234, 0.48), transparent 34%),
        radial-gradient(circle at 42% 72%, rgba(91, 142, 255, 0.32), transparent 42%),
        linear-gradient(135deg, rgba(196, 74, 255, 0.60), rgba(88, 25, 175, 0.16));
      filter: blur(2px);
      opacity: .70;
      transform: rotate(-18deg);
      pointer-events: none;
      z-index: -1;
    }

    .collection-card::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      right: -120px;
      bottom: -124px;
      border-radius: 58% 42% 48% 52%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,0.30), transparent 18%),
        radial-gradient(circle at 50% 45%, rgba(178, 107, 255, 0.45), transparent 38%),
        radial-gradient(circle at 72% 68%, rgba(255, 116, 205, 0.24), transparent 42%);
      filter: blur(3px);
      opacity: .56;
      transform: rotate(14deg);
      pointer-events: none;
      z-index: -1;
    }

    .collection-card:hover {
      transform: translateY(-6px) scale(1.008);
      border-color: rgba(255,255,255,0.38);
      box-shadow:
        0 34px 74px rgba(35, 5, 58, 0.42),
        inset 0 1px 0 rgba(255,255,255,0.42);
    }

    .collection-title {
      grid-column: 1;
      grid-row: 1;
      color: #fff;
      font-size: clamp(1.04rem, 2.4vw, 1.26rem);
      font-weight: 950;
      line-height: 1.42;
      margin: 0;
      text-shadow: 0 4px 20px rgba(36, 0, 64, 0.44);
      overflow-wrap: anywhere;
    }

    .collection-description {
      grid-column: 1;
      grid-row: 2 / 4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: rgba(255,255,255,0.82);
      font-size: .92rem;
      line-height: 1.65;
      font-weight: 650;
      margin: 0;
      min-height: 0;
      text-shadow: 0 3px 14px rgba(35, 0, 55, 0.24);
    }

    .collection-count {
      grid-column: 2;
      grid-row: 1;
      min-height: 46px;
      width: 100%;
      padding: 0 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(135deg, rgba(116, 58, 190, 0.96), rgba(211, 73, 222, 0.88));
      color: #fff;
      border: 1px solid rgba(255,255,255,0.30);
      box-shadow:
        0 13px 30px rgba(65, 8, 95, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.35);
      font-weight: 950;
      font-size: 1rem;
      text-shadow: 0 2px 12px rgba(35,0,55,.24);
      white-space: nowrap;
    }

    .browse-btn {
      grid-column: 2;
      grid-row: 2 / 4;
      min-height: 52px;
      width: 100%;
      padding: 0 18px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(135deg, rgba(143, 80, 200, 0.98), rgba(205, 70, 213, 0.92));
      color: #fff;
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow:
        0 14px 32px rgba(42, 0, 75, 0.26),
        inset 0 1px 0 rgba(255,255,255,0.32);
      font-weight: 950;
      font-size: .96rem;
      text-align: center;
      transition: transform .22s ease, box-shadow .22s ease;
    }

    .browse-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 38px rgba(42, 0, 75, 0.32),
        inset 0 1px 0 rgba(255,255,255,0.34);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: white;
      grid-column: 1 / -1;
      font-weight: 800;
    }

    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    .whatsapp-icon-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 900px) {
      .collections-grid {
        grid-template-columns: 1fr;
        gap: .95rem;
      }
    }

    @media (max-width: 768px) {
      .site-header {
        grid-template-columns: 52px 1fr 96px;
        min-height: 82px;
        padding: 10px 12px;
      }

      .site-header-logo img,
      .side-menu__logo img { max-height: 54px; }

      .site-menu-btn,
      .site-icon-btn {
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }

      .container {
        padding: 1.45rem .9rem 2rem;
      }

      .page-title {
        margin-bottom: 1.25rem;
      }

      .page-title h1 {
        font-size: 1.75rem;
      }

      .collection-card {
        grid-template-columns: minmax(0, 1fr) 126px;
        min-height: 145px;
        padding: .95rem;
        border-radius: 24px;
        gap: .55rem .72rem;
      }

      .collection-title {
        font-size: 1.03rem;
        line-height: 1.42;
      }

      .collection-description {
        font-size: .82rem;
        line-height: 1.55;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }

      .collection-count {
        min-height: 42px;
        padding: 0 10px;
        font-size: .92rem;
      }

      .browse-btn {
        min-height: 48px;
        border-radius: 16px;
        padding: 0 10px;
        font-size: .88rem;
      }
    }

    @media (max-width: 390px) {
      .container { padding-inline: .78rem; }

      .collection-card {
        grid-template-columns: minmax(0, 1fr) 118px;
        min-height: 140px;
        padding: .88rem;
        gap: .5rem .62rem;
      }

      .collection-title { font-size: .96rem; }
      .collection-description { font-size: .78rem; }
      .collection-count { min-height: 40px; font-size: .86rem; }
      .browse-btn { min-height: 44px; font-size: .82rem; }
    }
  </style>
</head>

  <div class="container">
    <div class="page-title">
      <h1>🏷️ جميع المجموعات</h1>
      <p>تسوق الآن</p>
    </div>

    <div class="collections-grid" id="collectionsGrid">
      <div class="loading">
        <h3>📦 جاري تحميل المجموعات...</h3>
        <p>يرجى الانتظار قليلاً</p>
      </div>
    </div>

  <script>
    const COLLECTIONS_API = '/api/collections';

    function escapeHtml(str) {
      return String(str || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeText(value, fallback = '') {
      const text = String(value ?? '').trim();
      return text || fallback;
    }

    function getCollectionUrl(collection) {
      const slug = safeText(collection.slug);
      const id = safeText(collection.id);

      if (slug) return `./collection.html?slug=${encodeURIComponent(slug)}`;
      return `./collection.html?id=${encodeURIComponent(id)}`;
    }

    async function fetchCollectionsFromApi() {
      const response = await fetch(`${COLLECTIONS_API}?status=active&limit=120&offset=0&sort=created_at&order=DESC`, {
        cache: 'no-store',
        headers: { Accept: 'application/json' }
      });

      const result = await response.json().catch(() => null);

      if (!response.ok || !result || !result.success) {
        throw new Error(result?.error || `HTTP ${response.status}`);
      }

      const collections = Array.isArray(result.data) ? result.data : [];

      return collections
        .filter(item => String(item.status || 'active').toLowerCase() !== 'archived')
        .map((item) => ({
          ...item,
          description: safeText(item.description, ''),
          product_count: Number(item.product_count || 0)
        }));
    }

    async function loadCollections() {
      try {
        const collections = await fetchCollectionsFromApi();
        renderCollections(collections);
      } catch (error) {
        console.error('خطأ في تحميل المجموعات:', error);
        showError(error?.message || '');
      }
    }

    function renderCollections(collections) {
      const grid = document.getElementById('collectionsGrid');

      if (!collections || collections.length === 0) {
        grid.innerHTML = `
          <div style="text-align:center; grid-column:1 / -1; padding:3rem; color:white;">
            <h3>⚠️ لا توجد مجموعات</h3>
          </div>
        `;
        return;
      }

      grid.innerHTML = collections.map(collection => {
        const url = getCollectionUrl(collection);
        const title = safeText(collection.title, 'مجموعة');
        const description = safeText(collection.description, '');
        const count = Number(collection.product_count || 0);

        return `
          <div class="collection-card" data-url="${escapeHtml(url)}">
            <h3 class="collection-title">${escapeHtml(title)}</h3>
            ${description ? `<p class="collection-description">${escapeHtml(description)}</p>` : ``}
            <div class="collection-count">${count} منتج</div>
            <a href="${url}" class="browse-btn">تصفح المجموعة</a>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.collection-card').forEach(card => {
        card.addEventListener('click', (e) => {
          const a = e.target.closest('a');
          if (a) return;
          const url = safeText(card.getAttribute('data-url'));
          if (url) window.location.href = url;
        });
      });
    }

    function showError(message = '') {
      const grid = document.getElementById('collectionsGrid');
      grid.innerHTML = `
        <div style="text-align:center; grid-column:1 / -1; padding:3rem; color:#fff;">
          <h3>⚠️ خطأ في تحميل المجموعات</h3>
          <p style="margin-top:.5rem;">تأكد أن API المجموعات تعمل بشكل صحيح</p>
          ${message ? `<p style="margin-top:.5rem; opacity:.9;">${escapeHtml(message)}</p>` : ''}
        </div>
      `;
    }

    function openMenu() { document.body.classList.add('menu-open'); }
    function closeMenu() { document.body.classList.remove('menu-open'); }

    document.addEventListener('DOMContentLoaded', () => {
      loadCollections();

      const menuBtn = document.getElementById('menuBtn');
      const menuClose = document.getElementById('menuClose');
      const menuBackdrop = document.getElementById('menuBackdrop');

      if (menuBtn) menuBtn.addEventListener('click', openMenu);
      if (menuClose) menuClose.addEventListener('click', closeMenu);
      if (menuBackdrop) menuBackdrop.addEventListener('click', closeMenu);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
      });
    });
  </script>
