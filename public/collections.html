<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المجموعات - Smart Kids Kuwait</title>
  <meta name="description" content="تصفح مجموعات Smart Kids Kuwait المتنوعة - مونتيسوري، القصص التفاعلية، الكتب الإسلامية وأكثر">
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-dark: #6a4c93;
      --purple-light: #9b59b6;
      --header-blue: #3160e0;
      --topbar-bg: #3f0448;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a4c93 0%, #9b59b6 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; }

    .topbar {
      background: var(--topbar-bg);
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .topbar-arrow {
      font-size: 1.2rem;
      line-height: 1;
      flex: 0 0 auto;
    }

    .site-header {
      background: #fff;
      min-height: 86px;
      display: grid;
      grid-template-columns: 92px 1fr 52px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .site-header-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .site-icon-btn,
    .site-menu-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      text-decoration: none;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
    }

    .site-header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .site-header-logo img {
      width: 320px;
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      display: block;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .page-title {
      text-align: center;
      color: #fff;
      margin-bottom: 1.5rem;
    }

    .page-title h1 {
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
      font-weight: 800;
    }

    .page-title p {
      opacity: .95;
      font-size: 1rem;
    }

    .collections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
      margin: 0;
    }

    .collection-card {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      transition: all 0.3s;
      text-align: center;
      cursor: pointer;
    }

    .collection-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .collection-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }

    .collection-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--purple-dark);
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .collection-description {
      color: #555;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 52px;
    }

    .collection-count {
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 1rem;
    }

    .browse-btn {
      width: 100%;
      padding: 12px 24px;
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
      border: none;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: white;
      grid-column: 1 / -1;
    }

    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    .whatsapp-icon-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 768px) {
      .site-header {
        grid-template-columns: 92px 1fr 52px;
        min-height: 82px;
        padding: 10px 12px;
      }

      .site-header-logo img {
        max-height: 54px;
      }

      .site-icon-btn,
      .site-menu-btn {
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }

      .container {
        padding: 1.5rem 1rem 2rem;
      }

      .page-title h1 {
        font-size: 1.45rem;
      }

      .collections-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .collection-card {
        padding: 1.5rem;
      }

      .collection-title {
        font-size: 1.15rem;
      }

      .collection-description {
        font-size: 0.9rem;
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="topbar-arrow">←</span>
    <span>التوصيل مجاناً للطلبات بقيمة 20 د.ك أو أكثر</span>
  </div>

  <header class="site-header">
    <div class="site-header-icons">
      <a href="./index.html" class="site-icon-btn" aria-label="الرئيسية">🏠</a>
      <a href="./products-full.html" class="site-icon-btn" aria-label="بحث">🔍</a>
    </div>

    <div class="site-header-logo">
      <img src="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Logo_smart_kids-of-header-tag.png?v=1756574543" alt="Smart Kids Kuwait Logo">
    </div>

    <button class="site-menu-btn" type="button" aria-label="القائمة" onclick="window.location.href='./index.html'">☰</button>
  </header>

  <a href="https://wa.me/96566635393" target="_blank" class="whatsapp-float" title="تواصل عبر واتساب">
    <img src="/whatsapp-icon.png" alt="WhatsApp" class="whatsapp-icon-img">
  </a>

  <div class="container">
    <div class="page-title">
      <h1>جميع المجموعات</h1>
      <p>اختر المجموعة المناسبة لطفلك</p>
    </div>

    <div class="collections-grid" id="collectionsGrid">
      <div class="loading">
        <h3>📦 جاري تحميل المجموعات...</h3>
        <p>يرجى الانتظار</p>
      </div>
    </div>
  </div>

  <script src="./collections-manager.js"></script>
  <script>
    async function loadCollections() {
      try {
        const manager = window.initCollectionsManager();
        await manager.loadProducts();
        const collections = manager.getAllCollections();
        renderCollections(collections);
      } catch (error) {
        console.error('خطأ في تحميل المجموعات:', error);
        showError();
      }
    }

    function renderCollections(collections) {
      const grid = document.getElementById('collectionsGrid');

      if (!collections || collections.length === 0) {
        grid.innerHTML = `
          <div style="text-align:center; grid-column:1 / -1; padding:3rem; color:white;">
            <h3>⚠️ لا توجد مجموعات</h3>
          </div>
        `;
        return;
      }

      grid.innerHTML = collections.map(collection => `
        <div class="collection-card" onclick="openCollection('${collection.key}')">
          <span class="collection-icon">${collection.icon}</span>
          <h3 class="collection-title">${collection.name}</h3>
          <p class="collection-description">${collection.description}</p>
          <div class="collection-count">${collection.productCount || 0} منتج</div>
          <a href="./collection.html?id=${encodeURIComponent(collection.key)}" class="browse-btn" onclick="event.stopPropagation()">تصفح المجموعة</a>
        </div>
      `).join('');
    }

    function openCollection(collectionKey) {
      window.location.href = `./collection.html?id=${encodeURIComponent(collectionKey)}`;
    }

    function showError() {
      const grid = document.getElementById('collectionsGrid');
      grid.innerHTML = `
        <div style="text-align:center; grid-column:1 / -1; padding:3rem; color:#fff;">
          <h3>⚠️ خطأ في تحميل المجموعات</h3>
          <p style="margin-top:.5rem;">تأكد من وجود collections-manager.js وملف المنتجات</p>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', loadCollections);
  </script>

  <footer style="background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); padding: 2rem 1rem; margin-top: 3rem; border-top: 1px solid rgba(255,255,255,0.3);">
    <div style="max-width: 900px; margin: 0 auto; text-align: center;">
      <p style="color: #666; font-size: 0.9rem;">&copy; 2024 Smart Kids Kuwait - تابعونا لآخر العروض</p>
    </div>
  </footer>
</body>
</html>
