<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المجموعات - Smart Kids Kuwait</title>
  <meta name="description" content="تصفح جميع المجموعات في Smart Kids Kuwait">
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457">
  <script src="/js/meta-pixel.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --purple-dark: #6a4c93;
      --purple-light: #9b59b6;
      --header-blue: #3160e0;
      --topbar-bg: #3f0448;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a4c93 0%, #9b59b6 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; }

    .topbar {
      background: var(--topbar-bg);
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .topbar-arrow { font-size: 1.2rem; line-height: 1; flex: 0 0 auto; }

    .site-header {
      background: #fff;
      min-height: 86px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .site-menu-btn,
    .site-icon-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      text-decoration: none;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      position: relative;
    }

    .site-header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .site-header-logo img {
      width: 320px;
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      display: block;
    }

    .site-header-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 1190;
    }

    body.menu-open .menu-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(92vw, 400px);
      height: 100vh;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(18px);
      border-left: 1px solid rgba(0,0,0,0.08);
      box-shadow: -12px 0 30px rgba(0,0,0,0.18);
      z-index: 1200;
      transform: translateX(105%);
      transition: transform .25s ease;
      display: flex;
      flex-direction: column;
    }

    body.menu-open .side-menu { transform: translateX(0); }

    .side-menu__head {
      min-height: 82px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      flex-shrink: 0;
      background: #fff;
    }

    .side-menu__close {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    .side-menu__logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .side-menu__logo img {
      width: 300px;
      max-width: 100%;
      max-height: 56px;
      object-fit: contain;
      display: block;
    }

    .side-menu__icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .side-menu__body {
      flex: 1;
      overflow: auto;
      padding: 8px 0 0;
      background: #4a064f;
      color: #fff;
    }

    .side-menu__nav a {
      display: block;
      padding: 18px 26px;
      font-size: 1.08rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,.05);
      color: #fff;
    }

    .side-menu__footer {
      padding: 18px 22px 24px;
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      color: #fff;
    }

    .side-menu__social {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .side-menu__social a {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .side-menu__social img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .page-title {
      text-align: center;
      color: #fff;
      margin-bottom: 1.5rem;
    }

    .page-title h1 {
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
      font-weight: 800;
    }

    .page-title p { opacity: .95; font-size: 1rem; }

    .collections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin: 0;
    }

    .collection-card {
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 1.15rem;
      box-shadow: 0 8px 24px rgba(31, 38, 135, 0.24);
      transition: all 0.3s;
      text-align: center;
      cursor: pointer;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
    }

    .collection-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 34px rgba(0,0,0,0.22);
    }

    .collection-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--purple-dark);
      margin-bottom: 0.65rem;
      line-height: 1.45;
    }

    .collection-description {
      color: #555;
      margin-bottom: 1rem;
      font-size: 0.88rem;
      line-height: 1.55;
      min-height: 56px;
      display: none;
    }

    .collection-count {
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 0.9rem;
      font-size: .9rem;
    }

    .browse-btn {
      width: 100%;
      padding: 11px 18px;
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      font-size: .95rem;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: white;
      grid-column: 1 / -1;
    }

    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    .whatsapp-icon-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 768px) {
      .site-header {
        grid-template-columns: 52px 1fr 96px;
        min-height: 82px;
        padding: 10px 12px;
      }
      .site-header-logo img,
      .side-menu__logo img { max-height: 54px; }

      .site-menu-btn,
      .site-icon-btn { width: 40px; height: 40px; font-size: 1.5rem; }

      .container { padding: 1.5rem 1rem 2rem; }
      .page-title h1 { font-size: 1.45rem; }

      .collections-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; }
      .collection-card { padding: 1rem; min-height: 220px; }
      .collection-title { font-size: 0.95rem; }
      .collection-description { font-size: 0.82rem; min-height: 48px; }
      .browse-btn { font-size: .9rem; }
    }

    @media (max-width: 420px) {
      .collections-grid { grid-template-columns: 1fr 1fr; }
    }

      margin-bottom: 2rem !important;

      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,0.36), transparent 18%),

    .collection-card:hover {

    .collection-title {
      color: #fff !important;
      font-size: clamp(1.05rem, 3.2vw, 1.3rem) !important;
      font-weight: 900 !important;
      line-height: 1.38 !important;
      margin-bottom: .78rem !important;
      text-shadow: 0 4px 20px rgba(36, 0, 64, 0.46) !important;

      line-clamp: 2;

    .collection-description {
      display: block !important;
      color: rgba(255,255,255,0.82) !important;
      font-size: .93rem !important;
      line-height: 1.7 !important;
      font-weight: 650 !important;
      margin: 0 auto 1rem !important;
      min-height: 3.2em !important;
      max-width: 95% !important;

      overflow: hidden;
    }

    .collection-count {
      min-height: 50px !important;
      min-width: 150px !important;

      margin: auto auto 1rem !important;
      border-radius: 999px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      background:
        linear-gradient(135deg, rgba(116, 58, 190, 0.96), rgba(211, 73, 222, 0.88)) !important;
      color: #fff !important;
      border: 1px solid rgba(255,255,255,0.30) !important;
      box-shadow:
        0 13px 30px rgba(65, 8, 95, 0.30),

      font-size: 1.02rem !important;

    }

    .browse-btn {
      min-height: 54px !important;
      padding: 0 20px !important;
      border-radius: 18px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      background:
        linear-gradient(135deg, rgba(143, 80, 200, 0.98), rgba(205, 70, 213, 0.92)) !important;
      color: #fff !important;
      border: 1px solid rgba(255,255,255,0.28) !important;
      box-shadow:
        0 14px 32px rgba(42, 0, 75, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.32) !important;
      font-weight: 900 !important;
      transition: transform .22s ease, box-shadow .22s ease !important;
    }

    .browse-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 38px rgba(42, 0, 75, 0.34),
        inset 0 1px 0 rgba(255,255,255,0.34) !important;
    }

    /* Footer polish — works with footer.js injected markup */
    #site-footer,
    .site-footer,
    footer {
      position: relative !important;
      overflow: hidden !important;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 122, 225, 0.20), transparent 25%),
        radial-gradient(circle at 82% 30%, rgba(99, 143, 255, 0.15), transparent 28%),
        linear-gradient(180deg, #5b106c 0%, #6f1580 48%, #4a0757 100%) !important;
      color: #fff !important;
      padding: 34px 18px 32px !important;
      border-top: 1px solid rgba(255,255,255,0.12) !important;
    }

    #site-footer::before,
    .site-footer::before,
    footer::before {
      content: "" !important;
      position: absolute !important;
      width: 360px !important;
      height: 360px !important;
      right: -145px !important;
      top: -155px !important;
      border-radius: 48% 52% 58% 42% !important;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,0.34), transparent 16%),
        radial-gradient(circle at 50% 50%, rgba(196, 79, 255, 0.36), transparent 42%),
        radial-gradient(circle at 72% 70%, rgba(76, 135, 255, 0.18), transparent 48%) !important;
      filter: blur(4px) !important;
      opacity: .62 !important;
      pointer-events: none !important;
    }

    #site-footer::after,
    .site-footer::after,
    footer::after {
      content: "" !important;
      position: absolute !important;
      width: 300px !important;
      height: 300px !important;
      left: -135px !important;
      bottom: -150px !important;
      border-radius: 58% 42% 48% 52% !important;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.26), transparent 18%),
        radial-gradient(circle at 50% 50%, rgba(255, 104, 214, 0.24), transparent 44%),
        radial-gradient(circle at 72% 70%, rgba(128, 93, 255, 0.20), transparent 50%) !important;
      filter: blur(5px) !important;
      opacity: .60 !important;
      pointer-events: none !important;
    }

    #site-footer > *,
    .site-footer > *,
    footer > * {
      position: relative !important;
      z-index: 2 !important;
    }

    #site-footer,
    .site-footer,
    footer {
      font-size: clamp(14px, 2.8vw, 18px) !important;
      line-height: 1.55 !important;
    }

    #site-footer h1,
    #site-footer h2,
    #site-footer h3,
    .site-footer h1,
    .site-footer h2,
    .site-footer h3,
    footer h1,

    #site-footer a,
    .site-footer a,

      text-decoration: none !important;

    #site-footer a[href*="privacy"],

    #site-footer a[href*="terms"],
    #site-footer a[href*="contact"],
    .site-footer a[href*="privacy"],
    .site-footer a[href*="refund"],
    .site-footer a[href*="shipping"],
    .site-footer a[href*="terms"],
    .site-footer a[href*="contact"],

  <div class="container">
    <div class="page-title">
      <h1>🏷️ جميع المجموعات</h1>
      <p>تسوق الآن</p>
    </div>

    <div class="collections-grid" id="collectionsGrid">
      <div class="loading">
        <h3>📦 جاري تحميل المجموعات...</h3>
        <p>يرجى الانتظار قليلاً</p>
      </div>
    </div>

  <script>
    const COLLECTIONS_API = '/api/collections';

    function escapeHtml(str) {
      return String(str || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeText(value, fallback = '') {
      const text = String(value ?? '').trim();
      return text || fallback;
    }

    function getCollectionUrl(collection) {
      const slug = safeText(collection.slug);
      const id = safeText(collection.id);

      if (slug) return `./collection.html?slug=${encodeURIComponent(slug)}`;
      return `./collection.html?id=${encodeURIComponent(id)}`;
    }

    async function fetchCollectionsFromApi() {
      const response = await fetch(`${COLLECTIONS_API}?status=active&limit=120&offset=0&sort=created_at&order=DESC`, {
        cache: 'no-store',
        headers: { Accept: 'application/json' }
      });

      const result = await response.json().catch(() => null);

      if (!response.ok || !result || !result.success) {
        throw new Error(result?.error || `HTTP ${response.status}`);
      }

      const collections = Array.isArray(result.data) ? result.data : [];

      return collections
        .filter(item => String(item.status || 'active').toLowerCase() !== 'archived')
        .map((item) => ({
          ...item,
          description: safeText(item.description, ''),
          product_count: Number(item.product_count || 0)
        }));
    }

    async function loadCollections() {
      try {
        const collections = await fetchCollectionsFromApi();
        renderCollections(collections);
      } catch (error) {
        console.error('خطأ في تحميل المجموعات:', error);
        showError(error?.message || '');
      }
    }

    function renderCollections(collections) {
      const grid = document.getElementById('collectionsGrid');

      if (!collections || collections.length === 0) {
        grid.innerHTML = `
          <div style="text-align:center; grid-column:1 / -1; padding:3rem; color:white;">
            <h3>⚠️ لا توجد مجموعات</h3>
          </div>
        `;
        return;
      }

      grid.innerHTML = collections.map(collection => {
        const url = getCollectionUrl(collection);
        const title = safeText(collection.title, 'مجموعة');
        const description = safeText(collection.description, '');
        const count = Number(collection.product_count || 0);

        return `
          <div class="collection-card" data-url="${escapeHtml(url)}">
            <h3 class="collection-title">${escapeHtml(title)}</h3>
            ${description ? `<p class="collection-description">${escapeHtml(description)}</p>` : ``}
            <div class="collection-count">${count} منتج</div>
            <a href="${url}" class="browse-btn">تصفح المجموعة</a>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.collection-card').forEach(card => {
        card.addEventListener('click', (e) => {
          const a = e.target.closest('a');
          if (a) return;
          const url = safeText(card.getAttribute('data-url'));
          if (url) window.location.href = url;
        });
      });
    }

    function showError(message = '') {
      const grid = document.getElementById('collectionsGrid');
      grid.innerHTML = `
        <div style="text-align:center; grid-column:1 / -1; padding:3rem; color:#fff;">
          <h3>⚠️ خطأ في تحميل المجموعات</h3>
          <p style="margin-top:.5rem;">تأكد أن API المجموعات تعمل بشكل صحيح</p>
          ${message ? `<p style="margin-top:.5rem; opacity:.9;">${escapeHtml(message)}</p>` : ''}
        </div>
      `;
    }

    function openMenu() { document.body.classList.add('menu-open'); }
    function closeMenu() { document.body.classList.remove('menu-open'); }

    document.addEventListener('DOMContentLoaded', () => {
      loadCollections();

      const menuBtn = document.getElementById('menuBtn');
      const menuClose = document.getElementById('menuClose');
      const menuBackdrop = document.getElementById('menuBackdrop');

      if (menuBtn) menuBtn.addEventListener('click', openMenu);
      if (menuClose) menuClose.addEventListener('click', closeMenu);
      if (menuBackdrop) menuBackdrop.addEventListener('click', closeMenu);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
      });
    });
  </script>
