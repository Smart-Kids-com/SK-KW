<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رمز التحقق - Smart Kids Kuwait</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Segoe UI,Tahoma,Arial,sans-serif;
      background:linear-gradient(135deg,#f5f1fb 0%,#ebe3f7 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:#2d2340;
    }
    .card{
      width:100%;
      max-width:520px;
      background:#fff;
      border:1px solid #e7ddf4;
      border-radius:20px;
      box-shadow:0 18px 48px rgba(106,76,147,.12);
      padding:28px;
    }
    .brand{
      text-align:center;
      margin-bottom:16px;
    }
    .brand h1{
      font-size:24px;
      color:#6a4c93;
      margin-bottom:6px;
    }
    .brand p{
      color:#6e6680;
      font-size:14px;
    }
    .error{
      background:#ffe9ea;
      color:#a9353f;
      border:1px solid #f3c8cc;
      padding:12px 14px;
      border-radius:12px;
      margin-bottom:16px;
      font-size:14px;
    }
    .field{
      margin-bottom:14px;
    }
    label{
      display:block;
      margin-bottom:8px;
      font-weight:700;
      color:#4e3a70;
      font-size:14px;
    }
    input{
      width:100%;
      padding:14px 16px;
      border:1px solid #d8c9ef;
      border-radius:14px;
      font-size:18px;
      outline:none;
      letter-spacing:3px;
      text-align:center;
    }
    input:focus{
      border-color:#8c63c9;
      box-shadow:0 0 0 4px rgba(140,99,201,.12);
    }
    button{
      width:100%;
      border:none;
      border-radius:14px;
      background:#6a4c93;
      color:#fff;
      padding:14px 16px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }
    button:hover{
      background:#5e4485;
    }
    .setup{
      margin-top:18px;
      padding-top:18px;
      border-top:1px solid #eee;
    }
    .qr{
      display:flex;
      justify-content:center;
      margin:14px 0;
    }
    .qr img{
      width:220px;
      height:220px;
      border:1px solid #e7ddf4;
      border-radius:12px;
      padding:10px;
      background:#fff;
    }
    .secretBox{
      background:#faf7ff;
      border:1px solid #e7ddf4;
      border-radius:12px;
      padding:12px;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:13px;
      word-break:break-all;
      margin-top:10px;
    }
    .copyBtn{
      margin-top:10px;
      background:#4e3a70;
    }
    .small{
      font-size:12px;
      color:#857a99;
      margin-top:8px;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>رمز التحقق (Google Authenticator)</h1>
      <p>أدخل كود 6 أرقام</p>
    </div>

    <!-- لو فيه خطأ -->
    <!-- <div class="error">OTP غير صحيح</div> -->

    <form method="POST" action="/admin-otp">
      <input type="hidden" name="next" value="/admin-enhanced" />
      <div class="field">
        <label for="otp">رمز التحقق</label>
        <input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required />
      </div>
      <button type="submit">تأكيد</button>
    </form>

    <div class="setup">
      <div class="small">
        لو أول مرة: افتح Google Authenticator → اضغط (+) → Scan QR أو أدخل الـ Secret يدويًا.
      </div>

      <!-- QR -->
      <!-- <div class="qr"><img alt="QR" src="data:image/png;base64,..." /></div> -->

      <div class="small">OTP URI (لو محتاجه):</div>
      <div class="secretBox">otpauth://totp/...</div>

      <div class="small">Secret (للنسخ اليدوي):</div>
      <div class="secretBox" id="secret">ADMIN_OTP_SECRET_HERE</div>

      <button class="copyBtn" type="button" onclick="copySecret()">Copy Secret</button>

      <div class="small">
        ملاحظة: الكود بيتغير كل ~30 ثانية.
      </div>
    </div>
  </div>

  <script>
    function copySecret(){
      var el = document.getElementById('secret');
      var text = (el && el.textContent) ? el.textContent : '';
      if(!text) return;
      navigator.clipboard.writeText(text).then(function(){
        alert('تم نسخ الـ Secret');
      }).catch(function(){
        prompt('انسخ الـ Secret يدويًا:', text);
      });
    }
  </script>
</body>
</html>
