<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Kids Kuwait - Orders Dashboard</title>
  <script src="/config/system.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#f3f3f3;
      --card:#ffffff;
      --text:#1d1d1f;
      --muted:#7a7a7d;
      --line:#e7e7ea;
      --black:#000000;
      --green:#7bed57;
      --chip-yellow:#efe17a;
      --chip-yellow-text:#5b4d00;
      --chip-beige:#eacb98;
      --chip-beige-text:#5c4520;
      --danger:#db5b5b;
      --blue:#5aa0ef;
      --radius-xl:38px;
      --radius-lg:24px;
      --radius-md:18px;
      --radius-sm:14px;
      --shadow:0 10px 30px rgba(0,0,0,.06);
    }

    body{
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,input,select,textarea{
      font-family:inherit;
    }

    a{color:inherit;text-decoration:none}

    .app-header{
      background:#000;
      color:#fff;
      padding:20px 18px 26px;
    }

    .app-header-inner{
      max-width:1280px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
    }

    .brand-icon{
      width:62px;
      height:62px;
      border-radius:18px;
      background:var(--green);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#173c12;
      font-size:1.7rem;
      flex:0 0 auto;
    }

    .brand-title{
      font-size:1.95rem;
      font-weight:900;
      line-height:1.08;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-sub{
      font-size:.9rem;
      color:#d0d0d0;
      margin-top:4px;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:12px;
      flex:0 0 auto;
    }

    .circle-icon{
      width:60px;
      height:60px;
      border-radius:50%;
      border:none;
      background:transparent;
      color:#fff;
      font-size:1.6rem;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo-avatar{
      width:60px;
      height:60px;
      border-radius:50%;
      overflow:hidden;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .logo-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .page{
      max-width:1280px;
      margin:-8px auto 0;
      padding:0 16px 24px;
    }

    .dashboard-shell{
      background:#fff;
      border-radius:42px;
      box-shadow:var(--shadow);
      overflow:hidden;
      border:1px solid #ededed;
    }

    .dashboard-top{
      padding:24px 20px 12px;
    }

    .dashboard-controls{
      display:grid;
      grid-template-columns:340px 260px 1fr;
      gap:14px;
      margin-bottom:22px;
      align-items:center;
    }

    .pill{
      min-height:66px;
      border:none;
      border-radius:20px;
      background:#f1f1f1;
      color:#2d2d2f;
      padding:0 22px;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:1.05rem;
      font-weight:700;
    }

    .pill select{
      width:100%;
      border:none;
      background:transparent;
      font-size:1.05rem;
      color:#2d2d2f;
      outline:none;
      appearance:none;
      font-weight:700;
      cursor:pointer;
    }

    .pill .dot{
      width:14px;
      height:14px;
      border-radius:50%;
      background:#63d98a;
      flex:0 0 auto;
    }

    .report-btn{
      justify-self:end;
      min-height:66px;
      padding:0 24px;
      border-radius:20px;
      border:1px solid #dcdcdc;
      background:#fff;
      font-size:1rem;
      font-weight:700;
      color:#2d2d2f;
      cursor:pointer;
    }

    .stats-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:32px;
      margin-bottom:18px;
      align-items:start;
    }

    .stat{
      min-width:0;
      text-align:left;
      direction:ltr;
    }

    .stat-label{
      color:#8a8a8e;
      font-size:1rem;
      margin-bottom:8px;
      font-weight:600;
    }

    .stat-value{
      font-size:2.15rem;
      line-height:1.02;
      font-weight:800;
      color:#252525;
      letter-spacing:-.4px;
      word-break:break-word;
    }

    .stat-change{
      margin-top:6px;
      color:#7cab87;
      font-size:1rem;
      font-weight:700;
      line-height:1.15;
    }

    .chart-wrap{
      padding:4px 0 0;
    }

    .chart-card{
      height:355px;
      position:relative;
      border-radius:24px;
      overflow:hidden;
    }

    .chart-svg{
      width:100%;
      height:100%;
      display:block;
    }

    .chart-empty{
      height:355px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9a9a9a;
      font-size:1rem;
      background:linear-gradient(180deg,#fafafa,#f4f4f4);
      border-radius:24px;
    }

    .quick-links{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
      padding:18px 20px 26px;
    }

    .quick-card{
      background:#f7f7f7;
      border:1px solid #ececec;
      border-radius:22px;
      padding:20px 20px 18px;
      min-height:152px;
      cursor:pointer;
      transition:.15s ease;
      text-align:left;
      direction:ltr;
    }

    .quick-card:hover{
      background:#f2f2f2;
    }

    .quick-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }

    .quick-icon{
      font-size:1.8rem;
      color:#555;
    }

    .quick-value{
      font-size:2.05rem;
      font-weight:900;
      line-height:1;
      color:#222;
    }

    .quick-title{
      font-size:1rem;
      font-weight:500;
      color:#2f2f2f;
      line-height:1.35;
    }

    .quick-sub{
      font-size:.9rem;
      color:#6d6d72;
      margin-top:4px;
      line-height:1.35;
    }

    .alert{
      display:none;
      margin:14px 0;
      padding:14px 16px;
      border-radius:16px;
      font-weight:700;
    }

    .alert.active{display:block}
    .alert.success{background:#eaf9ef;color:#17784a;border:1px solid #bfe6cd}
    .alert.error{background:#fff1f1;color:#9a2d2d;border:1px solid #efc2c2}

    .orders-shell{
      margin-top:16px;
      background:#fff;
      border-radius:34px;
      box-shadow:var(--shadow);
      border:1px solid #ededed;
      overflow:hidden;
    }

    .orders-head{
      padding:20px 16px 12px;
      border-bottom:1px solid #efefef;
    }

    .orders-title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .orders-title{
      font-size:2rem;
      font-weight:900;
      line-height:1.1;
      direction:ltr;
      text-align:left;
    }

    .orders-head-tools{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      direction:ltr;
    }

    .tool-circle{
      width:60px;
      height:60px;
      border:none;
      border-radius:50%;
      background:#f1f1f1;
      color:#333;
      font-size:1.5rem;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .tool-pill{
      min-height:60px;
      padding:0 24px;
      border:none;
      border-radius:999px;
      background:#f1f1f1;
      color:#2a2a2a;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
    }

    .search-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 76px 76px;
      gap:12px;
      margin-bottom:12px;
      direction:ltr;
    }

    .search-box{
      position:relative;
    }

    .search-box input{
      width:100%;
      height:66px;
      border:none;
      border-radius:22px;
      background:#f1f1f1;
      padding:0 20px 0 58px;
      font-size:1.05rem;
      color:#222;
      outline:none;
    }

    .search-box input::placeholder{color:#a5a5a8}

    .search-icon{
      position:absolute;
      left:18px;
      top:50%;
      transform:translateY(-50%);
      font-size:1.55rem;
      color:#8f8f94;
      pointer-events:none;
    }

    .tabs-row{
      display:flex;
      gap:12px;
      overflow:auto;
      padding-bottom:4px;
      scrollbar-width:none;
      direction:ltr;
      justify-content:flex-start;
    }

    .tabs-row::-webkit-scrollbar{display:none}

    .tab{
      border:none;
      background:transparent;
      font-size:1rem;
      font-weight:700;
      color:#2e2e2e;
      padding:12px 18px;
      border-radius:999px;
      cursor:pointer;
      white-space:nowrap;
    }

    .tab.active{background:#efefef}

    .list-day{
      padding:12px 16px;
      background:#f2f2f2;
      color:#707070;
      font-size:.95rem;
      font-weight:700;
      border-top:1px solid #efefef;
      border-bottom:1px solid #efefef;
      direction:ltr;
      text-align:left;
    }

    .loading{
      display:none;
      padding:36px 16px;
      text-align:center;
      color:#666;
      font-size:1rem;
      background:#fff;
    }

    .loading.active{display:block}

    .orders-list{
      background:#fff;
    }

    .order-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:14px;
      padding:18px 16px;
      border-bottom:1px solid #ececec;
      cursor:pointer;
      transition:.15s ease;
      background:#fff;
      direction:ltr;
    }

    .order-row:hover{background:#fafafa}

    .order-number{
      font-size:1.18rem;
      font-weight:900;
      margin-bottom:8px;
      line-height:1.2;
      text-align:left;
    }

    .order-meta{
      color:#313131;
      font-size:.98rem;
      line-height:1.6;
      margin-bottom:8px;
      text-align:left;
    }

    .order-badges{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:8px;
      justify-content:flex-start;
    }

    .chip{
      min-height:34px;
      padding:0 14px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:.9rem;
      font-weight:700;
      cursor:pointer;
      border:none;
      white-space:nowrap;
    }

    .chip.fulfillment{
      background:var(--chip-yellow);
      color:var(--chip-yellow-text);
    }

    .chip.payment{
      background:var(--chip-beige);
      color:var(--chip-beige-text);
    }

    .order-note{
      color:#313131;
      font-size:.96rem;
      line-height:1.55;
      text-align:left;
    }

    .order-amount{
      font-size:1.08rem;
      font-weight:500;
      white-space:nowrap;
      align-self:start;
      padding-top:4px;
      text-align:right;
    }

    .desktop-table-wrap{
      display:none;
      background:#fff;
      border-top:1px solid #efefef;
    }

    .desktop-table{
      width:100%;
      border-collapse:collapse;
    }

    .desktop-table th,
    .desktop-table td{
      padding:16px;
      border-bottom:1px solid #ececec;
      text-align:left;
      vertical-align:top;
      direction:ltr;
    }

    .desktop-table th{
      background:#fafafa;
      font-size:.9rem;
      color:#6c6c6c;
      font-weight:800;
    }

    .desktop-table tbody tr{cursor:pointer}
    .desktop-table tbody tr:hover{background:#fafafa}

    .row-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .small-btn{
      min-height:36px;
      padding:0 12px;
      border:none;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }

    .small-btn.view{background:#e8f0ff;color:#275dd8}
    .small-btn.edit{background:#fff0cf;color:#986800}
    .small-btn.delete{background:#ffe0e0;color:#b33434}

    .empty-state{
      padding:42px 16px;
      text-align:center;
      color:#888;
      background:#fff;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:50;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    .modal.active{display:flex}

    .modal-content{
      width:100%;
      max-width:760px;
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:24px;
      padding:18px;
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
      direction:ltr;
    }

    .modal-header h2{
      font-size:1.3rem;
      font-weight:800;
    }

    .close-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      background:#f3f3f3;
      font-size:1.5rem;
    }

    .form-group{margin-bottom:14px}
    .form-group label{
      display:block;
      margin-bottom:7px;
      font-weight:700;
      direction:ltr;
      text-align:left;
    }

    .form-group input,
    .form-group select,
    .form-group textarea{
      width:100%;
      min-height:50px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 14px;
      font-size:1rem;
      background:#fff;
      direction:ltr;
      text-align:left;
    }

    .form-group textarea{
      min-height:110px;
      resize:vertical;
    }

    .modal-footer{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-top:18px;
      direction:ltr;
    }

    .modal-footer button{
      min-height:46px;
      padding:0 18px;
      border:none;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{background:#111;color:#fff}
    .btn-secondary{background:#f3f3f3;color:#222}

    .items-list-box > div{
      border:1px solid var(--line);
      padding:12px;
      border-radius:14px;
      margin-bottom:10px;
      background:#fafafa;
    }

    .inline-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr auto;
      gap:8px;
      direction:ltr;
    }

    @media (min-width: 1024px){
      .orders-list{display:none}
      .desktop-table-wrap{display:block}
    }

    @media (max-width: 1023px){
      .dashboard-controls{
        grid-template-columns:1fr 1fr;
        gap:12px;
      }

      .report-btn{
        display:none;
      }
    }

    @media (max-width: 560px){
      .app-header{
        padding:18px 14px 22px;
      }

      .brand-title{
        font-size:1.55rem;
      }

      .brand-icon,
      .logo-avatar,
      .circle-icon{
        width:56px;
        height:56px;
      }

      .page{
        padding:0 10px 18px;
      }

      .dashboard-shell{
        border-radius:34px;
      }

      .dashboard-top{
        padding:16px 14px 8px;
      }

      .dashboard-controls{
        grid-template-columns:1fr 1fr;
        gap:12px;
        margin-bottom:18px;
      }

      .pill{
        min-height:62px;
        font-size:.98rem;
        padding:0 18px;
      }

      .pill select{
        font-size:.98rem;
      }

      .stats-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:18px;
        margin-bottom:12px;
      }

      .stat-label{
        font-size:.92rem;
        margin-bottom:6px;
      }

      .stat-value{
        font-size:1.45rem;
      }

      .stat-change{
        font-size:.82rem;
        line-height:1.2;
      }

      .chart-card,
      .chart-empty{
        height:280px;
      }

      .quick-links{
        grid-template-columns:1fr 1fr;
        gap:14px;
        padding:14px 14px 20px;
      }

      .quick-card{
        min-height:138px;
        padding:16px 16px 14px;
        border-radius:20px;
      }

      .quick-value{
        font-size:1.75rem;
      }

      .quick-title{
        font-size:.96rem;
      }

      .quick-sub{
        font-size:.82rem;
      }

      .orders-title{
        font-size:1.7rem;
      }

      .orders-title-row{
        flex-wrap:wrap;
      }

      .orders-head-tools{
        width:100%;
        justify-content:space-between;
      }

      .search-row{
        grid-template-columns:minmax(0,1fr) 66px 66px;
      }

      .tool-circle{
        width:52px;
        height:52px;
      }

      .tool-pill{
        min-height:52px;
        padding:0 18px;
      }

      .inline-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width: 420px){
      .stats-grid{
        grid-template-columns:1fr;
      }

      .quick-links{
        grid-template-columns:1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <div class="brand-icon">🏬</div>
        <div>
          <div class="brand-title">الأطفال المبتكرون الكويت</div>
          <div class="brand-sub">Smart Kids Kuwait Admin</div>
        </div>
      </div>

      <div class="header-actions">
        <button class="circle-icon" type="button" onclick="showAlert('Notifications view not connected yet','success')">🔔</button>
        <div class="logo-avatar">
          <img src="https://smartkidskw.com/logo-sk-smart-kids.png" alt="Smart Kids Kuwait">
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="alert" class="alert"></div>

    <section class="dashboard-shell">
      <div class="dashboard-top">
        <div class="dashboard-controls" dir="ltr">
          <div class="pill">
            <select id="rangeSelect" onchange="changeRange()">
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="90" selected>Last 90 days</option>
              <option value="365">Last 365 days</option>
            </select>
          </div>

          <div class="pill">
            <span class="dot"></span>
            <span id="visitorsLabel">Live View</span>
          </div>

          <button class="report-btn" type="button" onclick="showAlert('Report is not connected yet','success')">Report</button>
        </div>

        <div class="stats-grid">
          <div class="stat">
            <div class="stat-label">Sessions</div>
            <div class="stat-value" id="sessionsValue">—</div>
            <div class="stat-change">Analytics source not connected</div>
          </div>

          <div class="stat">
            <div class="stat-label">Total sales</div>
            <div class="stat-value" id="totalSalesValue">KWD 0.000</div>
            <div class="stat-change" id="salesChangeValue">Based on last 90 days</div>
          </div>

          <div class="stat">
            <div class="stat-label">Orders</div>
            <div class="stat-value" id="ordersCountValue">0</div>
            <div class="stat-change" id="ordersChangeValue">In selected range</div>
          </div>
        </div>

        <div class="chart-wrap">
          <div id="chartContainer"></div>
        </div>
      </div>

      <div class="quick-links">
        <button class="quick-card" type="button" onclick="setDashboardFilter('pending')">
          <div class="quick-top">
            <div class="quick-value" id="pendingQuickValue">0</div>
            <div class="quick-icon">📦</div>
          </div>
          <div class="quick-title">Orders to fulfill</div>
          <div class="quick-sub">طلبات غير منفذة</div>
        </button>

        <button class="quick-card" type="button" onclick="setDashboardFilter('payment_pending')">
          <div class="quick-top">
            <div class="quick-value" id="paymentQuickValue">0</div>
            <div class="quick-icon">💬</div>
          </div>
          <div class="quick-title">Payments to capture</div>
          <div class="quick-sub">طلبات غير مدفوعة</div>
        </button>

        <button class="quick-card" type="button" onclick="setDashboardFilter('today')">
          <div class="quick-top">
            <div class="quick-value" id="todayQuickValue">0</div>
            <div class="quick-icon">📅</div>
          </div>
          <div class="quick-title">Today orders</div>
          <div class="quick-sub">طلبات اليوم</div>
        </button>

        <button class="quick-card" type="button" onclick="setDashboardFilter('all')">
          <div class="quick-top">
            <div class="quick-value" id="allQuickValue">0</div>
            <div class="quick-icon">🧾</div>
          </div>
          <div class="quick-title">All orders</div>
          <div class="quick-sub">كل الطلبات</div>
        </button>
      </div>
    </section>

    <section class="orders-shell">
      <div class="orders-head">
        <div class="orders-title-row">
          <div class="orders-title">Orders</div>
          <div class="orders-head-tools">
            <button class="tool-circle" type="button" onclick="toggleSortDirection()">⇅</button>
            <button class="tool-circle" type="button" onclick="focusSearch()">⌕</button>
            <button class="tool-pill" type="button" onclick="openNewOrderModal()">Add order</button>
          </div>
        </div>

        <div class="search-row">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input id="searchInput" type="text" placeholder="Filter orders" oninput="applyFilters()">
          </div>
          <button class="tool-circle" type="button" onclick="toggleSortDirection()">⇅</button>
          <button class="tool-circle" type="button" onclick="clearFilters()">≡</button>
        </div>

        <div class="tabs-row">
          <button class="tab active" data-tab="all" onclick="setTab('all', this)">All</button>
          <button class="tab" data-tab="pending" onclick="setTab('pending', this)">Unfulfilled</button>
          <button class="tab" data-tab="payment_pending" onclick="setTab('payment_pending', this)">Unpaid</button>
          <button class="tab" data-tab="open" onclick="setTab('open', this)">Open</button>
          <button class="tab" data-tab="processing" onclick="setTab('processing', this)">Processing</button>
          <button class="tab" data-tab="completed" onclick="setTab('completed', this)">Completed</button>
          <button class="tab" data-tab="cancelled" onclick="setTab('cancelled', this)">Cancelled</button>
          <button class="tab" data-tab="today" onclick="setTab('today', this)">Today</button>
        </div>
      </div>

      <div class="list-day" id="dayLabel">Orders</div>

      <div id="loading" class="loading active">Loading orders...</div>

      <div class="orders-list" id="mobileOrdersList"></div>

      <div class="desktop-table-wrap">
        <table class="desktop-table">
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Status</th>
              <th>Amount</th>
              <th>Note</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" id="editOrderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit order</h2>
        <button class="close-btn" onclick="closeModal('editOrderModal')">&times;</button>
      </div>

      <form id="editOrderForm" onsubmit="saveOrderChanges(event)">
        <input type="hidden" id="editOrderId">

        <div class="form-group">
          <label for="editOrderStatus">Status</label>
          <select id="editOrderStatus" required>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editOrderNotes">Notes</label>
          <textarea id="editOrderNotes"></textarea>
        </div>

        <div class="form-group">
          <label for="editOrderPhone">Phone</label>
          <input type="tel" id="editOrderPhone">
        </div>

        <div class="form-group">
          <label for="editOrderEmail">Email</label>
          <input type="email" id="editOrderEmail">
        </div>

        <div class="form-group">
          <label for="editOrderAddress">Address</label>
          <textarea id="editOrderAddress"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('editOrderModal')">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="newOrderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add order</h2>
        <button class="close-btn" onclick="closeModal('newOrderModal')">&times;</button>
      </div>

      <form id="newOrderForm" onsubmit="createNewOrder(event)">
        <div class="form-group">
          <label for="newOrderName">Customer name *</label>
          <input type="text" id="newOrderName" required>
        </div>

        <div class="form-group">
          <label for="newOrderEmail">Email *</label>
          <input type="email" id="newOrderEmail" required>
        </div>

        <div class="form-group">
          <label for="newOrderPhone">Phone *</label>
          <input type="tel" id="newOrderPhone" required>
        </div>

        <div class="form-group">
          <label for="newOrderAddress">Address *</label>
          <textarea id="newOrderAddress" required></textarea>
        </div>

        <div class="form-group">
          <label for="newOrderCity">City</label>
          <input type="text" id="newOrderCity" placeholder="Kuwait">
        </div>

        <div class="form-group">
          <label for="newOrderDistrict">District</label>
          <input type="text" id="newOrderDistrict">
        </div>

        <div class="form-group">
          <label>Items *</label>
          <div id="itemsList" class="items-list-box"></div>
          <button type="button" class="tool-pill" style="margin-top:10px;" onclick="addOrderItem()">Add item</button>
        </div>

        <div class="form-group">
          <label for="newOrderNotes">Notes</label>
          <textarea id="newOrderNotes"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('newOrderModal')">Cancel</button>
          <button type="submit" class="btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '/api/orders';

    const HELPERS_FALLBACK = {
      formatCurrency(value) {
        const num = Number(value || 0);
        return `KWD ${num.toFixed(3)}`;
      },
      formatDate(value) {
        if (!value) return '-';
        const d = new Date(value);
        if (isNaN(d)) return value;
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      },
      formatDateTime(value) {
        if (!value) return '-';
        const d = new Date(value);
        if (isNaN(d)) return value;
        return d.toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      },
      getStatusLabel(status) {
        const labels = {
          pending: 'Unfulfilled',
          processing: 'Processing',
          shipped: 'Shipped',
          completed: 'Completed',
          cancelled: 'Cancelled'
        };
        return labels[status] || status || '-';
      }
    };

    const H = (typeof HELPERS !== 'undefined' && HELPERS) ? HELPERS : HELPERS_FALLBACK;

    let allOrders = [];
    let filteredOrders = [];
    let currentTab = 'all';
    let currentSortDirection = 'DESC';
    let itemCount = 0;
    let currentRangeDays = 90;

    document.addEventListener('DOMContentLoaded', () => {
      loadAllData();
      setInterval(loadAllData, 30000);
    });

    async function loadAllData() {
      showLoading(true);
      try {
        const response = await fetch(`${API_BASE}?limit=200&offset=0&sort=created_at&order=DESC`);
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Failed to load orders');
        }

        allOrders = (data.data || []).map(normalizeOrder);
        updateDashboard();
        applyFilters();
      } catch (error) {
        console.error(error);
        showAlert(error.message || 'Failed to load orders', 'error');
      } finally {
        showLoading(false);
      }
    }

    function normalizeOrder(order) {
      const total = Number(order.total || 0);
      const shipping = Number(order.shipping_cost || 0);
      const subtotal = Number(order.subtotal || Math.max(total - shipping, 0));
      const paid = order.status === 'completed' ? total : 0;
      const balance = Math.max(total - paid, 0);
      return {
        ...order,
        total,
        shipping_cost: shipping,
        subtotal,
        paid,
        balance
      };
    }

    function getRangeOrders(days) {
      const now = new Date();
      const start = new Date();
      start.setHours(0,0,0,0);
      start.setDate(now.getDate() - (days - 1));

      return allOrders.filter(order => {
        const d = new Date(order.created_at || 0);
        return !isNaN(d) && d >= start && d <= now;
      });
    }

    function isToday(order) {
      const d = new Date(order.created_at || 0);
      if (isNaN(d)) return false;
      const now = new Date();
      return d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate();
    }

    function updateDashboard() {
      const rangeOrders = getRangeOrders(currentRangeDays);

      const totalSales = rangeOrders.reduce((sum, o) => sum + Number(o.total || 0), 0);
      const ordersCount = rangeOrders.length;
      const pendingCount = rangeOrders.filter(o => o.status === 'pending').length;
      const unpaidCount = rangeOrders.filter(o => Number(o.balance || 0) > 0).length;
      const todayCount = allOrders.filter(isToday).length;

      document.getElementById('totalSalesValue').textContent = H.formatCurrency(totalSales);
      document.getElementById('ordersCountValue').textContent = String(ordersCount);
      document.getElementById('pendingQuickValue').textContent = pendingCount > 50 ? '50+' : String(pendingCount);
      document.getElementById('paymentQuickValue').textContent = unpaidCount > 50 ? '50+' : String(unpaidCount);
      document.getElementById('allQuickValue').textContent = String(allOrders.length);
      document.getElementById('todayQuickValue').textContent = String(todayCount);
      document.getElementById('visitorsLabel').textContent = `${ordersCount} orders`;
      document.getElementById('salesChangeValue').textContent = `Based on last ${currentRangeDays} days`;
      document.getElementById('ordersChangeValue').textContent = `In selected range`;

      renderChart(rangeOrders);
    }

    function renderChart(orders) {
      const container = document.getElementById('chartContainer');

      if (!orders.length) {
        container.innerHTML = `<div class="chart-empty">No chart data</div>`;
        return;
      }

      const byDay = new Map();
      orders.forEach(order => {
        const d = new Date(order.created_at || 0);
        if (isNaN(d)) return;
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        byDay.set(key, (byDay.get(key) || 0) + Number(order.total || 0));
      });

      const keys = Array.from(byDay.keys()).sort();
      const values = keys.map(k => byDay.get(k));
      const max = Math.max(...values, 1);

      const width = 900;
      const height = 355;
      const padX = 40;
      const padY = 24;
      const innerW = width - (padX * 2);
      const innerH = height - (padY * 2);

      const points = values.map((v, i) => {
        const x = padX + (values.length === 1 ? innerW / 2 : (i * (innerW / Math.max(values.length - 1, 1))));
        const y = padY + innerH - ((v / max) * innerH);
        return [x, y];
      });

      const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]} ${p[1]}`).join(' ');
      const areaPath = `${path} L ${points[points.length - 1][0]} ${height - padY} L ${points[0][0]} ${height - padY} Z`;

      const labels = [];
      const desired = Math.min(4, keys.length);
      for (let i = 0; i < desired; i++) {
        const idx = Math.round((i * (keys.length - 1)) / Math.max(desired - 1, 1));
        const key = keys[idx];
        const dt = new Date(key);
        labels.push({
          x: points[idx][0],
          text: dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        });
      }

      container.innerHTML = `
        <div class="chart-card">
          <svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
            <defs>
              <linearGradient id="fillBlue" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#4aa3ff" stop-opacity="0.22"/>
                <stop offset="100%" stop-color="#4aa3ff" stop-opacity="0.02"/>
              </linearGradient>
            </defs>

            <line x1="${padX}" y1="${padY + innerH}" x2="${width - padX}" y2="${padY + innerH}" stroke="#d7d7d7" stroke-width="2"/>
            <line x1="${padX}" y1="${padY + (innerH/2)}" x2="${width - padX}" y2="${padY + (innerH/2)}" stroke="#e7e7e7" stroke-width="2"/>

            <path d="${areaPath}" fill="url(#fillBlue)"></path>
            <path d="${path}" fill="none" stroke="#5aa0ef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>

            ${labels.map(l => `
              <text x="${l.x}" y="${height - 6}" text-anchor="middle" font-size="22" fill="#7d7d83">${l.text}</text>
            `).join('')}
          </svg>
        </div>
      `;
    }

    function changeRange() {
      currentRangeDays = Number(document.getElementById('rangeSelect').value || 90);
      updateDashboard();
      applyFilters();
    }

    function setDashboardFilter(type) {
      currentTab = type;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const target = document.querySelector(`.tab[data-tab="${type}"]`);
      if (target) target.classList.add('active');
      applyFilters();
      document.querySelector('.orders-shell').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function setTab(tab, element) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (element) element.classList.add('active');
      applyFilters();
    }

    function focusSearch() {
      document.getElementById('searchInput').focus();
    }

    function toggleSortDirection() {
      currentSortDirection = currentSortDirection === 'DESC' ? 'ASC' : 'DESC';
      applyFilters();
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      currentTab = 'all';
      currentSortDirection = 'DESC';
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const first = document.querySelector('.tab[data-tab="all"]');
      if (first) first.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      let result = [...allOrders];

      result = result.filter(order => {
        const d = new Date(order.created_at || 0);
        return !isNaN(d);
      });

      if (search) {
        result = result.filter(order =>
          String(order.order_number || '').toLowerCase().includes(search) ||
          String(order.customer_name || '').toLowerCase().includes(search) ||
          String(order.customer_email || '').toLowerCase().includes(search) ||
          String(order.customer_phone || '').toLowerCase().includes(search)
        );
      }

      if (currentTab === 'pending') {
        result = result.filter(o => o.status === 'pending');
      } else if (currentTab === 'processing') {
        result = result.filter(o => o.status === 'processing');
      } else if (currentTab === 'completed') {
        result = result.filter(o => o.status === 'completed');
      } else if (currentTab === 'cancelled') {
        result = result.filter(o => o.status === 'cancelled');
      } else if (currentTab === 'payment_pending') {
        result = result.filter(o => Number(o.balance || 0) > 0);
      } else if (currentTab === 'open') {
        result = result.filter(o => ['pending','processing','shipped'].includes(o.status));
      } else if (currentTab === 'today') {
        result = result.filter(isToday);
      }

      result.sort((a, b) => {
        const aTime = new Date(a.created_at || 0).getTime();
        const bTime = new Date(b.created_at || 0).getTime();
        return currentSortDirection === 'DESC' ? bTime - aTime : aTime - bTime;
      });

      filteredOrders = result;
      renderOrders(result);
      renderDayLabel(result);
    }

    function renderDayLabel(orders) {
      const label = document.getElementById('dayLabel');
      if (!orders.length) {
        label.textContent = 'No orders';
        return;
      }
      if (currentTab === 'today') {
        label.textContent = 'Today';
        return;
      }
      label.textContent = 'Orders';
    }

    function getItemsCount(order) {
      if (Array.isArray(order.items) && order.items.length) {
        const sum = order.items.reduce((acc, item) => acc + Number(item.quantity || 0), 0);
        return sum || order.items.length;
      }
      return 1;
    }

    function getPaymentLabel(order) {
      return Number(order.balance || 0) > 0 ? 'Payment pending' : 'Paid';
    }

    function getOrderNote(order) {
      if (Number(order.shipping_cost || 0) === 0) return 'The order qualifies for free shipping';
      return `Delivery fee : ${Number(order.shipping_cost || 0)} KWD`;
    }

    function formatShortMeta(order) {
      const customer = order.customer_name || '-';
      const itemsCount = getItemsCount(order);
      const date = order.created_at ? new Date(order.created_at) : null;
      let time = '-';
      if (date && !isNaN(date)) {
        time = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }
      return `${customer} • ${itemsCount} item${itemsCount > 1 ? 's' : ''} • ${time}`;
    }

    function orderDetailsUrl(order) {
      if (order?.id) return `/order-details.html?id=${encodeURIComponent(order.id)}`;
      if (order?.order_number) return `/order-details.html?order=${encodeURIComponent(order.order_number)}`;
      return '#';
    }

    function openOrderDetails(url) {
      if (!url || url === '#') return;
      window.location.href = url;
    }

    function quickFilterStatus(status) {
      currentTab = status;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const target = document.querySelector(`.tab[data-tab="${status}"]`);
      if (target) target.classList.add('active');
      applyFilters();
    }

    function quickFilterPayment() {
      currentTab = 'payment_pending';
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const target = document.querySelector('.tab[data-tab="payment_pending"]');
      if (target) target.classList.add('active');
      applyFilters();
    }

    function renderOrders(orders) {
      const mobileList = document.getElementById('mobileOrdersList');
      const tbody = document.getElementById('ordersTableBody');

      if (!orders.length) {
        mobileList.innerHTML = `<div class="empty-state">No orders found</div>`;
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No orders found</td></tr>`;
        return;
      }

      mobileList.innerHTML = orders.map(order => `
        <div class="order-row" onclick="openOrderDetails('${escapeJs(orderDetailsUrl(order))}')">
          <div>
            <div class="order-number">${escapeHtml(order.order_number || '-')}</div>
            <div class="order-meta">${escapeHtml(formatShortMeta(order))}</div>

            <div class="order-badges">
              <button class="chip fulfillment" type="button" onclick="event.stopPropagation(); quickFilterStatus('pending')">
                ${escapeHtml(H.getStatusLabel(order.status))}
              </button>
              <button class="chip payment" type="button" onclick="event.stopPropagation(); quickFilterPayment()">
                ${escapeHtml(getPaymentLabel(order))}
              </button>
            </div>

            <div class="order-note">${escapeHtml(getOrderNote(order))}</div>
          </div>

          <div class="order-amount">${escapeHtml(H.formatCurrency(order.total || 0))}</div>
        </div>
      `).join('');

      tbody.innerHTML = orders.map(order => `
        <tr onclick="openOrderDetails('${escapeJs(orderDetailsUrl(order))}')">
          <td>
            <div style="font-weight:800;font-size:1.1rem;">${escapeHtml(order.order_number || '-')}</div>
            <div style="color:#666;font-size:.92rem;margin-top:6px;">${escapeHtml(H.formatDate(order.created_at))}</div>
          </td>
          <td>
            <div style="font-weight:700;">${escapeHtml(order.customer_name || '-')}</div>
            <div style="color:#666;margin-top:6px;">${escapeHtml(order.customer_email || '')}</div>
            <div style="color:#666;">${escapeHtml(order.customer_phone || '')}</div>
          </td>
          <td>
            <div class="order-badges">
              <button class="chip fulfillment" type="button" onclick="event.stopPropagation(); quickFilterStatus('pending')">
                ${escapeHtml(H.getStatusLabel(order.status))}
              </button>
              <button class="chip payment" type="button" onclick="event.stopPropagation(); quickFilterPayment()">
                ${escapeHtml(getPaymentLabel(order))}
              </button>
            </div>
          </td>
          <td style="font-weight:700;">${escapeHtml(H.formatCurrency(order.total || 0))}</td>
          <td>${escapeHtml(getOrderNote(order))}</td>
          <td>
            <div class="row-actions" onclick="event.stopPropagation()">
              <button class="small-btn view" type="button" onclick="openOrderDetails('${escapeJs(orderDetailsUrl(order))}')">Open</button>
              <button class="small-btn edit" type="button" onclick="editOrder(${Number(order.id)})">Edit</button>
              <button class="small-btn delete" type="button" onclick="deleteOrder(${Number(order.id)})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function editOrder(orderId) {
      try {
        const response = await fetch(`${API_BASE}/${orderId}`);
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Failed to load order');
        }

        const order = data.data;
        document.getElementById('editOrderId').value = order.id;
        document.getElementById('editOrderStatus').value = order.status || 'pending';
        document.getElementById('editOrderNotes').value = order.notes || '';
        document.getElementById('editOrderPhone').value = order.customer_phone || '';
        document.getElementById('editOrderEmail').value = order.customer_email || '';
        document.getElementById('editOrderAddress').value = order.customer_address || '';

        openModal('editOrderModal');
      } catch (error) {
        showAlert(error.message || 'Failed to load order', 'error');
      }
    }

    async function saveOrderChanges(event) {
      event.preventDefault();
      try {
        const orderId = document.getElementById('editOrderId').value;
        const updateData = {
          status: document.getElementById('editOrderStatus').value,
          notes: document.getElementById('editOrderNotes').value,
          customerPhone: document.getElementById('editOrderPhone').value,
          customerEmail: document.getElementById('editOrderEmail').value,
          customerAddress: document.getElementById('editOrderAddress').value
        };

        const response = await fetch(`${API_BASE}/${orderId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updateData)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          closeModal('editOrderModal');
          showAlert('Order updated', 'success');
          loadAllData();
        } else {
          showAlert(data.error || 'Failed to update order', 'error');
        }
      } catch {
        showAlert('Failed to update order', 'error');
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm('Delete this order?')) return;
      try {
        const response = await fetch(`${API_BASE}/${orderId}`, { method: 'DELETE' });
        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Order deleted', 'success');
          loadAllData();
        } else {
          showAlert(data.error || 'Failed to delete order', 'error');
        }
      } catch {
        showAlert('Failed to delete order', 'error');
      }
    }

    function openNewOrderModal() {
      document.getElementById('newOrderForm').reset();
      document.getElementById('itemsList').innerHTML = '';
      itemCount = 0;
      addOrderItem();
      openModal('newOrderModal');
    }

    function addOrderItem() {
      itemCount++;
      const itemsList = document.getElementById('itemsList');
      itemsList.insertAdjacentHTML('beforeend', `
        <div id="item-${itemCount}">
          <div class="inline-grid">
            <input type="text" placeholder="Product name" class="order-item-name" required>
            <input type="number" step="0.001" placeholder="Price" class="order-item-price" required>
            <input type="number" placeholder="Qty" class="order-item-qty" value="1" min="1" required>
            <button type="button" class="small-btn delete" onclick="removeOrderItem(${itemCount})">Delete</button>
          </div>
        </div>
      `);
    }

    function removeOrderItem(itemId) {
      const el = document.getElementById(`item-${itemId}`);
      if (el) el.remove();
    }

    async function createNewOrder(event) {
      event.preventDefault();

      try {
        const items = [];
        document.querySelectorAll('#itemsList > div').forEach(itemDiv => {
          const name = itemDiv.querySelector('.order-item-name').value;
          const price = parseFloat(itemDiv.querySelector('.order-item-price').value);
          const quantity = parseInt(itemDiv.querySelector('.order-item-qty').value);

          if (name && !isNaN(price) && !isNaN(quantity)) {
            items.push({
              name,
              price,
              quantity,
              productId: `product_${Date.now()}_${Math.random()}`
            });
          }
        });

        if (!items.length) {
          showAlert('Add at least one item', 'error');
          return;
        }

        const orderData = {
          customerName: document.getElementById('newOrderName').value,
          customerEmail: document.getElementById('newOrderEmail').value,
          customerPhone: document.getElementById('newOrderPhone').value,
          customerAddress: document.getElementById('newOrderAddress').value,
          customerCity: document.getElementById('newOrderCity').value || 'Kuwait',
          customerDistrict: document.getElementById('newOrderDistrict').value,
          items,
          notes: document.getElementById('newOrderNotes').value
        };

        const response = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          closeModal('newOrderModal');
          showAlert(`Order created: ${data.data.order_number}`, 'success');
          loadAllData();
        } else {
          showAlert(data.error || 'Failed to create order', 'error');
        }
      } catch {
        showAlert('Failed to create order', 'error');
      }
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    function showAlert(message, type = 'success', duration = 3000) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert active ${type}`;
      if (duration) {
        setTimeout(() => alert.classList.remove('active'), duration);
      }
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.classList.remove('active');
      }
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJs(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
