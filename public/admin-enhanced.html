<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders Admin - Smart Kids Kuwait</title>
  <script src="/config/system.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --purple:#6c63ff;
      --purple-dark:#5c52f0;
      --bg:#ffffff;
      --soft:#f3f3f3;
      --soft-2:#f7f7f7;
      --border:#e7e7e7;
      --text:#1f1f1f;
      --muted:#6c6c6c;
      --chip-yellow:#efe17a;
      --chip-yellow-text:#5b4d00;
      --chip-beige:#eacb98;
      --chip-beige-text:#5c4520;
      --danger:#df5a5a;
      --success:#111111;
      --blue:#3f7df0;
      --shadow:0 10px 28px rgba(0,0,0,.06);
      --radius-xl:28px;
      --radius-lg:22px;
      --radius-md:16px;
      --radius-sm:12px;
    }

    body{
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a{ color: inherit; text-decoration: none; }

    .topbar{
      background: linear-gradient(135deg, #6b3fa0 0%, #6c63ff 100%);
      color:#fff;
      padding:18px 16px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(108,99,255,.18);
    }

    .topbar-inner{
      max-width: 1180px;
      margin: 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .topbar-title{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .logo-box{
      width:48px;
      height:48px;
      border-radius:14px;
      background: rgba(255,255,255,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      flex:0 0 auto;
    }

    .topbar-text h1{
      font-size:1.2rem;
      line-height:1.2;
      font-weight:800;
      margin-bottom:3px;
    }

    .topbar-text p{
      font-size:.82rem;
      opacity:.9;
    }

    .topbar-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .top-btn{
      min-height:40px;
      padding:0 14px;
      border:none;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
      background: rgba(255,255,255,.16);
      color:#fff;
      backdrop-filter: blur(8px);
    }

    .top-btn.primary{ background:#fff; color:var(--purple-dark); }

    .page{
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px;
    }

    .alert{
      display:none;
      margin-bottom:12px;
      padding:14px 16px;
      border-radius:16px;
      font-weight:700;
    }

    .alert.active{ display:block; }
    .alert.success{ background:#eaf9ef; color:#1c7b44; border:1px solid #bce7c8; }
    .alert.error{ background:#fff1f1; color:#9e2f2f; border:1px solid #efc0c0; }

    .summary-strip{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:16px;
    }

    .summary-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:22px;
      padding:16px;
      box-shadow: var(--shadow);
    }

    .summary-card .k{
      color:var(--muted);
      font-size:.88rem;
      margin-bottom:8px;
    }

    .summary-card .v{
      font-size:1.55rem;
      font-weight:800;
      line-height:1.2;
    }

    .orders-shell{
      background:#fff;
      border:1px solid var(--border);
      border-radius:34px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }

    .orders-head{
      padding:18px 16px 10px;
      border-bottom:1px solid #f0f0f0;
    }

    .orders-title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .orders-title{
      font-size:1.9rem;
      font-weight:800;
      line-height:1.2;
    }

    .orders-tools{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .circle-btn,
    .pill-btn{
      border:none;
      background:#f3f3f3;
      color:#222;
      cursor:pointer;
    }

    .circle-btn{
      width:54px;
      height:54px;
      border-radius:50%;
      font-size:1.35rem;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .pill-btn{
      min-height:54px;
      padding:0 22px;
      border-radius:999px;
      font-weight:700;
      font-size:1rem;
    }

    .search-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 74px 74px;
      gap:10px;
      margin-bottom:12px;
    }

    .search-box{
      position:relative;
    }

    .search-box input{
      width:100%;
      height:66px;
      border:none;
      background:#f3f3f3;
      border-radius:22px;
      padding:0 20px 0 20px;
      font-size:1.05rem;
      color:#222;
    }

    .search-box input::placeholder{ color:#b0b0b0; }

    .search-box .search-icon{
      position:absolute;
      left:18px;
      top:50%;
      transform:translateY(-50%);
      font-size:1.6rem;
      color:#8f8f8f;
      pointer-events:none;
    }

    .search-box input[dir="ltr"]{
      padding-left:54px;
    }

    .tabs-row{
      display:flex;
      gap:12px;
      overflow:auto;
      padding-bottom:4px;
      scrollbar-width:none;
    }

    .tabs-row::-webkit-scrollbar{ display:none; }

    .tab{
      border:none;
      background:transparent;
      font-size:1rem;
      font-weight:700;
      color:#2e2e2e;
      padding:12px 18px;
      border-radius:999px;
      cursor:pointer;
      white-space:nowrap;
    }

    .tab.active{
      background:#efefef;
    }

    .day-label{
      background:#f2f2f2;
      color:#6e6e6e;
      padding:12px 16px;
      font-size:.95rem;
      font-weight:700;
      border-top:1px solid #efefef;
      border-bottom:1px solid #efefef;
    }

    .orders-list{
      background:#fff;
    }

    .order-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:14px;
      padding:18px 16px;
      border-bottom:1px solid #ececec;
      cursor:pointer;
      transition:.15s ease;
    }

    .order-row:hover{
      background:#fafafa;
    }

    .order-main{
      min-width:0;
    }

    .order-number{
      font-size:1.2rem;
      font-weight:800;
      margin-bottom:8px;
      line-height:1.2;
    }

    .order-meta{
      color:#313131;
      font-size:.98rem;
      line-height:1.6;
      margin-bottom:8px;
    }

    .order-badges{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:8px;
    }

    .chip{
      min-height:34px;
      padding:0 14px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:.9rem;
      font-weight:700;
      cursor:pointer;
      border:none;
    }

    .chip.fulfillment{
      background:var(--chip-yellow);
      color:var(--chip-yellow-text);
    }

    .chip.payment{
      background:var(--chip-beige);
      color:var(--chip-beige-text);
    }

    .order-note{
      color:#313131;
      font-size:.96rem;
      line-height:1.55;
    }

    .order-amount{
      font-size:1.1rem;
      font-weight:400;
      white-space:nowrap;
      align-self:start;
      padding-top:2px;
    }

    .desktop-table-wrap{
      display:none;
      border-top:1px solid #efefef;
    }

    .desktop-table{
      width:100%;
      border-collapse:collapse;
    }

    .desktop-table th,
    .desktop-table td{
      padding:16px;
      border-bottom:1px solid #ececec;
      text-align:right;
      vertical-align:top;
    }

    .desktop-table th{
      background:#fafafa;
      font-size:.9rem;
      color:#6c6c6c;
      font-weight:800;
    }

    .desktop-table tbody tr{
      cursor:pointer;
    }

    .desktop-table tbody tr:hover{
      background:#fafafa;
    }

    .row-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .small-btn{
      min-height:36px;
      padding:0 12px;
      border:none;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
    }

    .small-btn.view{ background:#e8f0ff; color:#275dd8; }
    .small-btn.edit{ background:#fff0cf; color:#986800; }
    .small-btn.delete{ background:#ffe0e0; color:#b33434; }

    .loading{
      display:none;
      padding:32px 16px;
      text-align:center;
      color:#666;
    }

    .loading.active{ display:block; }

    .empty-state{
      padding:40px 16px;
      text-align:center;
      color:#888;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:50;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    .modal.active{ display:flex; }

    .modal-content{
      width:100%;
      max-width:760px;
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:24px;
      padding:18px;
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .modal-header h2{
      font-size:1.3rem;
      font-weight:800;
    }

    .close-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      background:#f3f3f3;
      font-size:1.5rem;
    }

    .form-group{ margin-bottom:14px; }
    .form-group label{
      display:block;
      margin-bottom:7px;
      font-weight:700;
    }

    .form-group input,
    .form-group select,
    .form-group textarea{
      width:100%;
      min-height:50px;
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 14px;
      font-family:inherit;
      font-size:1rem;
      background:#fff;
    }

    .form-group textarea{
      min-height:110px;
      resize:vertical;
    }

    .modal-footer{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-top:18px;
    }

    .modal-footer button{
      min-height:46px;
      padding:0 18px;
      border:none;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{ background:#111; color:#fff; }
    .btn-secondary{ background:#f3f3f3; color:#222; }

    .items-list-box > div{
      border:1px solid var(--border);
      padding:12px;
      border-radius:14px;
      margin-bottom:10px;
      background:#fafafa;
    }

    .inline-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr auto;
      gap:8px;
    }

    @media (min-width: 992px){
      .summary-strip{
        grid-template-columns:repeat(4,minmax(0,1fr));
      }

      .orders-head{
        padding:22px 22px 14px;
      }

      .orders-list{ display:none; }
      .desktop-table-wrap{ display:block; }

      .search-row{
        grid-template-columns:minmax(0,1fr) 74px 74px auto auto;
      }

      .page{
        padding: 22px;
      }

      .topbar{
        padding:20px 22px;
      }
    }

    @media (max-width: 768px){
      .topbar-inner{
        flex-direction:column;
        align-items:stretch;
      }

      .topbar-actions{
        justify-content:stretch;
      }

      .top-btn{
        flex:1 1 auto;
      }

      .summary-strip{
        grid-template-columns:1fr 1fr;
      }

      .orders-title{
        font-size:1.65rem;
      }

      .pill-btn{
        padding:0 18px;
      }
    }

    @media (max-width: 520px){
      .page{
        padding:12px;
      }

      .summary-strip{
        grid-template-columns:1fr;
      }

      .orders-shell{
        border-radius:28px;
      }

      .orders-title-row{
        flex-wrap:wrap;
      }

      .orders-tools{
        width:100%;
        justify-content:space-between;
      }

      .search-row{
        grid-template-columns:minmax(0,1fr) 66px 66px;
      }

      .order-meta,
      .order-note{
        font-size:.92rem;
      }

      .inline-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-title">
        <div class="logo-box">🛍️</div>
        <div class="topbar-text">
          <h1>Orders</h1>
          <p>Smart Kids Kuwait Admin</p>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="top-btn" onclick="loadAllData()">Refresh</button>
        <button class="top-btn primary" onclick="openNewOrderModal()">Add order</button>
        <button class="top-btn" onclick="exportToCSV()">Export CSV</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="alert" class="alert"></div>

    <section class="summary-strip">
      <div class="summary-card">
        <div class="k">Total orders</div>
        <div class="v" id="totalOrders">0</div>
      </div>
      <div class="summary-card">
        <div class="k">Unfulfilled</div>
        <div class="v" id="pendingOrders">0</div>
      </div>
      <div class="summary-card">
        <div class="k">Processing</div>
        <div class="v" id="processingOrders">0</div>
      </div>
      <div class="summary-card">
        <div class="k">Total sales</div>
        <div class="v" id="totalRevenue">KWD 0.000</div>
      </div>
    </section>

    <section class="orders-shell">
      <div class="orders-head">
        <div class="orders-title-row">
          <div class="orders-title">Orders</div>
          <div class="orders-tools">
            <button class="circle-btn" onclick="toggleSortDirection()" title="Sort">⇅</button>
            <button class="circle-btn" onclick="focusSearch()" title="Search">⌕</button>
            <button class="pill-btn" onclick="openNewOrderModal()">Add</button>
          </div>
        </div>

        <div class="search-row">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input id="searchInput" dir="ltr" type="text" placeholder="Filter orders" />
          </div>
          <button class="circle-btn" onclick="toggleSortDirection()" title="Sort">⇅</button>
          <button class="circle-btn" onclick="clearFilters()" title="Clear">≡</button>
        </div>

        <div class="tabs-row">
          <button class="tab active" data-tab="all">All</button>
          <button class="tab" data-tab="pending">Unfulfilled</button>
          <button class="tab" data-tab="payment_pending">Unpaid</button>
          <button class="tab" data-tab="open">Open</button>
          <button class="tab" data-tab="archived">Archived</button>
          <button class="tab" data-tab="processing">Processing</button>
          <button class="tab" data-tab="completed">Completed</button>
        </div>
      </div>

      <div class="day-label" id="dayLabel">Orders</div>

      <div id="loading" class="loading active">Loading orders...</div>

      <div class="orders-list" id="mobileOrdersList"></div>

      <div class="desktop-table-wrap">
        <table class="desktop-table">
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Status</th>
              <th>Amount</th>
              <th>Note</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" id="editOrderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit order</h2>
        <button class="close-btn" onclick="closeModal('editOrderModal')">&times;</button>
      </div>

      <form id="editOrderForm" onsubmit="saveOrderChanges(event)">
        <input type="hidden" id="editOrderId">

        <div class="form-group">
          <label for="editOrderStatus">Status</label>
          <select id="editOrderStatus" required>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editOrderNotes">Notes</label>
          <textarea id="editOrderNotes"></textarea>
        </div>

        <div class="form-group">
          <label for="editOrderPhone">Phone</label>
          <input type="tel" id="editOrderPhone">
        </div>

        <div class="form-group">
          <label for="editOrderEmail">Email</label>
          <input type="email" id="editOrderEmail">
        </div>

        <div class="form-group">
          <label for="editOrderAddress">Address</label>
          <textarea id="editOrderAddress"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('editOrderModal')">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="newOrderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add order</h2>
        <button class="close-btn" onclick="closeModal('newOrderModal')">&times;</button>
      </div>

      <form id="newOrderForm" onsubmit="createNewOrder(event)">
        <div class="form-group">
          <label for="newOrderName">Customer name *</label>
          <input type="text" id="newOrderName" required>
        </div>

        <div class="form-group">
          <label for="newOrderEmail">Email *</label>
          <input type="email" id="newOrderEmail" required>
        </div>

        <div class="form-group">
          <label for="newOrderPhone">Phone *</label>
          <input type="tel" id="newOrderPhone" required>
        </div>

        <div class="form-group">
          <label for="newOrderAddress">Address *</label>
          <textarea id="newOrderAddress" required></textarea>
        </div>

        <div class="form-group">
          <label for="newOrderCity">City</label>
          <input type="text" id="newOrderCity" placeholder="Kuwait">
        </div>

        <div class="form-group">
          <label for="newOrderDistrict">District</label>
          <input type="text" id="newOrderDistrict">
        </div>

        <div class="form-group">
          <label>Items *</label>
          <div id="itemsList" class="items-list-box"></div>
          <button type="button" class="pill-btn" style="margin-top:10px;" onclick="addOrderItem()">Add item</button>
        </div>

        <div class="form-group">
          <label for="newOrderNotes">Notes</label>
          <textarea id="newOrderNotes"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('newOrderModal')">Cancel</button>
          <button type="submit" class="btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '/api/orders';

    const HELPERS_FALLBACK = {
      formatCurrency(value) {
        const num = Number(value || 0);
        return `KWD ${num.toFixed(3)}`;
      },
      formatDate(value) {
        if (!value) return '-';
        const d = new Date(value);
        if (isNaN(d)) return value;
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      },
      formatDateTime(value) {
        if (!value) return '-';
        const d = new Date(value);
        if (isNaN(d)) return value;
        return d.toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      },
      getStatusLabel(status) {
        const labels = {
          pending: 'Unfulfilled',
          processing: 'Processing',
          shipped: 'Shipped',
          completed: 'Completed',
          cancelled: 'Cancelled'
        };
        return labels[status] || status || '-';
      }
    };

    const H = (typeof HELPERS !== 'undefined' && HELPERS) ? HELPERS : HELPERS_FALLBACK;

    let allOrders = [];
    let filteredOrders = [];
    let itemCount = 0;
    let currentTab = 'all';
    let currentSortDirection = 'DESC';

    document.addEventListener('DOMContentLoaded', () => {
      setupTabs();
      document.getElementById('searchInput').addEventListener('input', applyFilters);
      loadAllData();
      setInterval(loadAllData, 30000);
    });

    function setupTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentTab = tab.dataset.tab;
          applyFilters();
        });
      });
    }

    function focusSearch() {
      document.getElementById('searchInput').focus();
    }

    function toggleSortDirection() {
      currentSortDirection = currentSortDirection === 'DESC' ? 'ASC' : 'DESC';
      applyFilters();
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      currentTab = 'all';
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const firstTab = document.querySelector('.tab[data-tab="all"]');
      if (firstTab) firstTab.classList.add('active');
      currentSortDirection = 'DESC';
      applyFilters();
    }

    async function loadAllData() {
      showLoading(true);

      try {
        const response = await fetch(`${API_BASE}?limit=100&offset=0&sort=created_at&order=DESC`);
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Failed to load orders');
        }

        allOrders = data.data || [];
        filteredOrders = [...allOrders];
        applyFilters();

        try {
          const statsResponse = await fetch(`${API_BASE}/stats/summary`);
          const statsData = await statsResponse.json();

          if (statsResponse.ok && statsData.success) {
            document.getElementById('totalOrders').textContent = Number(statsData.data.totalOrders || 0);
            document.getElementById('pendingOrders').textContent = Number(statsData.data.ordersByStatus?.pending || 0);
            document.getElementById('processingOrders').textContent = Number(statsData.data.ordersByStatus?.processing || 0);
            document.getElementById('totalRevenue').textContent = H.formatCurrency(statsData.data.totalRevenue || 0);
          } else {
            fillStatsFromOrders();
          }
        } catch {
          fillStatsFromOrders();
        }

      } catch (error) {
        console.error(error);
        showAlert(error.message || 'Failed to load orders', 'error');
      } finally {
        showLoading(false);
      }
    }

    function fillStatsFromOrders() {
      document.getElementById('totalOrders').textContent = allOrders.length;
      document.getElementById('pendingOrders').textContent = allOrders.filter(o => o.status === 'pending').length;
      document.getElementById('processingOrders').textContent = allOrders.filter(o => o.status === 'processing').length;
      document.getElementById('totalRevenue').textContent = H.formatCurrency(
        allOrders.reduce((sum, o) => sum + Number(o.total || 0), 0)
      );
    }

    function getItemsCount(order) {
      if (Array.isArray(order.items) && order.items.length) {
        const sum = order.items.reduce((acc, item) => acc + Number(item.quantity || 0), 0);
        return sum || order.items.length;
      }
      return 1;
    }

    function getPaymentLabel(order) {
      if (Number(order.total || 0) > 0 && order.status !== 'completed') return 'Payment pending';
      return 'Paid';
    }

    function getOrderNote(order) {
      if (Number(order.shipping_cost || 0) === 0) return 'The order qualifies for free shipping';
      return `Delivery fee : ${Number(order.shipping_cost || 0)} KWD`;
    }

    function formatShortMeta(order) {
      const customer = order.customer_name || '-';
      const itemsCount = getItemsCount(order);
      const date = order.created_at ? new Date(order.created_at) : null;
      let time = '-';
      if (date && !isNaN(date)) {
        time = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }
      return `${customer} • ${itemsCount} item${itemsCount > 1 ? 's' : ''} • ${time}`;
    }

    function orderDetailsUrl(order) {
      if (order?.id) return `/order-details.html?id=${encodeURIComponent(order.id)}`;
      if (order?.order_number) return `/order-details.html?order=${encodeURIComponent(order.order_number)}`;
      return '#';
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      let result = [...allOrders];

      if (search) {
        result = result.filter(order =>
          String(order.order_number || '').toLowerCase().includes(search) ||
          String(order.customer_name || '').toLowerCase().includes(search) ||
          String(order.customer_email || '').toLowerCase().includes(search) ||
          String(order.customer_phone || '').toLowerCase().includes(search)
        );
      }

      if (currentTab === 'pending') {
        result = result.filter(order => order.status === 'pending');
      } else if (currentTab === 'processing') {
        result = result.filter(order => order.status === 'processing');
      } else if (currentTab === 'completed') {
        result = result.filter(order => order.status === 'completed');
      } else if (currentTab === 'payment_pending') {
        result = result.filter(order => Number(order.total || 0) > 0 && order.status !== 'completed');
      } else if (currentTab === 'open') {
        result = result.filter(order => ['pending','processing','shipped'].includes(order.status));
      } else if (currentTab === 'archived') {
        result = result.filter(order => order.status === 'cancelled');
      }

      result.sort((a, b) => {
        const aTime = new Date(a.created_at || 0).getTime();
        const bTime = new Date(b.created_at || 0).getTime();
        return currentSortDirection === 'DESC' ? bTime - aTime : aTime - bTime;
      });

      filteredOrders = result;
      renderOrders(result);
      renderDayLabel(result);
    }

    function renderDayLabel(orders) {
      const label = document.getElementById('dayLabel');
      if (!orders.length) {
        label.textContent = 'No orders';
        return;
      }
      label.textContent = 'Orders';
    }

    function renderOrders(orders) {
      const mobileList = document.getElementById('mobileOrdersList');
      const tbody = document.getElementById('ordersTableBody');

      if (!orders.length) {
        mobileList.innerHTML = `<div class="empty-state">No orders found</div>`;
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No orders found</td></tr>`;
        return;
      }

      mobileList.innerHTML = orders.map(order => `
        <div class="order-row" onclick="openOrderDetails('${escapeJs(orderDetailsUrl(order))}')">
          <div class="order-main">
            <div class="order-number">${escapeHtml(order.order_number || '-')}</div>
            <div class="order-meta">${escapeHtml(formatShortMeta(order))}</div>

            <div class="order-badges">
              <button class="chip fulfillment" type="button" onclick="event.stopPropagation(); quickFilterStatus('pending')">
                ${escapeHtml(H.getStatusLabel(order.status))}
              </button>
              <button class="chip payment" type="button" onclick="event.stopPropagation(); quickFilterPayment()">
                ${escapeHtml(getPaymentLabel(order))}
              </button>
            </div>

            <div class="order-note">${escapeHtml(getOrderNote(order))}</div>
          </div>

          <div class="order-amount">${escapeHtml(H.formatCurrency(order.total || 0))}</div>
        </div>
      `).join('');

      tbody.innerHTML = orders.map(order => `
        <tr onclick="openOrderDetails('${escapeJs(orderDetailsUrl(order))}')">
          <td>
            <div style="font-weight:800; font-size:1.1rem;">${escapeHtml(order.order_number || '-')}</div>
            <div style="color:#666; font-size:.92rem; margin-top:6px;">${escapeHtml(H.formatDate(order.created_at))}</div>
          </td>
          <td>
            <div style="font-weight:700;">${escapeHtml(order.customer_name || '-')}</div>
            <div style="color:#666; margin-top:6px;">${escapeHtml(order.customer_email || '')}</div>
            <div style="color:#666;">${escapeHtml(order.customer_phone || '')}</div>
          </td>
          <td>
            <div class="order-badges">
              <button class="chip fulfillment" type="button" onclick="event.stopPropagation(); quickFilterStatus('pending')">
                ${escapeHtml(H.getStatusLabel(order.status))}
              </button>
              <button class="chip payment" type="button" onclick="event.stopPropagation(); quickFilterPayment()">
                ${escapeHtml(getPaymentLabel(order))}
              </button>
            </div>
          </td>
          <td style="font-weight:700;">${escapeHtml(H.formatCurrency(order.total || 0))}</td>
          <td>${escapeHtml(getOrderNote(order))}</td>
          <td>
            <div class="row-actions" onclick="event.stopPropagation()">
              <button class="small-btn view" type="button" onclick="openOrderDetails('${escapeJs(orderDetailsUrl(order))}')">Open</button>
              <button class="small-btn edit" type="button" onclick="editOrder(${Number(order.id)})">Edit</button>
              <button class="small-btn delete" type="button" onclick="deleteOrder(${Number(order.id)})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function quickFilterStatus(status) {
      currentTab = status;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const target = document.querySelector(`.tab[data-tab="${status}"]`);
      if (target) target.classList.add('active');
      applyFilters();
    }

    function quickFilterPayment() {
      currentTab = 'payment_pending';
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const target = document.querySelector(`.tab[data-tab="payment_pending"]`);
      if (target) target.classList.add('active');
      applyFilters();
    }

    function openOrderDetails(url) {
      if (!url || url === '#') return;
      window.location.href = url;
    }

    async function editOrder(orderId) {
      try {
        const response = await fetch(`${API_BASE}/${orderId}`);
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Failed to load order');
        }

        const order = data.data;
        document.getElementById('editOrderId').value = order.id;
        document.getElementById('editOrderStatus').value = order.status || 'pending';
        document.getElementById('editOrderNotes').value = order.notes || '';
        document.getElementById('editOrderPhone').value = order.customer_phone || '';
        document.getElementById('editOrderEmail').value = order.customer_email || '';
        document.getElementById('editOrderAddress').value = order.customer_address || '';

        openModal('editOrderModal');
      } catch (error) {
        showAlert(error.message || 'Failed to load order', 'error');
      }
    }

    async function saveOrderChanges(event) {
      event.preventDefault();

      try {
        const orderId = document.getElementById('editOrderId').value;
        const updateData = {
          status: document.getElementById('editOrderStatus').value,
          notes: document.getElementById('editOrderNotes').value,
          customerPhone: document.getElementById('editOrderPhone').value,
          customerEmail: document.getElementById('editOrderEmail').value,
          customerAddress: document.getElementById('editOrderAddress').value
        };

        const response = await fetch(`${API_BASE}/${orderId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updateData)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          closeModal('editOrderModal');
          showAlert('Order updated', 'success');
          loadAllData();
        } else {
          showAlert(data.error || 'Failed to update order', 'error');
        }
      } catch (error) {
        showAlert('Failed to update order', 'error');
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm('Delete this order?')) return;

      try {
        const response = await fetch(`${API_BASE}/${orderId}`, { method: 'DELETE' });
        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Order deleted', 'success');
          loadAllData();
        } else {
          showAlert(data.error || 'Failed to delete order', 'error');
        }
      } catch {
        showAlert('Failed to delete order', 'error');
      }
    }

    function openNewOrderModal() {
      document.getElementById('newOrderForm').reset();
      document.getElementById('itemsList').innerHTML = '';
      itemCount = 0;
      addOrderItem();
      openModal('newOrderModal');
    }

    function addOrderItem() {
      itemCount++;
      const itemsList = document.getElementById('itemsList');
      itemsList.insertAdjacentHTML('beforeend', `
        <div id="item-${itemCount}">
          <div class="inline-grid">
            <input type="text" placeholder="Product name" class="order-item-name" required>
            <input type="number" step="0.001" placeholder="Price" class="order-item-price" required>
            <input type="number" placeholder="Qty" class="order-item-qty" value="1" min="1" required>
            <button type="button" class="small-btn delete" onclick="removeOrderItem(${itemCount})">Delete</button>
          </div>
        </div>
      `);
    }

    function removeOrderItem(itemId) {
      const el = document.getElementById(`item-${itemId}`);
      if (el) el.remove();
    }

    async function createNewOrder(event) {
      event.preventDefault();

      try {
        const items = [];
        document.querySelectorAll('#itemsList > div').forEach(itemDiv => {
          const name = itemDiv.querySelector('.order-item-name').value;
          const price = parseFloat(itemDiv.querySelector('.order-item-price').value);
          const quantity = parseInt(itemDiv.querySelector('.order-item-qty').value);

          if (name && !isNaN(price) && !isNaN(quantity)) {
            items.push({
              name,
              price,
              quantity,
              productId: `product_${Date.now()}_${Math.random()}`
            });
          }
        });

        if (!items.length) {
          showAlert('Add at least one item', 'error');
          return;
        }

        const orderData = {
          customerName: document.getElementById('newOrderName').value,
          customerEmail: document.getElementById('newOrderEmail').value,
          customerPhone: document.getElementById('newOrderPhone').value,
          customerAddress: document.getElementById('newOrderAddress').value,
          customerCity: document.getElementById('newOrderCity').value || 'Kuwait',
          customerDistrict: document.getElementById('newOrderDistrict').value,
          items,
          notes: document.getElementById('newOrderNotes').value
        };

        const response = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          closeModal('newOrderModal');
          showAlert(`Order created: ${data.data.order_number}`, 'success');
          loadAllData();
        } else {
          showAlert(data.error || 'Failed to create order', 'error');
        }
      } catch {
        showAlert('Failed to create order', 'error');
      }
    }

    function exportToCSV() {
      const headers = ['Order', 'Customer', 'Email', 'Phone', 'Amount', 'Status', 'Date'];
      const rows = filteredOrders.map(order => [
        order.order_number || '',
        order.customer_name || '',
        order.customer_email || '',
        order.customer_phone || '',
        order.total || 0,
        H.getStatusLabel(order.status),
        order.created_at ? H.formatDateTime(order.created_at) : ''
      ]);

      let csv = headers.join(',') + '\n';
      rows.forEach(row => {
        csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `orders_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();

      showAlert('CSV exported', 'success');
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    function showAlert(message, type = 'success', duration = 3000) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert active ${type}`;

      if (duration) {
        setTimeout(() => alert.classList.remove('active'), duration);
      }
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.classList.remove('active');
      }
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJs(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
