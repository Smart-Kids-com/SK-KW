<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Enhanced</title>
  <style>
    :root{
      --bg:#d7e9f7;
      --panel:#f3f3f6;
      --text:#111317;
      --muted:#6d7175;
      --line:#e5e7eb;
      --shadow:0 6px 16px rgba(0,0,0,.06);
      --radius:18px;
      --side-w:476px;
      --top-h:176px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }

    a{text-decoration:none;color:inherit}
    button,input{font-family:inherit}

    .app{
      min-height:100vh;
      display:grid;
      grid-template-columns:var(--side-w) 1fr;
      grid-template-rows:var(--top-h) 1fr;
      grid-template-areas:
        "top top"
        "side main";
    }

    /* top */
    .topbar{
      grid-area:top;
      background:var(--bg);
      border-bottom:4px solid rgba(17,19,23,.85);
      display:grid;
      grid-template-columns:120px 1fr 108px 1fr;
      align-items:center;
      gap:18px;
      padding:16px 24px 18px;
    }

    .top-icon,
    .top-sk{
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:0;
    }

    .top-icon img{width:92px;height:auto;display:block}
    .top-sk img{width:82px;height:auto;display:block}

    .top-search,
    .top-name{
      position:relative;
      line-height:0;
      min-width:0;
    }

    .top-search img,
    .top-name img{
      width:100%;
      height:auto;
      display:block;
    }

    .top-search input{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:transparent;
      outline:none;
      color:#fff;
      font-size:24px;
      padding:0 120px 0 34px;
    }

    .top-search input::placeholder{color:#fff;opacity:1}

    /* sidebar */
    .sidebar{
      grid-area:side;
      padding:0 0 0 2px;
    }

    .sidebar-shell{
      margin-top:2px;
      min-height:calc(100vh - var(--top-h));
      background:linear-gradient(180deg,#06144d 0%, #07123f 100%);
      border-radius:0 0 22px 0;
      padding:58px 14px 16px;
      position:relative;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .sidebar-shell::after{
      content:"";
      position:absolute;
      left:0;
      bottom:0;
      width:86px;
      height:86px;
      background:linear-gradient(135deg, transparent 0 60%, rgba(255,255,255,.14) 60% 100%);
      opacity:.55;
      pointer-events:none;
    }

    .nav-stack{display:flex;flex-direction:column;gap:10px}

    .nav-item{
      position:relative;
      display:block;
      line-height:0;
      border-radius:18px;
      overflow:hidden;
    }

    .nav-item img{display:block;width:100%;height:auto}

    .nav-badge{
      position:absolute;
      left:18px;
      top:50%;
      transform:translateY(-50%);
      min-width:30px;
      height:22px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 7px;
      background:rgba(255,255,255,.92);
      font-size:12px;
      font-weight:800;
      color:#444;
    }

    /* main */
    .main{
      grid-area:main;
      background:#fff;
      padding:18px 20px 28px;
    }

    .page{
      max-width:1320px;
      margin:0 auto;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
      margin:0 0 14px;
    }

    .toolbar img{
      display:block;
      height:48px;
      width:auto;
    }

    .stats-strip{
      background:var(--panel);
      border-radius:24px;
      padding:20px 24px 18px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:32px;
      margin-bottom:28px;
    }

    .stat h3{
      font-size:28px;
      line-height:1.05;
      font-weight:900;
      margin-bottom:10px;
      color:#000;
    }

    .stat p{
      font-size:24px;
      font-weight:800;
      color:#000;
    }

    .action-row{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .action-row img{display:block;height:78px;width:auto}

    .empty-stage{
      min-height:420px;
      background:transparent;
    }

    /* existing dashboard logic blocks kept hidden on desktop reference build */
    .legacy-hidden{display:none !important}

    /* mobile keeps old practical layout */
    .mobile-top,
    .mobile-content{display:none}

    @media (max-width: 1100px){
      .app{display:none}

      .mobile-top{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        position:sticky;
        top:0;
        z-index:40;
        background:#111;
        color:#fff;
        padding:12px 14px;
      }

      .mobile-top .title{
        font-size:20px;
        font-weight:900;
      }

      .mobile-top button{
        border:0;
        background:#0d0d0f;
        color:#fff;
        border-radius:14px;
        padding:14px 18px;
        font-size:16px;
        font-weight:800;
      }

      .mobile-content{
        display:block;
        padding:14px;
      }

      .card{
        background:#fff;
        border:1px solid var(--line);
        border-radius:18px;
        box-shadow:var(--shadow);
        overflow:hidden;
        margin-bottom:14px;
      }

      .card-head{
        padding:14px 16px;
        border-bottom:1px solid var(--line);
        font-size:15px;
        font-weight:800;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
        flex-wrap:wrap;
      }

      .card-body{padding:16px}

      .date-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
      .btn-chip{
        border:0;
        background:#f1f2f3;
        border-radius:999px;
        padding:12px 18px;
        font-size:16px;
        font-weight:800;
      }

      .btn-chip.active{background:#111827;color:#fff}

      .field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
      .field label{font-size:14px;font-weight:800;color:#4b5563}
      .field input{
        width:100%;height:54px;border-radius:16px;border:1px solid #d1d5db;padding:0 14px;font-size:16px;
      }
    }
  </style>
</head>

     <!-- Date range -->

  <script>
    const ORDERS_API = '/api/orders';
    const FETCH_LIMIT = 50;
    const FETCH_LIMIT_MAX = 200;

    let allOrders = [];
    let activeRange = 'all';
    let isLoading = false;

    const RANGE_LABELS = {
      all: 'كل الوقت',
      today: 'اليوم',
      yesterday: 'أمس',
      last7: 'آخر 7 أيام',
      last30: 'آخر 30 يومًا',
      custom: 'نطاق مخصص'
    };

    const STATUS_CHIP = {
      pending:'yellow', processing:'blue', shipped:'purple', completed:'green', cancelled:'red', delivered:'green', awaiting_payment:'yellow'
    };

    function qs(id){ return document.getElementById(id) }

    function showAlert(message, type='success'){
      const box = qs('alertBox');
      if (!box) return;
      box.textContent = message;
      box.className = `active ${type}`;
      clearTimeout(window.__alertTimer);
      window.__alertTimer = setTimeout(()=>{
        box.className = '';
        box.textContent = '';
      }, 4000);
    }

    function setText(id, value){ const el = qs(id); if (el) el.textContent = value; }

    function setLoadingState(loading){
      isLoading = loading;
      const btns = [qs('refreshBtn'), qs('mobileRefreshBtnReal')].filter(Boolean);
      btns.forEach(btn => {
        btn.disabled = loading;
        btn.textContent = loading ? 'جاري التحديث' : 'تحديث البيانات';
      });
    }

    function formatCurrency(value){ const num = Number(value || 0); return `KWD ${num.toFixed(3)}`; }

    function normalizeDate(value){
      if (!value) return null;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function getOrderDate(order){ return normalizeDate(order.created_at || order.createdAt || order.date || order.order_date || order.updated_at || null); }
    function getOrderTotal(order){ return Number(order.total ?? order.order_total ?? order.final_total ?? order.total_amount ?? 0) || 0; }
    function isPendingOrder(order){ const s = String(order.status || '').trim().toLowerCase(); return ['pending','processing','awaiting_payment'].includes(s); }
    function isCancelledOrder(order){ return String(order.status || '').trim().toLowerCase() === 'cancelled'; }
    function startOfDay(date){ const d = new Date(date); d.setHours(0,0,0,0); return d; }
    function endOfDay(date){ const d = new Date(date); d.setHours(23,59,59,999); return d; }

    function getPresetRange(name){
      const now = new Date();
      if (name === 'today') return { from:startOfDay(now), to:endOfDay(now) };
      if (name === 'yesterday') { const d = new Date(); d.setDate(d.getDate() - 1); return { from:startOfDay(d), to:endOfDay(d) }; }
      if (name === 'last7') { const f = new Date(); f.setDate(now.getDate() - 6); return { from:startOfDay(f), to:endOfDay(now) }; }
      if (name === 'last30') { const f = new Date(); f.setDate(now.getDate() - 29); return { from:startOfDay(f), to:endOfDay(now) }; }
      return null;
    }

    function filterOrdersByRange(orders){
      if (activeRange === 'all') return orders;
      let range = null;
      if (activeRange === 'custom') {
        const fromVal = qs('dateFromInput').value;
        const toVal = qs('dateToInput').value;
        if (!fromVal || !toVal) return orders;
        range = { from:startOfDay(new Date(fromVal)), to:endOfDay(new Date(toVal)) };
      } else {
        range = getPresetRange(activeRange);
      }
      if (!range) return orders;
      return orders.filter(o => {
        const d = getOrderDate(o);
        return d && d >= range.from && d <= range.to;
      });
    }

    function formatShortDate(date){ if (!date) return '—'; return date.toLocaleDateString('ar-KW',{day:'2-digit', month:'short'}); }

    function escapeHtml(v){
      return String(v ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#x27;');
    }

    function renderRecentOrders(filtered){
      const list = qs('recentOrdersList');
      if (!list) return;
      if (!filtered.length) { list.innerHTML = ''; return; }
      const rows = [...filtered].sort((a,b)=>(getOrderDate(b)?.getTime()||0)-(getOrderDate(a)?.getTime()||0)).slice(0,5);
      list.innerHTML = rows.map(order => {
        const id = order.id || '';
        const orderNumber = escapeHtml(order.order_number || `#${id}`);
        const customer = escapeHtml(order.customer_name || 'عميل غير معروف');
        const total = formatCurrency(getOrderTotal(order));
        const status = String(order.status || 'pending').trim().toLowerCase();
        const chipColor = STATUS_CHIP[status] || 'grey';
        const dateLabel = formatShortDate(getOrderDate(order));
        return `<a class="activity-item" href="/order-details.html?id=${encodeURIComponent(id)}"><div class="activity-left"><div class="activity-title">${orderNumber} — ${customer}</div><div class="activity-sub">${total}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0"><span class="chip ${chipColor}">${escapeHtml(status)}</span><span class="chip grey">${dateLabel}</span></div></a>`;
      }).join('');
    }

    function renderDashboard(){
      const filtered = filterOrdersByRange(allOrders);
      const totalOrders = filtered.length;
      const totalSales = filtered.reduce((s,o)=>s+getOrderTotal(o),0);
      const avgOrder = totalOrders ? totalSales / totalOrders : 0;
      const pendingOrders = filtered.filter(isPendingOrder).length;
      const cancelledOrders = filtered.filter(isCancelledOrder).length;
      const today = new Date();
      const todayOrders = filtered.filter(o => {
        const d = getOrderDate(o);
        return d && d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
      }).length;

      setText('ordersCountBadge', String(allOrders.length));
      setText('ordersCountBadgeMobile', String(allOrders.length));
      setText('totalSalesValue', formatCurrency(totalSales));
      setText('ordersCountValue', String(totalOrders));
      setText('avgOrderValue', formatCurrency(avgOrder));
      setText('pendingOrdersValue', String(pendingOrders));
      setText('loadedOrdersChip', `الطلبات: ${filtered.length}`);
      setText('pendingChip', `معلقة: ${pendingOrders}`);
      setText('attentionPendingValue', String(pendingOrders));
      setText('attentionTodayValue', String(todayOrders));
      setText('attentionCancelledValue', String(cancelledOrders));
      setText('miniLoadedOrders', String(allOrders.length));
      setText('miniFilteredOrders', String(filtered.length));
      const rangeLabel = RANGE_LABELS[activeRange] || 'كل الوقت';
      setText('activeRangeLabel', rangeLabel);
      setText('activeRangeLabelMobile', rangeLabel);
      setText('miniRangeLabel', rangeLabel);
      renderRecentOrders(filtered);
    }

    async function fetchJsonWithTimeout(url, options={}, timeoutMs=15000){
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal:controller.signal, cache:'no-store', headers:{ Accept:'application/json', ...(options.headers||{}) } });
        const text = await response.text();
        if (!text) return { response, result:null };
        try { return { response, result:JSON.parse(text) }; }
        catch { throw new Error(`Non-JSON response from ${url}`); }
      } catch (error) {
        if (error.name === 'AbortError') throw new Error(`Request timeout: ${url}`);
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchAllOrders(){
      let offset = 0;
      let total = null;
      const results = [];
      while (true) {
        const url = `${ORDERS_API}?limit=${FETCH_LIMIT}&offset=${offset}&sort=created_at&order=DESC`;
        const { response, result } = await fetchJsonWithTimeout(url);
        if (!response.ok || !result?.success) throw new Error(result?.error || 'فشل في تحميل الطلبات');
        const chunk = Array.isArray(result.data) ? result.data : [];
        results.push(...chunk);
        total = Number(result.pagination?.total ?? results.length);
        offset += chunk.length;
        if (!chunk.length || results.length >= total || results.length >= FETCH_LIMIT_MAX) break;
      }
      return results;
    }

    async function reloadDashboard(showMessage=false){
      if (isLoading) return;
      setLoadingState(true);
      try {
        allOrders = await fetchAllOrders();
        renderDashboard();
      } catch (error) {
        console.error(error);
      } finally {
        setLoadingState(false);
      }
    }

    function applyPresetRange(rangeName, btn){
      if (isLoading) return;
      activeRange = rangeName;
      if (rangeName !== 'custom') {
        qs('dateFromInput').value = '';
        qs('dateToInput').value = '';
        const mobileFrom = qs('mobileDateFrom');
        const mobileTo = qs('mobileDateTo');
        if (mobileFrom) mobileFrom.value = '';
        if (mobileTo) mobileTo.value = '';
      }
      document.querySelectorAll('[data-range]').forEach(b => b.classList.toggle('active', b === btn));
      renderDashboard();
    }

    function syncMobileDate(which, value){
      if (which === 'from') qs('dateFromInput').value = value;
      if (which === 'to') qs('dateToInput').value = value;
      if (qs('dateFromInput').value && qs('dateToInput').value) {
        activeRange = 'custom';
        renderDashboard();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      reloadDashboard(false);
    });
  </script>
</body>
</html>
