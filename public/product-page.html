<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>صفحة المنتج</title>
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-dark: #6a4c93;
      --purple-light: #9b59b6;
      --header-blue: #3160e0;
      --topbar-bg: #3f0448;
      --deep-purple: #41064b;
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a4c93 0%, #9b59b6 100%);
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; }

    .topbar {
      background: var(--topbar-bg);
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .topbar-arrow {
      font-size: 1.2rem;
      line-height: 1;
      flex: 0 0 auto;
    }

    .site-header {
      background: #fff;
      min-height: 86px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .site-menu-btn,
    .site-icon-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      text-decoration: none;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      position: relative;
    }

    .site-header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .site-header-logo img {
      width: 320px;
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      display: block;
    }

    .site-header-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #5b1970;
      color: #fff;
      font-size: .75rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .menu-backdrop,
    .search-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 1190;
    }

    body.menu-open .menu-backdrop,
    body.search-open .search-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: min(92vw, 400px);
      height: 100vh;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(18px);
      border-right: 1px solid rgba(0,0,0,0.08);
      box-shadow: 12px 0 30px rgba(0,0,0,0.18);
      z-index: 1200;
      transform: translateX(-105%);
      transition: transform .25s ease;
      display: flex;
      flex-direction: column;
    }

    body.menu-open .side-menu {
      transform: translateX(0);
    }

    .side-menu__head {
      min-height: 82px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      flex-shrink: 0;
      background: #fff;
    }

    .side-menu__close {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    .side-menu__logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .side-menu__logo img {
      width: 300px;
      max-width: 100%;
      max-height: 56px;
      object-fit: contain;
      display: block;
    }

    .side-menu__icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .side-menu__body {
      flex: 1;
      overflow: auto;
      padding: 8px 0 0;
      background: #4a064f;
      color: #fff;
    }

    .side-menu__nav a {
      display: block;
      padding: 18px 26px;
      font-size: 1.08rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,.05);
      color: #fff;
    }

    .side-menu__footer {
      padding: 18px 22px 24px;
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      color: #fff;
    }

    .side-menu__social {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .side-menu__social a {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
    }

    .search-panel {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      width: min(92vw, 520px);
      background: rgba(255,255,255,0.98);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
      padding: 16px;
    }

    body.search-open .search-panel {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .search-panel input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .search-results {
      max-height: 50vh;
      overflow: auto;
      display: grid;
      gap: 10px;
    }

    .search-result-item {
      padding: 12px;
      background: #f7f7fb;
      border-radius: 12px;
      border: 1px solid #ececf3;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(20px);
      padding: 1rem;
      border-radius: 15px;
      color: white;
    }

    .top a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      transition: all 0.3s;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--glass-shadow);
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .img-wrapper {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 15px;
      background: linear-gradient(45deg, #8e44ad, #c39bd3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 4rem;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      display: block;
    }

    .img-wrapper.placeholder {
      font-size: 3rem;
      color: rgba(255,255,255,0.3);
    }

    h1 {
      color: #6a4c93;
      font-size: 2rem;
      margin: 0;
      line-height: 1.3;
    }

    .vendor {
      color: #666;
      font-size: 0.95rem;
      font-style: italic;
    }

    .price {
      font-size: 2rem;
      font-weight: bold;
      color: #6a4c93;
      text-shadow: 0 0 10px rgba(106, 76, 147, 0.2);
    }

    .desc {
      color: #555;
      line-height: 1.8;
      padding: 1rem;
      background: #f8f9ff;
      border-radius: 12px;
      border-right: 4px solid #9b59b6;
    }

    .category {
      color: #666;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      background: rgba(155, 89, 182, 0.1);
      border-radius: 8px;
      display: inline-block;
    }

    .tag {
      display: inline-block;
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
      padding: 6px 12px;
      margin: 4px 4px 0 0;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .actions-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: .5rem;
    }

    .buy-btn,
    .back-btn {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      font-weight: 900;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .buy-btn {
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: #fff;
      flex: 1 1 180px;
    }

    .back-btn {
      background: rgba(106,76,147,.1);
      color: var(--purple-dark);
      flex: 1 1 180px;
    }

    .muted {
      color: #666;
    }

    .status {
      color: white;
      text-align: center;
      padding: 2rem;
    }

    .error {
      background: rgba(220, 53, 69, 0.9);
      color: white;
      padding: 1.5rem;
      border-radius: 12px;
      text-align: center;
    }

    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    .whatsapp-icon-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.5rem;
      }

      .price {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 768px) {
      .site-header {
        grid-template-columns: 52px 1fr 96px;
        min-height: 82px;
        padding: 10px 12px;
      }

      .site-header-logo img,
      .side-menu__logo img {
        max-height: 54px;
      }

      .site-menu-btn,
      .site-icon-btn {
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

    <div class="site-header-logo">
      <img src="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Logo_smart_kids-of-header-tag.png?v=1756574543" alt="Smart Kids Kuwait Logo">

    <input type="text" id="searchInput" placeholder="ابحث في المنتجات..." />
    <div class="search-results" id="searchResults"></div>

  <a href="https://wa.me/96566635393" target="_blank" class="whatsapp-float" title="تواصل عبر واتساب">
    <img src="/icon-whatsapp.png" alt="WhatsApp" class="whatsapp-icon-img">

  <div class="wrap">
    <div class="top">
      <a href="./products-full.html">← رجوع للمتجر</a>
      <span id="crumb" class="muted"></span>
    </div>

    <div id="status" class="status">📦 جاري تحميل المنتج…</div>

    <div id="view" class="grid" style="display:none">
      <div class="card">
        <div class="img-wrapper" id="imgWrapper">
          <img id="pImg" alt="" style="display:none">
        </div>

      <div class="card">
        <h1 id="pName"></h1>

        <div id="pCategory" style="margin: 1rem 0;"></div>

        <p id="pDesc" class="desc"></p>

        <div id="pTags" style="margin-top: 1rem;"></div>

        <div class="actions-row">
          <button class="buy-btn" id="buyBtn" type="button">أضف للسلة</button>

  <script src="collections-manager.js"></script>
  <script>
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    let currentProduct = null;
    const statusEl = document.getElementById("status");
    const viewEl = document.getElementById("view");
    const imgWrapper = document.getElementById("imgWrapper");

    const urlParams = new URLSearchParams(location.search);
    const productId = urlParams.get("id");
    const collectionKey = urlParams.get("collection");

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartDisplay() {
      const cartBadge = document.getElementById('cartBadge');
      if (!cartBadge) return;

      const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);

      if (totalQty > 0) {
        cartBadge.style.display = 'flex';
        cartBadge.textContent = totalQty;
      } else {
        cartBadge.style.display = 'none';
        cartBadge.textContent = '0';
      }
    }

    function addToCart(product) {
      const id = product.id || product.handle || (product.title || product.name);
      const name = product.title || product.name || 'منتج';
      const price = extractPrice(product);
      const image = extractImage(product);

      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ id, name, price, quantity: 1, image });
      }

      saveCart();
      updateCartDisplay();
    }

    function openMenu() {
      document.body.classList.add('menu-open');
    }

    function closeMenu() {
      document.body.classList.remove('menu-open');
    }

    function openSearch() {
      document.body.classList.add('search-open');
      setTimeout(() => {
        const input = document.getElementById('searchInput');
        if (input) input.focus();
      }, 50);
    }

    function closeSearch() {
      document.body.classList.remove('search-open');
    }

    function renderSearchResults(products) {
      const container = document.getElementById('searchResults');
      if (!container) return;

      if (!products.length) {
        container.innerHTML = '<div class="search-result-item">لا توجد نتائج</div>';
        return;
      }

      container.innerHTML = products.map(product => {
        const title = product.title || product.name || 'منتج';
        const price = extractPrice(product);
        const id = encodeURIComponent(product.handle || product.id || '');
        return `
          <div class="search-result-item">
            <div style="font-weight:800; margin-bottom:6px;">${title}</div>
            <div style="color:#6a4c93; font-weight:700; margin-bottom:8px;">${price.toFixed(3)} د.ك</div>
            <a href="./products-page.html?id=${id}" style="color:#3160e0; font-weight:700;">فتح المنتج</a>
          </div>
        `;
      }).join('');
    }

    async function handleSearch(query) {
      try {
        const manager = window.initCollectionsManager();
        await manager.loadProducts();
        const all = manager.products || [];
        const q = String(query || '').trim().toLowerCase();

        if (!q) {
          renderSearchResults([]);
          return;
        }

        const results = all.filter(product => {
          const hay = `${product.title || product.name || ''} ${product.type || ''} ${product.category || ''} ${extractDescription(product.body_html || product.description || '')}`.toLowerCase();
          return hay.includes(q);
        }).slice(0, 8);

        renderSearchResults(results);
      } catch (e) {
        renderSearchResults([]);
      }
    }

    if (!productId) {
      statusEl.innerHTML = '<div class="error">❌ معرف المنتج ناقص! استخدم: ?id=المعرف&collection=المجموعة</div>';
      throw new Error("Missing ID");
    }

    async function loadProduct() {
      try {
        const manager = window.initCollectionsManager();
        await manager.loadProducts();

        let product = null;

        if (collectionKey) {
          const collection = manager.getCollectionByKey(collectionKey);
          if (collection) {
            product = collection.products.find(p => String(p.handle) === String(productId) || String(p.id) === String(productId));
          }
        }

        if (!product) {
          const allCollections = manager.getAllCollections();
          for (const col of allCollections) {
            product = col.products.find(p => String(p.handle) === String(productId) || String(p.id) === String(productId));
            if (product) break;
          }
        }

        if (!product) {
          statusEl.innerHTML = '<div class="error">❌ المنتج غير موجود</div>';
          return;
        }

        currentProduct = product;
        renderProduct(product);
      } catch (error) {
        console.error('خطأ:', error);
        statusEl.innerHTML = '<div class="error">❌ خطأ في تحميل المنتج</div>';
      }
    }

    function renderProduct(product) {
      const name = product.title || product.name || '';
      const vendor = product.vendor || 'Smart Kids Kuwait';
      const price = extractPrice(product);
      const desc = extractDescription(product.body_html || product.description) || 'وصف المنتج غير متوفر';
      const image = extractImage(product);
      const category = product.type || product.category || 'عام';
      const tags = _getProductTags(product) || [];

      document.title = `${name} - Smart Kids Kuwait`;

      document.getElementById("pName").textContent = name;
      document.getElementById("pVendor").textContent = vendor;
      document.getElementById("pPrice").textContent = `${price.toFixed(3)} د.ك`;
      document.getElementById("pDesc").textContent = desc;
      document.getElementById("crumb").textContent = category;

      const imgEl = document.getElementById("pImg");
      if (image) {
        imgEl.src = image;
        imgEl.alt = name;
        imgEl.style.display = 'block';
        imgWrapper.classList.remove('placeholder');

        imgEl.onerror = () => {
          imgEl.style.display = 'none';
          imgWrapper.classList.add('placeholder');
          imgWrapper.innerHTML = '🎁';
        };
      } else {
        imgWrapper.classList.add('placeholder');
        imgWrapper.innerHTML = '📦';
      }

      const categoryEl = document.getElementById("pCategory");
      categoryEl.innerHTML = `<span class="category">📁 ${category}</span>`;

      const tagsEl = document.getElementById("pTags");
      tagsEl.innerHTML = '';
      tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagsEl.appendChild(span);
      });

      const buyBtn = document.getElementById('buyBtn');
      if (buyBtn) {
        buyBtn.onclick = () => addToCart(product);
      }

      statusEl.style.display = 'none';
      viewEl.style.display = 'grid';
    }

    function extractPrice(product) {
      if (product.price != null && !isNaN(parseFloat(product.price))) {
        return parseFloat(product.price);
      }
      if (product.variants && product.variants[0] && product.variants[0].price) {
        return parseFloat(product.variants[0].price);
      }
      const type = (product.type || '').toLowerCase();
      if (type.includes('كتاب') || type.includes('قصة')) return 15.0;
      if (type.includes('علبة') || type.includes('مونتيسوري')) return 25.0;
      if (type.includes('عرض') || type.includes('مجموعة')) return 35.0;
      return 20.0;
    }

    function extractImage(product) {
      if (product.image) return product.image;
      if (product.images && product.images.length > 0) {
        return product.images[0].src || product.images[0];
      }
      return 'https://via.placeholder.com/300x300?text=Product';
    }

    function extractDescription(bodyHtml) {
      if (!bodyHtml) return '';
      const div = document.createElement('div');
      div.innerHTML = bodyHtml;
      const text = div.textContent || div.innerText || '';
      return text.substring(0, 500);
    }

    function _getProductTags(product) {
      if (Array.isArray(product.tags)) return product.tags;
      if (product.tags) return String(product.tags).split(',').map(t => t.trim()).filter(Boolean);
      return [];
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadProduct();
      updateCartDisplay();

      const menuBtn = document.getElementById('menuBtn');
      const menuClose = document.getElementById('menuClose');
      const menuBackdrop = document.getElementById('menuBackdrop');
      const searchBtn = document.getElementById('searchBtn');
      const searchOverlay = document.getElementById('searchOverlay');
      const searchInput = document.getElementById('searchInput');

      if (menuBtn) menuBtn.addEventListener('click', openMenu);
      if (menuClose) menuClose.addEventListener('click', closeMenu);
      if (menuBackdrop) menuBackdrop.addEventListener('click', closeMenu);

      if (searchBtn) searchBtn.addEventListener('click', openSearch);
      if (searchOverlay) searchOverlay.addEventListener('click', closeSearch);
      if (searchInput) {
        searchInput.addEventListener('input', e => handleSearch(e.target.value));
      }
    });
  </script>
</body>
</html>
