<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>صفحة المنتج</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a4c93 0%, #9b59b6 100%);
      color: #333;
      min-height: 100vh;
    }
    
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(20px);
      padding: 1rem;
      border-radius: 15px;
      color: white;
    }
    
    .top a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      transition: all 0.3s;
    }
    
    .top a:hover {
      background: rgba(255,255,255,0.4);
      transform: translateY(-2px);
    }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    }
    
    .card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .img-wrapper {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 15px;
      background: linear-gradient(45deg, #8e44ad, #c39bd3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 4rem;
    }
    
    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
    }
    
    .img-wrapper.placeholder {
      font-size: 3rem;
      color: rgba(255,255,255,0.3);
    }
    
    h1 {
      color: #6a4c93;
      font-size: 2rem;
      margin: 0;
      line-height: 1.3;
    }
    
    .vendor {
      color: #666;
      font-size: 0.95rem;
      font-style: italic;
    }
    
    .price {
      font-size: 2rem;
      font-weight: bold;
      color: #6a4c93;
      text-shadow: 0 0 10px rgba(106, 76, 147, 0.2);
    }
    
    .desc {
      color: #555;
      line-height: 1.8;
      padding: 1rem;
      background: #f8f9ff;
      border-radius: 12px;
      border-right: 4px solid #9b59b6;
    }
    
    .category {
      color: #666;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      background: rgba(155, 89, 182, 0.1);
      border-radius: 8px;
      display: inline-block;
    }
    
    .tag {
      display: inline-block;
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
      padding: 6px 12px;
      margin: 4px 4px 0 0;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    
    .muted {
      color: #666;
    }
    
    .status {
      color: white;
      text-align: center;
      padding: 2rem;
    }
    
    .error {
      background: rgba(220, 53, 69, 0.9);
      color: white;
      padding: 1.5rem;
      border-radius: 12px;
      text-align: center;
    }
    
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      .price {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <a href="./index.html">← رجوع للرئيسية</a>
      <span id="crumb" class="muted"></span>
    </div>

    <div id="status" class="status">📦 جاري تحميل المنتج…</div>

    <div id="view" class="grid" style="display:none">
      <div class="card">
        <div class="img-wrapper" id="imgWrapper">
          <img id="pImg" alt="" style="display:none">
        </div>
      </div>

      <div class="card">
        <h1 id="pName"></h1>
        <div id="pVendor" class="vendor"></div>
        <div id="pPrice" class="price"></div>
        
        <div id="pCategory" style="margin: 1rem 0;"></div>
        
        <p id="pDesc" class="desc"></p>

        <div id="pTags" style="margin-top: 1rem;"></div>
      </div>
    </div>
  </div>

  <script src="collections-manager.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const viewEl = document.getElementById("view");
    const imgWrapper = document.getElementById("imgWrapper");

    const urlParams = new URLSearchParams(location.search);
    const productId = urlParams.get("id");
    const collectionKey = urlParams.get("collection");

    if (!productId) {
      statusEl.innerHTML = '<div class="error">❌ معرف المنتج ناقص! استخدم: ?id=المعرف&collection=المجموعة</div>';
      throw new Error("Missing ID");
    }

    async function loadProduct() {
      try {
        if (!collectionsManager) {
          initCollectionsManager();
        }
        
        await collectionsManager.loadProducts();
        
        let product = null;
        if (collectionKey) {
          const collection = collectionsManager.getCollectionByKey(collectionKey);
          if (collection) {
            product = collection.products.find(p => p.handle === productId || p.id === productId);
          }
        }
        
        if (!product) {
          const allCollections = collectionsManager.getAllCollections();
          for (const col of allCollections) {
            product = col.products.find(p => p.handle === productId || p.id === productId);
            if (product) break;
          }
        }

        if (!product) {
          statusEl.innerHTML = '<div class="error">❌ المنتج غير موجود</div>';
          return;
        }

        renderProduct(product);
      } catch (error) {
        console.error('خطأ:', error);
        statusEl.innerHTML = '<div class="error">❌ خطأ في تحميل المنتج</div>';
      }
    }

    function renderProduct(product) {
      const name = product.title || product.name || '';
      const vendor = product.vendor || 'Smart Kids Kuwait';
      const price = extractPrice(product);
      const desc = extractDescription(product.body_html) || 'وصف المنتج غير متوفر';
      const image = extractImage(product);
      const category = product.type || 'عام';
      const tags = _getProductTags(product) || [];

      document.title = `${name} - Smart Kids Kuwait`;

      document.getElementById("pName").textContent = name;
      document.getElementById("pVendor").textContent = vendor;
      document.getElementById("pPrice").textContent = `${price.toFixed(3)} د.ك`;
      document.getElementById("pDesc").textContent = desc;
      document.getElementById("crumb").textContent = category;

      const imgEl = document.getElementById("pImg");
      if (image) {
        imgEl.src = image;
        imgEl.alt = name;
        imgEl.style.display = 'block';
        imgWrapper.classList.remove('placeholder');
        
        imgEl.onerror = () => {
          imgEl.style.display = 'none';
          imgWrapper.classList.add('placeholder');
          imgWrapper.innerHTML = '🎁';
        };
      } else {
        imgWrapper.classList.add('placeholder');
        imgWrapper.innerHTML = '📦';
      }

      const categoryEl = document.getElementById("pCategory");
      categoryEl.innerHTML = `<span class="category">📁 ${category}</span>`;

      const tagsEl = document.getElementById("pTags");
      tagsEl.innerHTML = '';
      tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagsEl.appendChild(span);
      });

      statusEl.style.display = 'none';
      viewEl.style.display = 'grid';
    }

    function extractPrice(product) {
      if (product.variants && product.variants[0] && product.variants[0].price) {
        return parseFloat(product.variants[0].price);
      }
      const type = (product.type || '').toLowerCase();
      if (type.includes('كتاب') || type.includes('قصة')) return 15.0;
      if (type.includes('علبة') || type.includes('مونتيسوري')) return 25.0;
      if (type.includes('عرض') || type.includes('مجموعة')) return 35.0;
      return 20.0;
    }

    function extractImage(product) {
      if (product.images && product.images.length > 0) {
        return product.images[0].src || product.images[0];
      }
      return null;
    }

    function extractDescription(bodyHtml) {
      if (!bodyHtml) return '';
      const div = document.createElement('div');
      div.innerHTML = bodyHtml;
      const text = div.textContent || div.innerText || '';
      return text.substring(0, 500);
    }

    function _getProductTags(product) {
      if (Array.isArray(product.tags)) return product.tags;
      if (product.tags) return String(product.tags).split(',').map(t => t.trim()).filter(Boolean);
      return [];
    }

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
