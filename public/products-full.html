<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Kids Store - متجر الأطفال المبتكرون</title>
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-dark: #6a4c93;
      --purple-light: #9b59b6;
      --glass-bg: rgba(255,255,255,0.25);
      --glass-border: rgba(255,255,255,0.18);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a4c93 0%, #9b59b6 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1rem; }

    .nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem 0 2rem;
    }
    .nav a {
      padding: 12px 24px;
      background: rgba(255,255,255,0.9);
      color: var(--purple-dark);
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .nav a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      background: white;
    }

    .search-container { text-align: center; margin: 1rem 0; }
    .search-input {
      padding: 15px 25px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 25px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      color: #333;
      font-size: 1.05rem;
      width: 100%;
      max-width: 520px;
    }
    .search-input::placeholder { color: #666; }
    .search-input:focus {
      outline: none;
      border-color: var(--purple-dark);
      background: rgba(255,255,255,0.4);
    }

    .filter-btn {
      padding: 10px 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      color: #333;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--purple-dark);
      color: white;
      border-color: var(--purple-dark);
      transform: translateY(-1px);
    }

    .products-stats {
      text-align: center;
      margin: 1rem 0 1.2rem;
      padding: 1rem;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .stats-info { color: #333; font-weight: bold; font-size: 1.05rem; }

    .layout-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      margin: 1.5rem 0;
      align-items: start;
    }

    .sidebar {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 15px;
      padding: 1.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .sidebar h3 {
      color: var(--purple-dark);
      margin-bottom: 1rem;
      font-weight: 800;
    }

    #categoryFilters .filter-btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 0.5rem;
      background: rgba(106, 76, 147, 0.1);
      color: #333;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      text-align: right;
      font-weight: 800;
      transition: all 0.3s;
    }
    #categoryFilters .filter-btn:hover {
      background: rgba(106, 76, 147, 0.2);
      border-color: var(--purple-dark);
    }
    #categoryFilters .filter-btn.active {
      background: linear-gradient(45deg, var(--purple-dark), var(--purple-light));
      color: white;
      border-color: var(--purple-dark);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      margin: 1rem 0;
    }

    .product {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      transition: all 0.3s;
    }
    .product:hover { transform: translateY(-10px); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }

    .product-image { height: 280px; overflow: hidden; background: linear-gradient(45deg, #8e44ad, #c39bd3); }
    .product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .product:hover .product-image img { transform: scale(1.05); }

    .product-info { padding: 1.5rem; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
    .product-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 0.5rem; color: #333; line-height: 1.4; }
    .product-description {
      color: #555;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-category {
      font-size: 0.85rem;
      color: #666;
      background: rgba(106, 76, 147, 0.15);
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .product-price {
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--purple-dark);
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(106, 76, 147, 0.3);
    }
    .add-to-cart {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 15px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 32px rgba(106, 76, 147, 0.3);
    }
    .add-to-cart:hover { transform: scale(1.02); }

    .loading {
      text-align: center;
      padding: 3rem;
      grid-column: 1 / -1;
      color: #fff;
      font-weight: 800;
    }

    .cart {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      min-width: 250px;
      max-width: 320px;
      z-index: 999;
    }
    .cart-title { font-weight: 900; color: var(--purple-dark); margin-bottom: 1rem; font-size: 1.1rem; }
    .cart-items { margin-bottom: 1rem; max-height: 200px; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
    .cart-total {
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--purple-dark);
      margin-bottom: 1rem;
      text-align: center;
      padding: 0.5rem;
      background: rgba(106, 76, 147, 0.1);
      border-radius: 10px;
    }
    .checkout-btn {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
      font-size: 1rem;
    }

    .order-form {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin: 2rem 0;
      display: none;
    }

    .products-actions {
      text-align: center;
      margin: 1.5rem 0 0;
    }

    @media (max-width: 900px) {
      .layout-grid { grid-template-columns: 1fr; }
      .sidebar { position: relative; top: auto; }
      .cart { position: relative; top: auto; left: auto; margin: 1rem; }
    }
  </style>
</head>

<body>

  <div class="cart">
    <div class="cart-title">🛒 السلة</div>
    <div class="cart-items" id="cartItems"><p>السلة فارغة</p></div>
    <div class="cart-total" id="cartTotal">الإجمالي: 0.000 د.ك</div>
    <button class="checkout-btn" onclick="showCheckout()">إتمام الطلب</button>
  </div>

  <div class="container">

    <div class="nav">
      <a href="#products">المنتجات</a>
      <a href="./collections.html">🏷️ المجموعات</a>
      <a href="#orders" onclick="showOrders()">الطلبات</a>
    </div>

    <div class="search-container">
      <input type="text" class="search-input"
             placeholder="🔍 ابحث في المنتجات بالاسم أو الوصف أو الفئة..."
             oninput="window.productsLoader && window.productsLoader.searchProducts(this.value)">
    </div>

    <div class="products-stats" id="productsStats">
      <div class="stats-info">إجمالي المنتجات: <strong>0</strong></div>
    </div>

    <div class="layout-grid">

      <aside class="sidebar">
        <h3>📚 الأقسام</h3>
        <div id="categoryFilters">
          <button class="filter-btn active" data-category="الكل">الكل</button>
        </div>
      </aside>

      <main>
        <div class="products" id="products">
          <div class="loading">📦 جاري تحميل المنتجات...</div>
        </div>

        <div class="products-actions">
          <button id="loadMoreBtn" class="filter-btn" style="display:none; padding: 12px 22px;">
            تحميل المزيد
          </button>
        </div>
      </main>

    </div>

    <div class="order-form" id="orderForm">
      <h2>إتمام الطلب</h2>
      <form onsubmit="submitOrder(event)">
        <div class="form-group">
          <label for="customerName">الاسم الكامل:</label>
          <input type="text" id="customerName" required>
        </div>
        <div class="form-group">
          <label for="customerPhone">رقم الهاتف:</label>
          <input type="tel" id="customerPhone" required>
        </div>
        <div class="form-group">
          <label for="customerEmail">البريد الإلكتروني (اختياري):</label>
          <input type="email" id="customerEmail">
        </div>
        <div class="form-group">
          <label for="customerAddress">العنوان:</label>
          <input type="text" id="customerAddress" required>
        </div>
        <div class="cart-total">الإجمالي: <span id="checkoutTotal">0.000 د.ك</span></div>
        <button type="submit" class="checkout-btn" style="background:linear-gradient(45deg,#28a745,#20c997)">تأكيد الطلب 🛍️</button>
      </form>

      <div class="success-message" id="successMessage" style="display:none; margin-top:1rem; padding:1rem; border-radius:10px; background:#d4edda; color:#155724; text-align:center;">
        ✅ تم إرسال طلبك بنجاح!<br>
        رقم الطلب: <span id="orderNumber"></span><br>
        سيتم التواصل معك قريباً
      </div>
    </div>

  </div>

  <script>
    let cart = [];
    let orderCounter = 1000;

    function addToCart(name, price, productId = null, btn = null) {
      const existingItem = cart.find(item => item.name === name);

      if (existingItem) existingItem.quantity += 1;
      else cart.push({ name, price, quantity: 1, id: productId });

      updateCartDisplay();

      if (btn && btn instanceof HTMLElement) {
        const originalText = btn.textContent;
        const originalBg = btn.style.background;

        btn.style.background = '#28a745';
        btn.textContent = 'تمت الإضافة ✓';

        setTimeout(() => {
          btn.style.background = originalBg;
          btn.textContent = originalText;
        }, 1200);
      }
    }

    function updateCartDisplay() {
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');

      if (cart.length === 0) {
        cartItems.innerHTML = '<p>السلة فارغة</p>';
        cartTotal.textContent = 'الإجمالي: 0.000 د.ك';
        return;
      }

      let html = '';
      let total = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        html += `
          <div class="cart-item">
            <div>
              <div style="font-weight: bold; font-size: 0.9rem;">${item.name}</div>
              <div style="font-size: 0.8rem; color: #666;">
                ${item.quantity} × ${item.price.toFixed(3)} د.ك
              </div>
            </div>
            <button onclick="removeFromCart(${index})"
              style="background:#dc3545;color:#fff;border:none;border-radius:50%;width:25px;height:25px;cursor:pointer;font-size:14px;">×</button>
          </div>
        `;
      });

      cartItems.innerHTML = html;
      cartTotal.textContent = `الإجمالي: ${total.toFixed(3)} د.ك`;
    }

    function removeFromCart(index) { cart.splice(index, 1); updateCartDisplay(); }

    function showCheckout() {
      if (cart.length === 0) { alert('السلة فارغة! أضف بعض المنتجات أولاً.'); return; }

      const orderForm = document.getElementById('orderForm');
      const checkoutTotal = document.getElementById('checkoutTotal');

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      checkoutTotal.textContent = `${total.toFixed(3)} د.ك`;

      orderForm.style.display = 'block';
      orderForm.scrollIntoView({ behavior: 'smooth' });
    }

    function submitOrder(event) {
      event.preventDefault();

      const orderData = {
        orderNumber: `SK-${++orderCounter}`,
        customerName: document.getElementById('customerName').value,
        customerPhone: document.getElementById('customerPhone').value,
        customerEmail: document.getElementById('customerEmail').value,
        customerAddress: document.getElementById('customerAddress').value,
        items: cart,
        total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
        date: new Date().toLocaleString('ar-EG')
      };

      const existingOrders = JSON.parse(localStorage.getItem('orders') || '[]');
      existingOrders.push(orderData);
      localStorage.setItem('orders', JSON.stringify(existingOrders));

      document.getElementById('orderNumber').textContent = orderData.orderNumber;
      document.getElementById('successMessage').style.display = 'block';

      cart = [];
      updateCartDisplay();
      event.target.reset();

      setTimeout(() => {
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'none';
      }, 8000);
    }

    function showOrders() {
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      if (orders.length === 0) { alert('لا توجد طلبات بعد.'); return; }

      let ordersHtml = `<h2 style="color:#fff;text-align:center;margin-bottom:2rem;">📋 قائمة الطلبات</h2>`;

      orders.forEach(order => {
        ordersHtml += `
          <div style="background:#fff;padding:1.5rem;margin:1rem 0;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1);border-right:4px solid #6a4c93;">
            <h3 style="color:#6a4c93;margin-bottom:1rem;">📦 طلب رقم: ${order.orderNumber}</h3>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;">
              <p><strong>👤 العميل:</strong> ${order.customerName}</p>
              <p><strong>📞 الهاتف:</strong> ${order.customerPhone}</p>
              <p><strong>📍 العنوان:</strong> ${order.customerAddress}</p>
              <p><strong>📅 التاريخ:</strong> ${order.date}</p>
            </div>
            <p style="font-size:1.2rem;font-weight:bold;color:#28a745;margin:1rem 0;">
              💰 الإجمالي: ${order.total.toFixed(3)} د.ك
            </p>
            <p><strong>🛍️ المنتجات:</strong></p>
            <ul style="margin:0.5rem 0;padding-right:2rem;">
              ${order.items.map(item =>
                `<li>${item.name} - الكمية: ${item.quantity} × ${item.price.toFixed(3)} د.ك</li>`
              ).join('')}
            </ul>
          </div>
        `;
      });

      const w = window.open('', '_blank');
      w.document.write(`
        <html dir="rtl"><head><meta charset="UTF-8"><title>الطلبات</title>
        <style>
          body{font-family:'Segoe UI',Tahoma;padding:2rem;margin:0;background:linear-gradient(135deg,#6a4c93,#9b59b6);}
          @media print{body{background:#fff;}}
        </style>
        </head><body>${ordersHtml}</body></html>
      `);
    }
  </script>

  <!-- ✅ خليها LOCAL فقط عشان CORS والملفات الضخمة -->
  <script>
    window.DATA_URL_CANDIDATES = [
      "/products.json"
    ];
  </script>

  <!-- ✅ لازم Absolute على Vercel -->
  <script src="/products-loader.js"></script>

</body>
</html>
