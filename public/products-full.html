<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Kids Store - متجر الأطفال المبتكرون</title>
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457">
  <script src="/js/meta-pixel.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-dark: #4d0f62;
      --purple-light: #8f50c8;
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.20);
      --header-blue: #3160e0;
      --topbar-bg: #3f0448;
      --success: #28a745;

      --page-bg-1: #5f2b86;
      --page-bg-2: #7a3fa8;
      --text-light: #f6eef9;
      --text-soft: rgba(255,255,255,0.78);
      --price: #fff3e2;
      --offer-bg: #42104c;
      --btn-border: rgba(255,255,255,0.65);

      --toast-bg:#ffffff;
      --toast-text:#2d2140;
      --toast-border:#e8dff0;
      --toast-shadow:0 18px 40px rgba(0,0,0,.18);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--page-bg-1) 0%, var(--page-bg-2) 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; }

    .topbar {
      background: var(--topbar-bg);
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .topbar-arrow {
      font-size: 1.2rem;
      line-height: 1;
      flex: 0 0 auto;
    }

    .site-header {
      background: #fff;
      min-height: 86px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .site-menu-btn,
    .site-icon-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      text-decoration: none;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      position: relative;
    }

    .site-header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .site-header-logo img {
      width: 320px;
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      display: block;
    }

    .site-header-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #5b1970;
      color: #fff;
      font-size: .75rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 1190;
    }

    body.menu-open .menu-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(92vw, 400px);
      height: 100vh;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(18px);
      border-left: 1px solid rgba(0,0,0,0.08);
      box-shadow: -12px 0 30px rgba(0,0,0,0.18);
      z-index: 1200;
      transform: translateX(105%);
      transition: transform .25s ease;
      display: flex;
      flex-direction: column;
    }

    body.menu-open .side-menu {
      transform: translateX(0);
    }

    .side-menu__head {
      min-height: 82px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      flex-shrink: 0;
      background: #fff;
    }

    .side-menu__close {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: var(--header-blue);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    .side-menu__logo {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .side-menu__logo img {
      width: 300px;
      max-width: 100%;
      max-height: 56px;
      object-fit: contain;
      display: block;
    }

    .side-menu__icons {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .side-menu__body {
      flex: 1;
      overflow: auto;
      padding: 8px 0 0;
      background: #4a064f;
      color: #fff;
    }

    .side-menu__nav a {
      display: block;
      padding: 18px 26px;
      font-size: 1.08rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,.05);
      color: #fff;
    }

    .side-menu__footer {
      padding: 18px 22px 24px;
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      color: #fff;
    }

    .side-menu__social {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .side-menu__social a {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .side-menu__social img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }

    .nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .8rem;
      margin: 1rem 0 1.2rem;
    }

    .nav a {
      padding: 10px 18px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 999px;
      font-weight: 700;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,.14);
    }

    .search-container {
      text-align: center;
      margin: 1rem 0 1.1rem;
    }

    .search-input {
      padding: 15px 25px;
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 25px;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 1.05rem;
      width: 100%;
      max-width: 520px;
      outline: none;
    }

    .search-input::placeholder { color: rgba(255,255,255,.75); }

    .filter-toggle-wrap {
      display: none;
      margin: 0 0 1rem;
    }

    .filter-toggle-btn {
      width: 100%;
      min-height: 56px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      background: rgba(255,255,255,.12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .products-stats {
      text-align: center;
      margin: 0 0 1rem;
      padding: 0.95rem 1rem;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .stats-info { color: #fff; font-weight: 700; font-size: 1rem; }

    .layout-grid {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 1.4rem;
      margin: 1rem 0;
      align-items: start;
    }

    .sidebar {
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      height: fit-content;
      position: sticky;
      top: 100px;
      border: 1px solid rgba(255,255,255,.14);
    }

    .sidebar h3 {
      color: #fff;
      margin-bottom: 0.9rem;
      font-weight: 800;
    }

    #categoryFilters {
      display: grid;
      gap: 8px;
    }

    #categoryFilters .filter-btn {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.10);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      cursor: pointer;
      text-align: right;
      font-weight: 700;
      transition: all 0.2s;
    }

    #categoryFilters .filter-btn:hover {
      background: rgba(255,255,255,0.16);
    }

    #categoryFilters .filter-btn.active {
      background: linear-gradient(45deg, var(--purple-dark), var(--purple-light));
      color: white;
      border-color: transparent;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 18px;
      margin: 0;
      align-items: start;
    }

    .product {
      background: transparent;
      border-radius: 18px;
      overflow: visible;
      transition: transform .2s ease;
    }

    .product:hover {
      transform: translateY(-4px);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #5f4777;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
      margin-bottom: 12px;
    }

    .product-image a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
      display: block;
    }

    .product:hover .product-image img { transform: scale(1.03); }

    .product-info {
      padding: 0 2px;
      background: transparent;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-light);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3.2em;
    }

    .product-description {
      color: var(--text-soft);
      margin-bottom: 8px;
      font-size: 0.92rem;
      line-height: 1.55;
      min-height: 2.8em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-category {
      display: none !important;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--price);
      line-height: 1.2;
      direction: ltr;
      text-align: right;
      white-space: nowrap;
      margin-bottom: 14px;
    }

.product-price-wrap{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px;
      margin-bottom:14px;
    }

    .product-price{
      margin-bottom:0;
    }

    .product-price-old{
      color:rgba(255,255,255,.7);
      font-size:.9rem;
      text-decoration:line-through;
      direction:ltr;
      text-align:right;
      white-space:nowrap;
    }

    .product-offer-badge,
    .product-stock-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:28px;
      padding:4px 10px;
      border-radius:999px;
      font-size:.82rem;
      font-weight:800;
      white-space:nowrap;
    }

    .product-offer-badge{
      background:rgba(255,213,74,.18);
      color:#fff1b8;
      border:1px solid rgba(255,213,74,.28);
    }

    .product-stock-badge{
      display: none !important;
    }

    .product-stock-badge.out-of-stock{
      display: none !important;
    }

    .add-to-cart.is-disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .product-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .add-to-cart,
    .view-product-btn {
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .add-to-cart {
      background: transparent;
      color: #fff;
      border: 3px solid var(--btn-border);
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }

    .view-product-btn {
      background: rgba(255,255,255,0.96);
      color: #6a4c93;
      border: 1px solid rgba(106,76,147,.18);
    }

    .add-to-cart:hover,
    .view-product-btn:hover {
      transform: translateY(-2px);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      grid-column: 1 / -1;
      color: #fff;
      font-weight: 800;
    }

    .products-actions {
      text-align: center;
      margin: 1.5rem 0 0;
    }

    .load-more-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    .whatsapp-icon-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    .toast{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%) translateY(-130%);
      width:min(94vw,620px);
      background:var(--toast-bg);
      color:var(--toast-text);
      border:1px solid var(--toast-border);
      border-radius:18px;
      box-shadow:var(--toast-shadow);
      z-index:2000;
      transition:transform .3s ease, opacity .3s ease;
      opacity:0;
      overflow:hidden;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
      opacity:1;
    }

    .toast-inner{
      display:grid;
      grid-template-columns:72px 1fr 44px;
      gap:12px;
      align-items:center;
      padding:12px;
    }

    .toast-thumb{
      width:72px;
      height:72px;
      border-radius:14px;
      overflow:hidden;
      background:#f1f1f1;
      border:1px solid #eee;
    }

    .toast-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .toast-content{
      min-width:0;
    }

    .toast-title{
      font-size:1rem;
      font-weight:800;
      color:#384;
      margin-bottom:4px;
    }

    .toast-name{
      font-size:.96rem;
      color:#111;
      line-height:1.5;
      margin-bottom:8px;
    }

    .toast-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .toast-actions a{
      min-height:34px;
      padding:0 12px;
      border-radius:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:.9rem;
      font-weight:700;
    }

    .toast-cart-link{
      background:#5b1970;
      color:#fff;
    }

    .toast-continue{
      background:#f3eef7;
      color:#5b1970;
    }

    .toast-close{
      width:36px;
      height:36px;
      border:0;
      border-radius:999px;
      background:#f5f2f8;
      color:#6f6380;
      cursor:pointer;
      font-size:1.2rem;
    }

    @media (max-width: 900px) {
      .layout-grid { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        display: none;
      }
      .sidebar.mobile-open {
        display: block;
      }
      .filter-toggle-wrap {
        display: block;
      }
    }

    @media (max-width: 768px) {
      .site-header {
        grid-template-columns: 52px 1fr 96px;
        min-height: 82px;
        padding: 10px 12px;
      }

      .site-header-logo img,
      .side-menu__logo img {
        max-height: 54px;
      }

      .site-menu-btn,
      .site-icon-btn {
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }

      .container { padding: 1rem .9rem 2rem; }
      .products { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; }

      .product-title {
        font-size: .98rem;
      }

      .product-description {
        font-size: .86rem;
      }

      .product-price {
        font-size: .95rem;
      }

      .add-to-cart,
      .view-product-btn {
        min-height: 54px;
        font-size: .92rem;
        border-radius: 12px;
      }

      .toast-inner{
        grid-template-columns:60px 1fr 36px;
      }

      .toast-thumb{
        width:60px;
        height:60px;
      }
    }

    @media (max-width: 520px) {
      .nav a {
        padding: 9px 14px;
        font-size: .82rem;
      }

      .product-title {
        min-height: 3em;
      }
    }
  
    /* =========================================================
       PRODUCTS FULL — PREMIUM GLASS / LIQUID POLISH
       CSS only. Footer remains controlled by footer.js.
       ========================================================= */

    body {
      background:
        radial-gradient(circle at 14% 10%, rgba(255, 112, 221, 0.20), transparent 28%),
        radial-gradient(circle at 86% 16%, rgba(102, 152, 255, 0.16), transparent 30%),
        radial-gradient(circle at 48% 88%, rgba(255,255,255,0.08), transparent 32%),
        linear-gradient(180deg, #5a2581 0%, #7b3fa8 46%, #58156a 100%) !important;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .nav a,
    .products-stats,
    .search-input,
    .filter-toggle-btn,
    .sidebar,
    .load-more-btn {
      box-shadow:
        0 18px 38px rgba(34, 0, 58, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.14) !important;
    }

    .nav a {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.17), rgba(255,255,255,0.08)) !important;
      border: 1px solid rgba(255,255,255,0.18) !important;
      backdrop-filter: blur(14px) saturate(140%) !important;
      -webkit-backdrop-filter: blur(14px) saturate(140%) !important;
    }

    .search-input {
      max-width: 620px !important;
      min-height: 56px !important;
      border-radius: 999px !important;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08)) !important;
      border: 1px solid rgba(255,255,255,0.22) !important;
      backdrop-filter: blur(18px) saturate(145%) !important;
      -webkit-backdrop-filter: blur(18px) saturate(145%) !important;
      font-weight: 700 !important;
    }

    .products-stats {
      max-width: 620px;
      margin-inline: auto !important;
      border-radius: 22px !important;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.17), rgba(255,255,255,0.07)) !important;
      border: 1px solid rgba(255,255,255,0.18) !important;
      backdrop-filter: blur(18px) saturate(145%) !important;
      -webkit-backdrop-filter: blur(18px) saturate(145%) !important;
    }

    .sidebar {
      border-radius: 26px !important;
      padding: 1.05rem !important;
      background:
        radial-gradient(circle at 85% 12%, rgba(255, 116, 221, 0.18), transparent 35%),
        linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.07)) !important;
      border: 1px solid rgba(255,255,255,0.18) !important;
      backdrop-filter: blur(22px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(22px) saturate(150%) !important;
    }

    #categoryFilters .filter-btn {
      min-height: 44px !important;
      border-radius: 16px !important;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.13), rgba(255,255,255,0.06)) !important;
      border: 1px solid rgba(255,255,255,0.13) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10) !important;
    }

    #categoryFilters .filter-btn.active {
      background:
        linear-gradient(135deg, rgba(119, 54, 184, 0.98), rgba(207, 74, 215, 0.90)) !important;
      box-shadow:
        0 12px 28px rgba(39, 0, 65, 0.24),
        inset 0 1px 0 rgba(255,255,255,0.24) !important;
    }

    .products {
      gap: 24px 18px !important;
    }

    .product {
      position: relative !important;
      overflow: hidden !important;
      border-radius: 28px !important;
      padding: 12px 12px 14px !important;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.07)) !important;
      border: 1px solid rgba(255,255,255,0.20) !important;
      box-shadow:

  <script>
    const PRODUCTS_API = '/api/products?status=active&limit=300&offset=0&sort=created_at&order=DESC';

    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    let toastTimer = null;

    let allProducts = [];
    let filteredProducts = [];
    let currentCategory = 'الكل';
    let visibleCount = 12;

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeText(value, fallback = '') {
      const text = String(value ?? '').trim();
      return text || fallback;
    }

    function normalizeText(value) {
      return safeText(value).toLowerCase();
    }

    function extractTitle(product) {
      return safeText(product.product_name ?? product.name ?? product.title, 'منتج');
    }

    function extractDescription(product) {
      return safeText(product.description ?? product.body_html, '');
    }

    function extractCategory(product) {
      return safeText(product.category ?? product.product_type ?? product.type, 'غير مصنف');
    }

    function toNumber(value) {
      if (value === null || value === undefined || value === '') return 0;
      const number = Number(String(value).replace(/[^0-9.-]/g, ''));
      return Number.isFinite(number) ? number : 0;
    }

    function getCurrentRawPrice(product) {
      return toNumber(
        product.price ??
        product.current_price ??
        product.final_price ??
        product.amount ??
        0
      );
    }

    function getRegularPrice(product) {
      const regular = toNumber(
        product.regular_price ??
        product.compare_at_price ??
        product.price_before ??
        product.original_price ??
        product.list_price ??
        0
      );

      if (regular > 0) return regular;

      const current = getCurrentRawPrice(product);
      const explicitSale = toNumber(
        product.sale_price ??
        product.price_after ??
        product.discounted_price ??
        product.discount_price ??
        product.special_price ??
        0
      );

      return current > 0 ? current : explicitSale;
    }

    function getSalePrice(product) {
      const explicitSale = toNumber(
        product.sale_price ??
        product.price_after ??
        product.discounted_price ??
        product.discount_price ??
        product.special_price ??
        0
      );

      const regular = getRegularPrice(product);
      const current = getCurrentRawPrice(product);

      if (explicitSale > 0 && regular > explicitSale) return explicitSale;
      if (current > 0 && regular > current) return current;
      return 0;
    }

    function hasSale(product) {
      const regular = getRegularPrice(product);
      const sale = getSalePrice(product);
      return sale > 0 && regular > sale;
    }

    function extractPrice(product) {
      const regular = getRegularPrice(product);
      const sale = getSalePrice(product);
      const current = getCurrentRawPrice(product);

      if (hasSale(product)) return sale;
      if (current > 0) return current;
      return regular;
    }

    function getDisplayDescription(product) {
      return safeText(product.description ?? product.body_html ?? product.short_description ?? '');
    }

    function getAvailableStock(product) {
      const value = toNumber(
        product.stock_quantity ??
        product.quantity ??
        product.inventory_quantity ??
        product.inventory ??
        product.stock ??
        product.available_quantity ??
        product.available ??
        0
      );
      return Math.max(0, value);
    }

    function isPurchasable(product) {
      const status = safeText(product.status, 'active').toLowerCase();
      const inventoryBlocked = Number(product.inventory_blocked ?? 0) === 1;
      const stock = getAvailableStock(product);

      return status === 'active' && !inventoryBlocked && stock > 0;
    }

    function getStockLabel(product) {
      return isPurchasable(product) ? 'متوفر' : 'نفدت الكمية';
    }

    function getPriceMarkup(product) {
      const finalPrice = extractPrice(product);
      const regularPrice = getRegularPrice(product);
      const sale = hasSale(product);

      return `
        <div class="product-price-wrap">
          ${sale ? `<div class="product-offer-badge">عرض خاص</div>` : ''}
          ${sale ? `<div class="product-price-old">KWD ${regularPrice.toFixed(3)}</div>` : ''}
          <div class="product-price">KWD ${finalPrice.toFixed(3)}</div>
        </div>
      `;
    }

    function extractImage(product) {
      const image =
        product.primary_image ||
        product.image_url ||
        product.image ||
        (Array.isArray(product.images) && product.images[0] && (product.images[0].image_url || product.images[0].src || product.images[0].url)) ||
        '';

      return safeText(image, `https://via.placeholder.com/400x400?text=${encodeURIComponent(extractTitle(product))}`);
    }

    function getProductUrl(product) {
      const slug = safeText(product.slug);
      const id = safeText(product.id);

      if (slug) return `./product-page.html?slug=${encodeURIComponent(slug)}`;
      return `./product-page.html?id=${encodeURIComponent(id)}`;
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartDisplay() {
      const totalQty = cart.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
      const badges = [
        document.getElementById('cartBadge'),
        document.getElementById('menuCartBadge')
      ];

      badges.forEach((badge) => {
        if (!badge) return;

        if (totalQty > 0) {
          badge.style.display = 'flex';
          badge.textContent = totalQty;
        } else {
          badge.style.display = 'none';
          badge.textContent = '0';
        }
      });
    }

    function showCartToast(product) {
      const toast = document.getElementById('cartToast');
      const toastImage = document.getElementById('toastImage');
      const toastName = document.getElementById('toastName');

      if (toastImage) {
        toastImage.src = extractImage(product);
      }

      if (toastName) {
        toastName.textContent = extractTitle(product);
      }

      toast.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3200);
    }

    function hideCartToast() {
      const toast = document.getElementById('cartToast');
      if (toast) toast.classList.remove('show');
      clearTimeout(toastTimer);
    }

    function addToCart(product) {
      if (!isPurchasable(product)) {
        alert('هذا المنتج نفدت كميته وغير متاح للشراء حالياً');
        return;
      }

      const itemId = product.id || product.slug || extractTitle(product);
      const existing = cart.find(item => String(item.id) === String(itemId));
      const nextQuantity = existing ? Number(existing.quantity || 0) + 1 : 1;
      const availableStock = getAvailableStock(product);

      if (nextQuantity > availableStock) {
        alert(`الكمية المتاحة فقط هي ${availableStock}`);
        return;
      }

      if (existing) {
        existing.quantity = nextQuantity;
      } else {
        cart.push({
          id: itemId,
          name: extractTitle(product),
          price: extractPrice(product),
          quantity: 1,
          image: extractImage(product)
        });
      }

      saveCart();
      updateCartDisplay();
      showCartToast(product);
    }

    function openMenu() {
      document.body.classList.add('menu-open');
    }

    function closeMenu() {
      document.body.classList.remove('menu-open');
    }

    function focusMainSearch() {
      closeMenu();
      const input = document.getElementById('mainSearchInput');
      if (!input) return;
      input.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => input.focus(), 250);
    }

    function toggleMobileFilters() {
      const sidebar = document.getElementById('sidebarFilters');
      const icon = document.getElementById('filterToggleIcon');
      if (!sidebar || !icon) return;

      sidebar.classList.toggle('mobile-open');
      icon.textContent = sidebar.classList.contains('mobile-open') ? '⌃' : '⌄';
    }

    function updateStats() {
      const stats = document.getElementById('productsStats');
      const strong = stats.querySelector('strong');
      if (strong) {
        strong.textContent = filteredProducts.length;
      }
    }

    function buildCategoryFilters() {
      const container = document.getElementById('categoryFilters');
      const categories = [...new Set(allProducts.map(extractCategory).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));

      container.innerHTML = `
        <button class="filter-btn ${currentCategory === 'الكل' ? 'active' : ''}" data-category="الكل">الكل</button>
        ${categories.map(cat => `
          <button class="filter-btn ${currentCategory === cat ? 'active' : ''}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>
        `).join('')}
      `;

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.category || 'الكل';
          visibleCount = 12;
          applyFilters();
        });
      });
    }

    function applyFilters() {
      const query = normalizeText(document.getElementById('mainSearchInput').value);

      filteredProducts = allProducts.filter(product => {
        const matchesCategory = currentCategory === 'الكل' || extractCategory(product) === currentCategory;

        if (!matchesCategory) return false;

        if (!query) return true;

        const haystack = normalizeText([
          extractTitle(product),
          extractDescription(product),
          extractCategory(product),
          product.vendor || '',
          product.sku || '',
          product.tags || ''
        ].join(' '));

        return haystack.includes(query);
      });

      buildCategoryFilters();
      updateStats();
      renderProducts();
    }

    function productCard(product) {
      const title = extractTitle(product);
      const description = getDisplayDescription(product);
      const image = extractImage(product);
      const url = getProductUrl(product);
      const id = product.id || product.slug || title;
      const purchasable = isPurchasable(product);

      return `
        <article class="product">
          <div class="product-image">
            <a href="${url}">
              <img src="${image}" alt="${escapeHtml(title)}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(title)}'">
            </a>
          </div>

          <div class="product-info">
            <a href="${url}">
              <div class="product-title">${escapeHtml(title)}</div>
            </a>

            ${description ? `<div class="product-description">${escapeHtml(description)}</div>` : ''}
            ${getPriceMarkup(product)}

            <div class="product-actions">
              <button class="add-to-cart${purchasable ? '' : ' is-disabled'}" type="button" data-product-id="${escapeHtml(String(id))}" ${purchasable ? '' : 'disabled'}>${purchasable ? 'إضافة إلى السلة' : 'نفدت الكمية'}</button>
              <a class="view-product-btn" href="${url}">عرض المنتج</a>
            </div>
          </div>
        </article>
      `;
    }

    function renderProducts() {
      const container = document.getElementById('products');
      const loadMoreBtn = document.getElementById('loadMoreBtn');

      if (!filteredProducts.length) {
        container.innerHTML = `<div class="loading">لا توجد منتجات مطابقة</div>`;
        loadMoreBtn.style.display = 'none';
        return;
      }

      const visibleItems = filteredProducts.slice(0, visibleCount);
      container.innerHTML = visibleItems.map(productCard).join('');

      container.querySelectorAll('[data-product-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.productId;
          const product = allProducts.find(p => String(p.id || p.slug || extractTitle(p)) === String(id));
          if (product) addToCart(product);
        });
      });

      loadMoreBtn.style.display = visibleCount < filteredProducts.length ? 'inline-flex' : 'none';
    }

    async function loadProducts() {
      try {
        const response = await fetch(PRODUCTS_API, {
          cache: 'no-store',
          headers: { Accept: 'application/json' }
        });

        const result = await response.json().catch(() => null);

        if (!response.ok || !result || !result.success) {
          throw new Error(result?.error || `HTTP ${response.status}`);
        }

        allProducts = Array.isArray(result.data) ? result.data : [];
        filteredProducts = [...allProducts];

        buildCategoryFilters();
        updateStats();
        renderProducts();
      } catch (error) {
        console.error('loadProducts error:', error);
        document.getElementById('products').innerHTML = `
          <div class="loading">⚠️ حدث خطأ أثناء تحميل المنتجات</div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateCartDisplay();
      loadProducts();

      const menuBtn = document.getElementById('menuBtn');
      const menuClose = document.getElementById('menuClose');
      const menuBackdrop = document.getElementById('menuBackdrop');
      const searchBtn = document.getElementById('searchBtn');
      const filterToggleBtn = document.getElementById('filterToggleBtn');
      const toastClose = document.getElementById('toastClose');
      const toastContinue = document.getElementById('toastContinue');
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      const mainSearchInput = document.getElementById('mainSearchInput');

      if (menuBtn) menuBtn.addEventListener('click', openMenu);
      if (menuClose) menuClose.addEventListener('click', closeMenu);
      if (menuBackdrop) menuBackdrop.addEventListener('click', closeMenu);
      if (searchBtn) searchBtn.addEventListener('click', focusMainSearch);
      if (filterToggleBtn) filterToggleBtn.addEventListener('click', toggleMobileFilters);

      if (toastClose) {
        toastClose.addEventListener('click', hideCartToast);
      }

      if (toastContinue) {
        toastContinue.addEventListener('click', (e) => {
          e.preventDefault();
          hideCartToast();
        });
      }

      if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', () => {
          visibleCount += 12;
          renderProducts();
        });
      }

      if (mainSearchInput) {
        mainSearchInput.addEventListener('input', () => {
          visibleCount = 12;
          applyFilters();
        });
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeMenu();
          hideCartToast();
        }
      });
    });
  </script>

  <div id="site-footer"></div>
  <script src="./footer.js"></script>
  <script src="/js/live-visitors.js"></script>
</body>
</html>
