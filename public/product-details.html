        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --purple-dark: #6a4c93;
            --purple-light: #9b59b6;
            --header-blue: #3160e0;
            --topbar-bg: #3f0448;
            --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            --success: #27ae60;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a4c93 0%, #9b59b6 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        a { text-decoration: none; }

        .topbar {
            background: var(--topbar-bg);
            color: #fff;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 14px;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
        }

        .topbar-arrow {
            font-size: 1.2rem;
            line-height: 1;
            flex: 0 0 auto;
        }

        .site-header {
            background: #fff;
            min-height: 86px;
            display: grid;
            grid-template-columns: 52px 1fr 96px;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .site-menu-btn,
        .site-icon-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            background: transparent;
            color: var(--header-blue);
            text-decoration: none;
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
            position: relative;
        }

        .site-header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .site-header-logo img {
            width: 320px;
            max-width: 100%;
            max-height: 58px;
            object-fit: contain;
            display: block;
        }

        .site-header-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: #5b1970;
            color: #fff;
            font-size: .75rem;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .menu-backdrop,
        .search-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
            z-index: 1190;
        }

        body.menu-open .menu-backdrop,
        body.search-open .search-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: min(92vw, 400px);
            height: 100vh;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(18px);
            border-right: 1px solid rgba(0,0,0,0.08);
            box-shadow: 12px 0 30px rgba(0,0,0,0.18);
            z-index: 1200;
            transform: translateX(-105%);
            transition: transform .25s ease;
            display: flex;
            flex-direction: column;
        }

        body.menu-open .side-menu {
            transform: translateX(0);
        }

        .side-menu__head {
            min-height: 82px;
            display: grid;
            grid-template-columns: 52px 1fr 96px;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            flex-shrink: 0;
            background: #fff;
        }

        .side-menu__close {
            width: 42px;
            height: 42px;
            border: 0;
            background: transparent;
            color: var(--header-blue);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .side-menu__logo {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .side-menu__logo img {
            width: 300px;
            max-width: 100%;
            max-height: 56px;
            object-fit: contain;
            display: block;
        }

        .side-menu__icons {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
        }

        .side-menu__body {
            flex: 1;
            overflow: auto;
            padding: 8px 0 0;
            background: #4a064f;
            color: #fff;
        }

        .side-menu__nav a {
            display: block;
            padding: 18px 26px;
            font-size: 1.08rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,.05);
            color: #fff;
        }

        .side-menu__footer {
            padding: 18px 22px 24px;
            border-top: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.03);
            color: #fff;
        }

        .side-menu__social {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .side-menu__social a {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
        }

        .search-panel {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            width: min(92vw, 520px);
            background: rgba(255,255,255,0.98);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            z-index: 1200;
            opacity: 0;
            pointer-events: none;
            transition: all .25s ease;
            padding: 16px;
        }

        body.search-open .search-panel {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .search-panel input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .search-results {
            max-height: 50vh;
            overflow: auto;
            display: grid;
            gap: 10px;
        }

        .search-result-item {
            padding: 12px;
            background: #f7f7fb;
            border-radius: 12px;
            border: 1px solid #ececf3;
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .breadcrumb {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
            color: white;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        
        .breadcrumb a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .breadcrumb a:hover {
            color: white;
            text-decoration: underline;
        }
        
        .product-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            padding: 2rem;
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-bottom: 2rem;
        }
        
        .product-image-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .product-main-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(45deg, #8e44ad, #c39bd3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 5rem;
        }
        
        .product-main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .product-info-section h1 {
            font-size: 2rem;
            color: var(--purple-dark);
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        
        .product-category {
            display: inline-block;
            background: var(--purple-light);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .product-rating {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            flex-wrap: wrap;
        }
        
        .stars {
            color: #ffc107;
            font-size: 1.2rem;
        }
        
        .rating-count {
            color: #666;
        }
        
        .product-price {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--purple-dark);
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(106, 76, 147, 0.2);
        }
        
        .price-note {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        
        .product-description {
            color: #555;
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #f8f9ff;
            border-radius: 12px;
            border-right: 4px solid var(--purple-light);
        }
        
        .product-options {
            margin-bottom: 2rem;
        }
        
        .option-group {
            margin-bottom: 1.5rem;
        }
        
        .option-label {
            display: block;
            font-weight: bold;
            color: var(--purple-dark);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        .option-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            color: #333;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        .option-select:focus {
            outline: none;
            border-color: var(--purple-light);
            box-shadow: 0 0 10px rgba(155, 89, 182, 0.2);
        }
        
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .quantity-label {
            font-weight: bold;
            color: var(--purple-dark);
        }
        
        .quantity-input {
            width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: var(--purple-dark);
        }
        
        .quantity-input:focus {
            outline: none;
            border-color: var(--purple-light);
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 200px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, var(--purple-dark), var(--purple-light));
            color: white;
            box-shadow: 0 8px 32px rgba(106, 76, 147, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(106, 76, 147, 0.4);
        }
        
        .btn-secondary {
            background: rgba(106, 76, 147, 0.1);
            color: var(--purple-dark);
            border: 2px solid var(--purple-dark);
        }
        
        .btn-secondary:hover {
            background: rgba(106, 76, 147, 0.2);
            transform: translateY(-2px);
        }
        
        .product-meta {
            background: #f8f9ff;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        
        .meta-item {
            text-align: center;
        }
        
        .meta-label {
            font-weight: bold;
            color: var(--purple-dark);
            margin-bottom: 0.5rem;
        }
        
        .meta-value {
            color: #666;
            font-size: 0.95rem;
        }
        
        .tabs {
            margin-top: 3rem;
            border-top: 2px solid #eee;
            padding-top: 2rem;
        }
        
        .tab-buttons {
            display: flex;
            gap: 1rem;
            border-bottom: 2px solid #eee;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: var(--purple-dark);
            border-bottom-color: var(--purple-dark);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .tab-content h3 {
            color: var(--purple-dark);
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }
        
        .tab-content p {
            color: #555;
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        
        .related-products {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
        }
        
        .related-title {
            font-size: 1.5rem;
            color: var(--purple-dark);
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        
        .related-card {
            background: rgba(255,255,255,0.5);
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        
        .related-card:hover {
            transform: translateY(-5px);
        }
        
        .related-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(45deg, #8e44ad, #c39bd3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        
        .related-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .related-info {
            padding: 1rem;
        }
        
        .related-name {
            font-weight: bold;
            color: var(--purple-dark);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        .related-price {
            color: var(--success);
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .user-icons {
            position: fixed;
            top: 100px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }
        
        .user-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6a4c93;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(31, 38, 135, 0.2);
        }
        
        .user-icon:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(31, 38, 135, 0.3);
            background: rgba(255,255,255,0.4);
        }
        
        .user-icon.logged-in {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
        }
        
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 25px;
            right: 25px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-icon-img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: white;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .site-header {
                grid-template-columns: 52px 1fr 96px;
                min-height: 82px;
                padding: 10px 12px;
            }

            .site-header-logo img,
            .side-menu__logo img {
                max-height: 54px;
            }

            .site-menu-btn,
            .site-icon-btn {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }

            .product-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .product-info-section h1 {
                font-size: 1.5rem;
            }
            
            .product-price {
                font-size: 2rem;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                min-width: auto;
            }
            
            .product-main-image {
                height: 300px;
            }

            .user-icons {
                top: 94px;
                left: 14px;
            }
        }
    </style>
</head>

    </div>

    <footer style="background: rgba(255,255,255,0.95); padding: 2rem 1rem; margin-top: 3rem; text-align: center; border-top: 1px solid #eee;">
        <p style="color: #666;">&copy; 2024 Smart Kids Kuwait</p>
    </footer>

    <script src="collections-manager.js"></script>
    <script>
        let currentProduct = null;
        let currentCategory = null;
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        
        async function loadProduct() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id');
                const collectionKey = urlParams.get('collection');
                
                if (!productId) {
                    showError('معرف المنتج غير موجود');
                    return;
                }
                
                if (!collectionsManager) {
                    initCollectionsManager();
                }
                
                await collectionsManager.loadProducts();
                
                let product = null;
                if (collectionKey) {
                    const collection = collectionsManager.getCollectionByKey(collectionKey);
                    if (collection) {
                        product = collection.products.find(p => String(p.handle) === String(productId) || String(p.id) === String(productId));
                        currentCategory = collection;
                    }
                }
                
                if (!product) {
                    const allCollections = collectionsManager.getAllCollections();
                    for (const col of allCollections) {
                        product = col.products.find(p => String(p.handle) === String(productId) || String(p.id) === String(productId));
                        if (product) {
                            currentCategory = col;
                            break;
                        }
                    }
                }
                
                if (!product) {
                    showError('المنتج غير موجود');
                    return;
                }
                
                currentProduct = product;
                renderProduct(product);
                
            } catch (error) {
                console.error('خطأ:', error);
                showError('حدث خطأ في تحميل المنتج');
            }
        }
        
        function renderProduct(product) {
            const container = document.getElementById('productContainer');
            const price = extractPrice(product);
            const image = extractImage(product);
            const description = extractDescription(product.body_html || product.description);
            const category = getCategoryLabelForProduct(product);
            
            document.getElementById('pageTitle').textContent = `${product.title} - Smart Kids Kuwait`;
            document.getElementById('pageDescription').setAttribute('content', description);
            document.getElementById('breadcrumbCategory').textContent = category;
            document.getElementById('breadcrumbProduct').textContent = product.title;
            
            const html = `
                <div class="product-grid">
                    <div class="product-image-section">
                        <div class="product-main-image">
                            <img src="${image}" alt="${product.title}" 
                                 onerror="this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(product.title)}'">
                        </div>
                    </div>
                    
                    <div class="product-info-section">
                        <div class="product-category">${category}</div>
                        <h1>${product.title}</h1>
                        
                        <div class="product-rating">
                            <span class="stars">⭐⭐⭐⭐⭐</span>
                            <span class="rating-count">(45 تقييم)</span>
                        </div>
                        
                        <div class="product-price">${price.toFixed(3)} د.ك</div>
                        <div class="price-note">السعر شامل جميع الرسوم</div>
                        
                        <div class="product-description">
                            ${description || 'وصف المنتج غير متوفر'}
                        </div>
                        
                        <div class="product-options">
                            <div class="option-group">
                                <label class="option-label">النوع</label>
                                <select class="option-select" id="productType">
                                    <option value="">اختر النوع</option>
                                    <option value="standard">النسخة العادية</option>
                                    <option value="deluxe">النسخة الفاخرة</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="quantity-selector">
                            <label class="quantity-label">الكمية:</label>
                            <input type="number" class="quantity-input" id="quantity" value="1" min="1" max="100">
                        </div>
                        
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="addToCart()">🛍️ أضف للسلة</button>
                            <button class="btn btn-secondary" onclick="addToWishlist()">❤️ أضف للمفضلة</button>
                        </div>
                        
                        <div class="product-meta">
                            <div class="meta-item">
                                <div class="meta-label">📦 التوصيل</div>
                                <div class="meta-value">توصيل مجاني للكويت</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">🔄 الإرجاع</div>
                                <div class="meta-value">14 يوم لا تسأل</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">✅ الضمان</div>
                                <div class="meta-value">ضمان 6 أشهر</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="tabs">
                    <div class="tab-buttons">
                        <button class="tab-btn active" data-tab="description">الوصف</button>
                        <button class="tab-btn" data-tab="details">المواصفات</button>
                        <button class="tab-btn" data-tab="reviews">التقييمات</button>
                    </div>
                    
                    <div class="tab-content active" id="tab-description">
                        <h3>وصف المنتج</h3>
                        <p>${description || 'لا يوجد وصف متوفر'}</p>
                    </div>
                    
                    <div class="tab-content" id="tab-details">
                        <h3>المواصفات</h3>
                        <p><strong>النوع:</strong> ${product.type || 'عام'}</p>
                        <p><strong>المجموعة:</strong> ${category}</p>
                        <p><strong>الحالة:</strong> متاح</p>
                        <p><strong>رمز المنتج:</strong> ${product.handle || product.id}</p>
                    </div>
                    
                    <div class="tab-content" id="tab-reviews">
                        <h3>تقييمات العملاء</h3>
                        <p>💬 لا توجد تقييمات حتى الآن. كن أول من يقيّم هذا المنتج!</p>
                    </div>
                </div>
                
                <div class="related-products" id="relatedProducts"></div>
            `;
            
            container.innerHTML = html;
            bindTabs();
            loadRelatedProducts();
            updateCartBadge();
        }

        function bindTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabName = btn.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`tab-${tabName}`).classList.add('active');
                });
            });
        }
        
        function loadRelatedProducts() {
            if (!currentCategory || !currentCategory.products) return;
            
            const related = currentCategory.products
                .filter(p => p.handle !== currentProduct.handle && p.id !== currentProduct.id)
                .slice(0, 4);
            
            if (related.length === 0) return;
            
            const relatedContainer = document.getElementById('relatedProducts');
            relatedContainer.innerHTML = `
                <h2 class="related-title">منتجات ذات صلة</h2>
                <div class="related-grid">
                    ${related.map(product => {
                        const price = extractPrice(product);
                        const image = extractImage(product);
                        return `
                            <div class="related-card">
                                <div class="related-image">
                                    <img src="${image}" alt="${product.title}" 
                                         onerror="this.src='https://via.placeholder.com/250x200?text=${encodeURIComponent(product.title)}'">
                                </div>
                                <div class="related-info">
                                    <div class="related-name">${product.title}</div>
                                    <div class="related-price">${price.toFixed(3)} د.ك</div>
                                    <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 8px;" 
                                            onclick="window.location.href='product-details.html?id=${product.handle || product.id}&collection=${currentCategory.key}'">
                                        عرض التفاصيل
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
        
        function addToCart() {
            if (!currentProduct) return;

            const quantity = parseInt(document.getElementById('quantity').value) || 1;
            const cartItem = {
                id: currentProduct.handle || currentProduct.id,
                name: currentProduct.title,
                price: extractPrice(currentProduct),
                quantity: quantity,
                image: extractImage(currentProduct)
            };
            
            const existing = cart.find(item => item.id === cartItem.id);
            
            if (existing) {
                existing.quantity += quantity;
            } else {
                cart.push(cartItem);
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
        }
        
        function addToWishlist() {
            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            const exists = wishlist.find(item => item.id === (currentProduct.handle || currentProduct.id));
            
            if (!exists) {
                wishlist.push({
                    id: currentProduct.handle || currentProduct.id,
                    name: currentProduct.title,
                    price: extractPrice(currentProduct)
                });
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                alert('تم إضافة المنتج للمفضلة! ❤️');
            } else {
                alert('المنتج موجود بالفعل في المفضلة');
            }
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const totalQty = cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0);

            if (totalQty > 0) {
                badge.style.display = 'flex';
                badge.textContent = totalQty;
            } else {
                badge.style.display = 'none';
                badge.textContent = '0';
            }
        }
        
        function extractPrice(product) {
            if (product.price != null && !isNaN(parseFloat(product.price))) {
                return parseFloat(product.price);
            }
            if (product.variants && product.variants.length > 0 && product.variants[0].price) {
                return parseFloat(product.variants[0].price);
            }
            const type = (product.type || '').toLowerCase();
            if (type.includes('كتاب') || type.includes('قصة')) return 15.0;
            if (type.includes('علبة') || type.includes('مونتيسوري')) return 25.0;
            if (type.includes('عرض') || type.includes('مجموعة')) return 35.0;
            return 20.0;
        }
        
        function extractImage(product) {
            if (product.image) return product.image;
            if (product.images && product.images.length > 0) {
                if (typeof product.images[0] === 'string') return product.images[0];
                if (product.images[0] && product.images[0].src) return product.images[0].src;
            }
            return `https://via.placeholder.com/400x400?text=${encodeURIComponent(product.title || 'منتج')}`;
        }
        
        function extractDescription(bodyHtml) {
            if (!bodyHtml) return 'وصف المنتج غير متوفر';
            const div = document.createElement('div');
            div.innerHTML = bodyHtml;
            const text = div.textContent || div.innerText || '';
            return text.length > 300 ? text.substring(0, 300) + '...' : text;
        }
        
        function getCategoryLabelForProduct(product) {
            if (currentCategory) return currentCategory.name;
            return product.type || 'عام';
        }
        
        function showError(message) {
            const container = document.getElementById('productContainer');
            container.innerHTML = `
                <div class="error">
                    <h3>❌ ${message}</h3>
                    <p>يرجى المحاولة لاحقاً أو العودة للصفحة الرئيسية</p>
                    <a href="./index.html" class="btn btn-primary" style="margin-top: 1rem; display:inline-block;">العودة للرئيسية</a>
                </div>
            `;
        }
        
        function updateUserIcons() {
            const isLoggedIn = localStorage.getItem('userLoggedIn') === 'true';
            const loginIcon = document.getElementById('loginIcon');
            
            if (isLoggedIn) {
                loginIcon.innerHTML = '✓';
                loginIcon.classList.add('logged-in');
                loginIcon.href = '#';
            }
        }

        function openMenu() {
            document.body.classList.add('menu-open');
        }

        function closeMenu() {
            document.body.classList.remove('menu-open');
        }

        function openSearch() {
            document.body.classList.add('search-open');
            setTimeout(() => {
                const input = document.getElementById('searchInput');
                if (input) input.focus();
            }, 50);
        }

        function closeSearch() {
            document.body.classList.remove('search-open');
            const input = document.getElementById('searchInput');
            const results = document.getElementById('searchResults');
            if (input) input.value = '';
            if (results) results.innerHTML = '';
        }

        async function handleSearch(query) {
            try {
                const manager = window.initCollectionsManager();
                await manager.loadProducts();
                const all = manager.products || [];
                const q = String(query || '').trim().toLowerCase();

                if (!q) {
                    renderSearchResults([]);
                    return;
                }

                const results = all.filter(product => {
                    const hay = `${product.title || product.name || ''} ${product.type || ''} ${product.category || ''} ${extractDescription(product.body_html || product.description || '')}`.toLowerCase();
                    return hay.includes(q);
                }).slice(0, 8);

                renderSearchResults(results);
            } catch (e) {
                renderSearchResults([]);
            }
        }

        function renderSearchResults(products) {
            const container = document.getElementById('searchResults');
            if (!container) return;

            if (!products.length) {
                container.innerHTML = '<div class="search-result-item">لا توجد نتائج</div>';
                return;
            }

            container.innerHTML = products.map(product => {
                const title = product.title || product.name || 'منتج';
                const price = extractPrice(product);
                const id = encodeURIComponent(product.handle || product.id || '');
                return `
                    <div class="search-result-item">
                        <div style="font-weight:800; margin-bottom:6px;">${title}</div>
                        <div style="color:#6a4c93; font-weight:700; margin-bottom:8px;">${price.toFixed(3)} د.ك</div>
                        <a href="./product-details.html?id=${id}" style="color:#3160e0; font-weight:700;">فتح المنتج</a>
                    </div>
                `;
            }).join('');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            updateUserIcons();
            updateCartBadge();
            loadProduct();

            const menuBtn = document.getElementById('menuBtn');
            const menuClose = document.getElementById('menuClose');
            const menuBackdrop = document.getElementById('menuBackdrop');
            const searchBtn = document.getElementById('searchBtn');
            const searchOverlay = document.getElementById('searchOverlay');
            const searchInput = document.getElementById('searchInput');

            if (menuBtn) menuBtn.addEventListener('click', openMenu);
            if (menuClose) menuClose.addEventListener('click', closeMenu);
            if (menuBackdrop) menuBackdrop.addEventListener('click', closeMenu);

            if (searchBtn) searchBtn.addEventListener('click', openSearch);
            if (searchOverlay) searchOverlay.addEventListener('click', closeSearch);
            if (searchInput) searchInput.addEventListener('input', e => handleSearch(e.target.value));
        });
    </script>
</body>
</html>
