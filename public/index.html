<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Kids Kuwait Store</title>
  <meta name="description" content="متجر الأطفال المبتكرون الكويت - Smart Kids Kuwait Store" />
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457" />
  <script src="/js/meta-pixel.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --bg:#4a0d57;
      --bg-2:#5a1669;
      --card:#101014;
      --soft:#f5e9b9;
      --white:#fff;
      --accent:#ffd54a;
      --shadow:0 12px 30px rgba(0,0,0,.22);
      --blue:#3160e0;
      --deep-purple:#551566;
      --toast-bg:#ffffff;
      --toast-text:#2d2140;
      --toast-border:#e8dff0;
      --toast-shadow:0 18px 40px rgba(0,0,0,.18);
    }

    html { scroll-behavior: smooth; }

    body{
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%);
      color: var(--white);
      overflow-x: hidden;
    }

    a{ color: inherit; text-decoration: none; }
    button{ font-family: inherit; }

    .topbar{
      min-height: 44px;
      background:#3c0646;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-align:center;
      padding:10px 14px;
      font-size:.96rem;
      font-weight:600;
    }

    .header{
      position: sticky;
      top: 0;
      z-index: 1000;
      background:#fff;
      border-bottom:1px solid rgba(0,0,0,.08);
      display:grid;
      grid-template-columns: 52px 1fr 90px;
      align-items:center;
      gap:8px;
      min-height:82px;
      padding:10px 14px;
    }

    .menu-btn,
    .icon-btn{
      border:0;
      background:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--blue);
    }

    .menu-btn{
      width:46px;
      height:46px;
      font-size:1.9rem;
      font-weight:800;
    }

    .logo-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      min-width:0;
    }

    .logo-wrap img{
      display:block;
      max-width:100%;
      width:320px;
      max-height:58px;
      object-fit:contain;
    }

    .header-icons{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      font-size:1.45rem;
      position:relative;
    }

    .cart-count{
      position:absolute;
      top:-3px;
      left:-3px;
      min-width:18px;
      height:18px;
      padding:0 4px;
      border-radius:999px;
      display:none;
      align-items:center;
      justify-content:center;
      background:#18b54c;
      color:#fff;
      font-size:.7rem;
      font-weight:800;
    }

    .drawer-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.4);
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease;
      z-index:1200;
    }

    .drawer{
      position:fixed;
      top:0;
      right:0;
      width:min(92vw,420px);
      height:100vh;
      background:#4a064f;
      color:#fff;
      transform:translateX(105%);
      transition:transform .28s ease;
      z-index:1210;
      display:flex;
      flex-direction:column;
    }

    body.menu-open .drawer-backdrop{
      opacity:1;
      pointer-events:auto;
    }

    body.menu-open .drawer{
      transform:translateX(0);
    }

    .drawer-head{
      background:#fff;
      color:var(--blue);
      display:grid;
      grid-template-columns:52px 1fr 90px;
      align-items:center;
      gap:8px;
      min-height:82px;
      padding:10px 14px;
      border-bottom:1px solid rgba(0,0,0,.08);
      flex-shrink:0;
    }

    .drawer-close{
      border:0;
      background:transparent;
      color:var(--blue);
      font-size:2.2rem;
      cursor:pointer;
      width:46px;
      height:46px;
    }

    .drawer-logo{
      display:flex;
      justify-content:center;
      align-items:center;
      min-width:0;
    }

    .drawer-logo img{
      display:block;
      max-width:100%;
      width:300px;
      max-height:56px;
      object-fit:contain;
    }

    .drawer-icons{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
    }

    .drawer-body{
      flex:1;
      overflow:auto;
      padding:12px 0 0;
    }

    .drawer-nav a{
      display:block;
      padding:18px 26px;
      font-size:1.1rem;
      font-weight:600;
      border-bottom:1px solid rgba(255,255,255,.04);
    }

    .drawer-footer{
      padding:18px 22px 24px;
      border-top:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
    }

    .drawer-login{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:1.05rem;
      margin-bottom:18px;
    }

    .drawer-social{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .drawer-social a,
    .footer-social a{
      width:42px;
      height:42px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .drawer-social img,
    .footer-social img{
      width:22px;
      height:22px;
      object-fit:contain;
      display:block;
    }

    .search-panel{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.42);
      z-index:1300;
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding:90px 14px 20px;
    }

    .search-box{
      width:min(100%, 460px);
      background:#fff;
      color:#111;
      border-radius:18px;
      padding:14px;
      box-shadow:var(--shadow);
    }

    .search-box input{
      width:100%;
      min-height:48px;
      border:1px solid #ddd;
      border-radius:12px;
      padding:12px 14px;
      font-size:1rem;
    }

    .search-results{
      margin-top:12px;
      max-height:54vh;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .search-item{
      border:1px solid #ececec;
      border-radius:12px;
      padding:10px;
      background:#fafafa;
    }

    .search-item-title{
      font-weight:700;
      color:#111;
      margin-bottom:4px;
    }

    .search-item-price{
      color:var(--deep-purple);
      font-weight:700;
      margin-bottom:8px;
    }

.search-item-price-wrap,
    .hero-price-wrap,
    .card-price-wrap{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .search-item-price-old,
    .hero-price-old,
    .card-price-old{
      color:rgba(255,255,255,.6);
      text-decoration:line-through;
      font-size:.88rem;
      direction:ltr;
    }

    .search-item-price-old{
      color:#7a6a8f;
    }

    .search-item-stock,
    .hero-stock-badge,
    .card-stock-badge,
    .offer-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:26px;
      padding:4px 10px;
      border-radius:999px;
      font-size:.8rem;
      font-weight:800;
      white-space:nowrap;
    }

    .offer-badge{
      background:rgba(255,213,74,.18);
      color:var(--accent);
      border:1px solid rgba(255,213,74,.24);
      width:fit-content;
    }

    .search-item-stock{
      background:#f3eef7;
      color:#5b1970;
      margin-bottom:8px;
    }

    .search-item-stock.out,
    .hero-stock-badge.out,
    .card-stock-badge.out{
      background:rgba(217,48,37,.16);
      color:#ffd8d4;
      border:1px solid rgba(217,48,37,.22);
    }

    .hero-stock-badge,
    .card-stock-badge{
      background:rgba(255,255,255,.1);
      color:#fff;
      border:1px solid rgba(255,255,255,.12);
      margin-bottom:10px;
      width:fit-content;
    }

    .hero-btn.is-disabled,
    .card-btn.is-disabled,
    .search-item button.is-disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .search-item-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .search-item button,
    .search-item a{
      border:0;
      border-radius:10px;
      min-height:38px;
      padding:0 14px;
      background:var(--deep-purple);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .search-item a{
      background:#7d49a8;
    }

    .search-close{
      width:100%;
      min-height:44px;
      margin-top:10px;
      border:0;
      border-radius:12px;
      background:var(--deep-purple);
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }

    .page{
      width:min(100%, 640px);
      margin:0 auto;
      padding:16px 12px 36px;
    }

    .hero{
      position:relative;
      background:var(--soft);
      border:4px solid #4a45ff;
      border-radius:20px;
      padding:12px 10px 18px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .hero-track{
      display:flex;
      direction:ltr;
      transition:transform .45s ease;
      will-change:transform;
      width:100%;
    }

    .hero-slide{
      flex:0 0 100%;
      width:100%;
      min-width:100%;
      padding:4px;
      direction:rtl;
    }

    .hero-card{
      display:block;
      background:#0d0d11;
      border-radius:18px;
      overflow:hidden;
      width:100%;
    }

    .hero-image{
      aspect-ratio:1/1;
      background:#17171d;
      overflow:hidden;
    }

    .hero-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .hero-info{
      padding:16px 14px;
    }

    .hero-title{
      font-size:1.08rem;
      line-height:1.6;
      font-weight:700;
      min-height:52px;
      margin-bottom:10px;
      color:#fff;
    }

    .hero-price{
      color:var(--accent);
      font-size:1rem;
      font-weight:800;
      margin-bottom:12px;
    }

    .hero-btn{
      width:100%;
      min-height:50px;
      border:0;
      border-radius:14px;
      background:#f2f2f2;
      color:var(--deep-purple);
      font-size:1rem;
      font-weight:800;
      cursor:pointer;
    }

    .hero-arrow{
      position:absolute;
      top:44%;
      transform:translateY(-50%);
      width:50px;
      height:50px;
      border-radius:999px;
      border:2px solid #111;
      background:#fff;
      color:#111;
      font-size:1.7rem;
      cursor:pointer;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 18px rgba(0,0,0,.2);
    }

    .hero-arrow.prev{ right:10px; }
    .hero-arrow.next{ left:10px; }

    .hero-dots{
      display:flex;
      justify-content:center;
      gap:10px;
      padding-top:14px;
    }

    .hero-dot{
      width:12px;
      height:12px;
      border-radius:999px;
      background:#111;
      border:2px solid #90e45f;
      opacity:.95;
      cursor:pointer;
    }

    .hero-dot.active{
      background:#115cff;
      transform:scale(1.14);
    }

    .section{
      margin-top:26px;
    }

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
      padding:0 4px;
    }

    .section-title{
      font-size:1.18rem;
      font-weight:800;
      line-height:1.45;
      color:#fff;
    }

    .section-link{
      color:#ead8f3;
      font-size:.92rem;
      white-space:nowrap;
    }

    .h-scroll-wrap{
      position:relative;
    }

    .h-scroll{
      display:flex;
      gap:12px;
      overflow-x:auto;
      scroll-behavior:smooth;
      padding:4px 2px 6px;
      scrollbar-width:none;
    }

    .h-scroll::-webkit-scrollbar{ display:none; }

    .scroll-btn{
      position:absolute;
      top:40%;
      transform:translateY(-50%);
      width:42px;
      height:42px;
      border-radius:999px;
      border:2px solid #111;
      background:#fff;
      color:#111;
      font-size:1.35rem;
      cursor:pointer;
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 18px rgba(0,0,0,.2);
    }

    .scroll-btn.prev{ right:-4px; }
    .scroll-btn.next{ left:-4px; }

    .card{
      flex:0 0 78%;
      background:var(--soft);
      border:2px solid rgba(90,70,255,.65);
      border-radius:18px;
      padding:10px;
      box-shadow:var(--shadow);
    }

    .card-link{
      display:block;
      color:inherit;
    }

    .card-inner{
      background:var(--card);
      border-radius:16px;
      overflow:hidden;
      min-height:100%;
    }

    .card-image{
      aspect-ratio:1/1;
      background:#1a1a20;
    }

    .card-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .card-info{
      padding:12px;
      color:#fff;
    }

    .card-title{
      font-size:1rem;
      line-height:1.55;
      font-weight:700;
      min-height:48px;
      margin-bottom:8px;
    }

    .card-price{
      color:var(--accent);
      font-weight:800;
      margin-bottom:10px;
    }

    .card-btn{
      width:100%;
      min-height:44px;
      border:0;
      border-radius:12px;
      background:#f2f2f2;
      color:var(--deep-purple);
      font-size:.98rem;
      font-weight:800;
      cursor:pointer;
    }

    .empty-box{
      width:100%;
      background:rgba(255,255,255,.08);
      border:1px dashed rgba(255,255,255,.2);
      border-radius:16px;
      padding:18px;
      text-align:center;
      color:#eadcf2;
    }

    .footer{
      margin-top:34px;
      padding:20px 10px 34px;
      text-align:center;
      color:#eadcf2;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .footer-social{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .whatsapp-float{
      position:fixed;
      right:18px;
      bottom:18px;
      width:62px;
      height:62px;
      border-radius:999px;
      background:#20d95b;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 12px 28px rgba(0,0,0,.25);
      z-index:1400;
    }

    .whatsapp-icon-img{
      width:36px;
      height:36px;
      object-fit:contain;
      display:block;
    }

    .toast{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%) translateY(-130%);
      width:min(94vw,620px);
      background:var(--toast-bg);
      color:var(--toast-text);
      border:1px solid var(--toast-border);
      border-radius:18px;
      box-shadow:var(--toast-shadow);
      z-index:2000;
      transition:transform .3s ease, opacity .3s ease;
      opacity:0;
      overflow:hidden;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
      opacity:1;
    }

    .toast-inner{
      display:grid;
      grid-template-columns:72px 1fr 44px;
      gap:12px;
      align-items:center;
      padding:12px;
    }

    .toast-thumb{
      width:72px;
      height:72px;
      border-radius:14px;
      overflow:hidden;
      background:#f1f1f1;
      border:1px solid #eee;
    }

    .toast-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .toast-content{
      min-width:0;
    }

    .toast-title{
      font-size:1rem;
      font-weight:800;
      color:#384;
      margin-bottom:4px;
    }

    .toast-name{
      font-size:.96rem;
      color:#111;
      line-height:1.5;
      margin-bottom:8px;
    }

    .toast-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .toast-actions a{
      min-height:34px;
      padding:0 12px;
      border-radius:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:.9rem;
      font-weight:700;
    }

    .toast-cart-link{
      background:#5b1970;
      color:#fff;
    }

    .toast-continue{
      background:#f3eef7;
      color:#5b1970;
    }

    .toast-close{
      width:36px;
      height:36px;
      border:0;
      border-radius:999px;
      background:#f5f2f8;
      color:#6f6380;
      cursor:pointer;
      font-size:1.2rem;
    }

    @media (min-width:700px){
      .page{ width:min(100%, 760px); }
      .logo-wrap img, .drawer-logo img{ width:360px; }
      .card{ flex-basis:48%; }
    }

    @media (max-width: 768px){
      .toast-inner{
        grid-template-columns:60px 1fr 36px;
      }

      .toast-thumb{
        width:60px;
        height:60px;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span>←</span>
    <span>التوصيل مجاناً للطلبات بقيمة 20 د.ك أو أكثر</span>
  </div>

  <header class="header">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="فتح القائمة">☰</button>

    <a href="./index.html" class="logo-wrap" aria-label="الصفحة الرئيسية">
      <img src="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Logo_smart_kids-of-header-tag.png?v=1756574543" alt="Smart Kids Kuwait Logo">
    </a>

    <div class="header-icons">
      <button class="icon-btn" id="searchBtn" type="button" aria-label="بحث">🔍</button>
      <a class="icon-btn" href="./cart.html" aria-label="السلة">
        🛍️
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <button class="drawer-close" id="drawerClose" type="button" aria-label="إغلاق">×</button>

      <div class="drawer-logo">
        <a href="./index.html" aria-label="الصفحة الرئيسية">
          <img src="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Logo_smart_kids-of-header-tag.png?v=1756574543" alt="Smart Kids Kuwait">
        </a>
      </div>

      <div class="drawer-icons">
        <button class="icon-btn" id="drawerSearchBtn" type="button" aria-label="بحث">🔍</button>
        <a class="icon-btn" href="./cart.html" aria-label="السلة">🛍️</a>
      </div>
    </div>

    <div class="drawer-body">
      <nav class="drawer-nav" id="drawerNav">
        <a href="./index.html">الصفحة الرئيسية</a>
        <a href="./collections.html">جميع المجموعات</a>
        <a href="./products-full.html">تسوق جميع المنتجات</a>
        <a href="./cart.html">عربة التسوق</a>
      </nav>
    </div>

    <div class="drawer-footer">
      <a class="drawer-login" href="./collections.html">
        <span>◉</span>
        <span>استعرض المجموعات</span>
      </a>

      <div class="drawer-social">
        <a href="https://www.facebook.com/KuwaitSmartKids" target="_blank" rel="noopener" aria-label="Facebook"><img src="/icon-facebook.webp" alt="Facebook"></a>
        <a href="https://www.instagram.com/kuwaitsmartkids/" target="_blank" rel="noopener" aria-label="Instagram"><img src="/icon-instagram.webp" alt="Instagram"></a>
        <a href="https://www.pinterest.com/smartkidsgulf" target="_blank" rel="noopener" aria-label="Pinterest"><img src="/icon-pinterest.webp" alt="Pinterest"></a>
        <a href="https://www.tiktok.com/@smartkids.gulf" target="_blank" rel="noopener" aria-label="TikTok"><img src="/icon-tiktok.webp" alt="TikTok"></a>
        <a href="https://www.snapchat.com/add/smart.kidskw" target="_blank" rel="noopener" aria-label="Snapchat"><img src="/icon-snapchat.webp" alt="Snapchat"></a>
        <a href="https://www.youtube.com/@SmartKids-Gulf" target="_blank" rel="noopener" aria-label="YouTube"><img src="/icon-youtube.webp" alt="YouTube"></a>
      </div>
    </div>
  </aside>

  <div class="search-panel" id="searchPanel">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث في المنتجات..." />
      <div class="search-results" id="searchResults"></div>
      <button class="search-close" id="searchClose" type="button">إغلاق</button>
    </div>
  </div>

  <div class="toast" id="cartToast">

  <main class="page">

      <button class="hero-arrow prev" id="heroPrev" type="button">‹</button>
      <button class="hero-arrow next" id="heroNext" type="button">›</button>

    <section class="section">

  <a class="whatsapp-float" href="https://wa.me/96566635393" target="_blank" rel="noopener" aria-label="واتساب">
    <img src="/icon-whatsapp.webp" alt="WhatsApp" class="whatsapp-icon-img">
  </a>

  <script>
    const COLLECTIONS_API = '/api/collections';
    const PRODUCTS_API = '/api/products';
    const HOME_PRODUCTS_LIMIT = 200;
    const HOME_COLLECTIONS_LIMIT = 50;

    let allProducts = [];
    let allCollections = [];
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    let toastTimer = null;
    let heroState = {
      items: [],
      current: 0,
      timer: null
    };

    function normalize(text) {
      return String(text || '').toLowerCase().trim();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    function safeText(value, fallback = '') {
      const text = String(value ?? '').trim();
      return text || fallback;
    }

    function getTitle(product) {
      return product.product_name || product.name || product.title || 'منتج';
    }

    function getDescription(product) {
      const raw = product.description || product.body_html || '';
      const div = document.createElement('div');
      div.innerHTML = raw;
      return (div.textContent || '').trim();
    }

    function getImage(product) {
      if (product.primary_image) return product.primary_image;
      if (product.image_url) return product.image_url;
      if (product.image) return product.image;
      if (Array.isArray(product.images) && product.images.length > 0) {
        if (typeof product.images[0] === 'string') return product.images[0];
        if (product.images[0] && product.images[0].src) return product.images[0].src;
        if (product.images[0] && product.images[0].image_url) return product.images[0].image_url;
      }
      return `https://via.placeholder.com/800x800?text=${encodeURIComponent(getTitle(product))}`;
    }

    function getCollectionImage(collection) {
      return (
        collection.image_url ||
        collection.image ||
        collection.cover_image ||
        collection.banner_image ||
        collection.primary_image ||
        `https://via.placeholder.com/800x800?text=${encodeURIComponent(safeText(collection.title, 'Collection'))}`
      );
    }

    function getRegularPrice(product) {
      const value = Number(
        product.compare_at_price ??
        product.regular_price ??
        product.price ??
        0
      );
      return Number.isFinite(value) ? value : 0;
    }

    function getSalePrice(product) {
      const value = Number(
        product.sale_price ??
        product.discounted_price ??
        0
      );
      return Number.isFinite(value) ? value : 0;
    }

    function getPrice(product) {
      const regularPrice = getRegularPrice(product);
      const salePrice = getSalePrice(product);

      if (salePrice > 0 && regularPrice > salePrice) return salePrice;
      if (regularPrice > 0) return regularPrice;
      if (product.variants && product.variants[0] && product.variants[0].price) {
        return parseFloat(product.variants[0].price) || 0;
      }
      return 0;
    }

    function hasSale(product) {
      const regularPrice = getRegularPrice(product);
      const salePrice = getSalePrice(product);
      return salePrice > 0 && regularPrice > salePrice;
    }

    function getAvailableStock(product) {
      const value = Number(
        product.stock ??
        product.inventory ??
        product.inventory_quantity ??
        product.available ??
        0
      );
      return Number.isFinite(value) ? Math.max(0, value) : 0;
    }

    function isPurchasable(product) {
      const status = safeText(product.status, 'active').toLowerCase();
      const inventoryEnabled = Number(product.inventory_enabled ?? 1) === 1;
      const inventoryBlocked = Number(product.inventory_blocked ?? 0) === 1;
      const stock = getAvailableStock(product);
      return status === 'active' && inventoryEnabled && !inventoryBlocked && stock > 0;
    }

    function getStockLabel(product) {
      return isPurchasable(product) ? `متوفر (${getAvailableStock(product)})` : 'نفدت الكمية';
    }

    function getPriceMarkup(product, variant = 'card') {
      const finalPrice = getPrice(product);
      const regularPrice = getRegularPrice(product);
      const sale = hasSale(product);
      const cls = variant === 'hero' ? 'hero' : variant === 'search' ? 'search-item' : 'card';

      return `
        <div class="${cls}-price-wrap">
          ${sale ? `<div class="offer-badge">عرض خاص</div>` : ''}
          ${sale ? `<div class="${cls}-price-old">KWD ${regularPrice.toFixed(3)}</div>` : ''}
          <div class="${cls}-price">KWD ${finalPrice.toFixed(3)}</div>
        </div>
      `;
    }

    function getProductUrl(product) {
      const slug = safeText(product.slug);
      const id = safeText(product.id);

      if (slug) return `./product-page.html?slug=${encodeURIComponent(slug)}`;
      return `./product-page.html?id=${encodeURIComponent(id)}`;
    }

    function getCollectionUrl(collection) {
      const slug = safeText(collection.slug);
      const id = safeText(collection.id);

      if (slug) return `./collection.html?slug=${encodeURIComponent(slug)}`;
      return `./collection.html?id=${encodeURIComponent(id)}`;
    }

    function updateCartCount() {
      const el = document.getElementById('cartCount');
      const count = cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
      if (count > 0) {
        el.style.display = 'flex';
        el.textContent = count;
      } else {
        el.style.display = 'none';
        el.textContent = '0';
      }
    }

    function showCartToast(product) {
      const toast = document.getElementById('cartToast');
      const toastImage = document.getElementById('toastImage');
      const toastName = document.getElementById('toastName');

      toastImage.src = getImage(product);
      toastName.textContent = getTitle(product);

      toast.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3200);
    }

    function hideCartToast() {
      const toast = document.getElementById('cartToast');
      toast.classList.remove('show');
      clearTimeout(toastTimer);
    }

    function addToCart(product) {
      if (!isPurchasable(product)) {
        alert('هذا المنتج نفدت كميته وغير متاح للشراء حالياً');
        return;
      }

      const id = product.id || product.slug || getTitle(product);
      const found = cart.find(item => String(item.id) === String(id));
      const nextQuantity = found ? Number(found.quantity || 0) + 1 : 1;
      const availableStock = getAvailableStock(product);

      if (nextQuantity > availableStock) {
        alert(`الكمية المتاحة فقط هي ${availableStock}`);
        return;
      }

      if (found) {
        found.quantity = nextQuantity;
      } else {
        cart.push({
          id,
          name: getTitle(product),
          price: getPrice(product),
          quantity: 1,
          image: getImage(product)
        });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      showCartToast(product);
    }

    function openMenu() {
      document.body.classList.add('menu-open');
    }

    function closeMenu() {
      document.body.classList.remove('menu-open');
    }

    function openSearch() {
      document.getElementById('searchPanel').style.display = 'flex';
      setTimeout(() => document.getElementById('searchInput').focus(), 50);
    }

    function closeSearch() {
      document.getElementById('searchPanel').style.display = 'none';
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
    }

    function renderSearch(query) {
      const q = normalize(query);
      const box = document.getElementById('searchResults');

      if (!q) {
        box.innerHTML = '';
        return;
      }

      const results = allProducts.filter(product => {
        const hay = normalize(
          `${getTitle(product)} ${product.category || product.type || ''} ${getDescription(product)} ${product.vendor || ''} ${product.sku || ''}`
        );
        return hay.includes(q);
      }).slice(0, 10);

      if (!results.length) {
        box.innerHTML = `<div class="search-item">لا توجد نتائج</div>`;
        return;
      }

      box.innerHTML = results.map(product => {
        const purchasable = isPurchasable(product);
        const id = escapeHtml(product.slug || product.id || '');
        return `
          <div class="search-item">
            <div class="search-item-title">${escapeHtml(getTitle(product))}</div>
            <div class="search-item-stock${purchasable ? '' : ' out'}">${escapeHtml(getStockLabel(product))}</div>
            ${getPriceMarkup(product, 'search')}
            <div class="search-item-actions">
              <button type="button" class="${purchasable ? '' : 'is-disabled'}" data-action="add" data-id="${id}" ${purchasable ? '' : 'disabled'}>${purchasable ? 'إضافة للسلة' : 'نفدت الكمية'}</button>
              <a href="${getProductUrl(product)}">فتح المنتج</a>
            </div>
          </div>
        `;
      }).join('');

      box.querySelectorAll('button[data-action="add"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const product = allProducts.find(p => String(p.slug || p.id || '') === String(id));
          if (product) addToCart(product);
        });
      });
    }

    function heroSlide(product) {
      const url = getProductUrl(product);
      const purchasable = isPurchasable(product);
      return `
        <div class="hero-slide">
          <a class="hero-card" href="${url}">
            <div class="hero-image">
              <img src="${getImage(product)}" alt="${escapeHtml(getTitle(product))}" loading="eager">
            </div>
            <div class="hero-info">
              <div class="hero-title">${escapeHtml(getTitle(product))}</div>
              <div class="hero-stock-badge${purchasable ? '' : ' out'}">${escapeHtml(getStockLabel(product))}</div>
              ${getPriceMarkup(product, 'hero')}
              <button class="hero-btn${purchasable ? '' : ' is-disabled'}" type="button" data-add-id="${escapeHtml(product.slug || product.id || '')}" ${purchasable ? '' : 'disabled'}>${purchasable ? 'أضف للسلة' : 'نفدت الكمية'}</button>
            </div>
          </a>
        </div>
      `;
    }

    function cardItem(product) {
      const url = getProductUrl(product);
      const purchasable = isPurchasable(product);
      return `
        <article class="card">
          <a class="card-link" href="${url}">
            <div class="card-inner">
              <div class="card-image">
                <img src="${getImage(product)}" alt="${escapeHtml(getTitle(product))}" loading="lazy">
              </div>
              <div class="card-info">
                <div class="card-title">${escapeHtml(getTitle(product))}</div>
                <div class="card-stock-badge${purchasable ? '' : ' out'}">${escapeHtml(getStockLabel(product))}</div>
                ${getPriceMarkup(product, 'card')}
                <button class="card-btn${purchasable ? '' : ' is-disabled'}" type="button" data-add-id="${escapeHtml(product.slug || product.id || '')}" ${purchasable ? '' : 'disabled'}>${purchasable ? 'أضف للسلة' : 'نفدت الكمية'}</button>
              </div>
            </div>
          </a>
        </article>
      `;
    }

    function collectionCardItem(collection) {
      const url = getCollectionUrl(collection);
      const title = safeText(collection.title, 'مجموعة');
      const description = safeText(collection.description, '');
      const count = Number(collection.product_count || 0);
      const image = getCollectionImage(collection);

      return `
        <article class="card">
          <a class="card-link" href="${url}">
            <div class="card-inner">
              <div class="card-image">
                <img src="${image}" alt="${escapeHtml(title)}" loading="lazy">
              </div>
              <div class="card-info">
                <div class="card-title">${escapeHtml(title)}</div>
                ${description ? `<div style="font-size:.9rem;color:#eadcf2;margin-bottom:10px;line-height:1.6;">${escapeHtml(description)}</div>` : ``}
                <div class="card-price">${count} منتج</div>
                <div class="card-btn">فتح المجموعة</div>
              </div>
            </div>
          </a>
        </article>
      `;
    }

    function bindAddButtons(root = document) {
      root.querySelectorAll('[data-add-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.dataset.addId;
          const product = allProducts.find(p => String(p.slug || p.id || '') === String(id));
          if (product) addToCart(product);
        });
      });
    }

    function buildHero(products) {
      const items = Array.isArray(products) ? products.slice(0, 8) : [];
      const track = document.getElementById('heroTrack');
      const dots = document.getElementById('heroDots');

      heroState.items = items;
      heroState.current = 0;

      if (!items.length) {
        track.innerHTML = `<div class="empty-box">لا توجد منتجات حالياً</div>`;
        dots.innerHTML = '';
        return;
      }

      track.innerHTML = items.map(heroSlide).join('');
      dots.innerHTML = items.map((_, i) => `
        <button class="hero-dot ${i === 0 ? 'active' : ''}" type="button" data-dot-index="${i}" aria-label="Hero slide ${i + 1}"></button>
      `).join('');

      bindAddButtons(track);

      dots.querySelectorAll('[data-dot-index]').forEach(dot => {
        dot.addEventListener('click', () => {
          goToHeroSlide(Number(dot.dataset.dotIndex || 0));
          restartHeroAuto();
        });
      });

      updateHeroUi();
      startHeroAuto();
    }

    function updateHeroUi() {
      const track = document.getElementById('heroTrack');
      const dots = document.querySelectorAll('.hero-dot');
      track.style.transform = `translateX(-${heroState.current * 100}%)`;
      dots.forEach((dot, idx) => dot.classList.toggle('active', idx === heroState.current));
    }

    function goToHeroSlide(index) {
      if (!heroState.items.length) return;
      heroState.current = (index + heroState.items.length) % heroState.items.length;
      updateHeroUi();
    }

    function nextHero() {
      goToHeroSlide(heroState.current + 1);
    }

    function prevHero() {
      goToHeroSlide(heroState.current - 1);
    }

    function startHeroAuto() {
      clearInterval(heroState.timer);
      if (heroState.items.length <= 1) return;
      heroState.timer = setInterval(nextHero, 4000);
    }

    function restartHeroAuto() {
      startHeroAuto();
    }

    function fillTrack(trackId, products, mode = 'products') {
      const track = document.getElementById(trackId);

      if (!track) return;

      const items = Array.isArray(products) ? products.slice(0, 10) : [];

      if (!items.length) {
        track.innerHTML = `<div class="empty-box">لا توجد بيانات حالياً</div>`;
        return;
      }

      if (mode === 'collections') {
        track.innerHTML = items.map(collectionCardItem).join('');
        return;
      }

      track.innerHTML = items.map(cardItem).join('');
      bindAddButtons(track);
    }

    function scrollCards(id, dir) {
      const el = document.getElementById(id);
      if (!el) return;
      const amount = Math.round(el.clientWidth * 0.82);
      el.scrollBy({ left: dir * amount, behavior: 'smooth' });
    }

    async function fetchJson(url, timeoutMs = 15000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const response = await fetch(url, {
          cache: 'no-store',
          signal: controller.signal,
          headers: { Accept: 'application/json' }
        });

        const result = await response.json().catch(() => null);

        if (!response.ok || !result || !result.success) {
          throw new Error(result?.error || `HTTP ${response.status}`);
        }

        return result.data;
      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error(`Request timeout: ${url}`);
        }
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchAllProducts() {
      try {
        const data = await fetchJson(`${PRODUCTS_API}?status=active&limit=${HOME_PRODUCTS_LIMIT}&offset=0&sort=created_at&order=DESC`);
        return Array.isArray(data) ? data : [];
      } catch (error) {
        console.warn('Failed to fetch all products', error);
        return [];
      }
    }

    async function fetchAllCollections() {
      try {
        // Uses status=active at API level; API is the authoritative filter
        const data = await fetchJson(`${COLLECTIONS_API}?status=active&limit=${HOME_COLLECTIONS_LIMIT}&offset=0&sort=created_at&order=DESC`);
        return Array.isArray(data) ? data : [];
      } catch (error) {
        console.warn('Failed to fetch collections', error);
        return [];
      }
    }

    function uniqueProducts(products) {
      const map = new Map();
      for (const product of products || []) {
        const key = String(product.slug || product.id || getTitle(product));
        if (!map.has(key)) map.set(key, product);
      }
      return Array.from(map.values());
    }

    /* ─── Theme Integration ──────────────────────────────── */

    async function fetchThemeSettings() {
      try { return await fetchJson('/api/theme/settings'); } catch { return {}; }
    }

    async function fetchHomeSections() {
      try {
        const data = await fetchJson('/api/theme/pages/home');
        return Array.isArray(data.sections) ? data.sections : [];
      } catch { return []; }
    }

    function applyThemeSettings(settings) {
      if (!settings || !Object.keys(settings).length) return;

      // Validate hex color before injecting into CSS to prevent CSS injection
      const HEX_RE = /^#[0-9a-fA-F]{6}$/;
      function safeHex(val) { return HEX_RE.test(String(val || '')) ? val : null; }

      // Inject dynamic CSS variables (only validated hex values)
      const primaryColor   = safeHex(settings.primaryColor);
      const topbarColor    = safeHex(settings.topbarColor);
      const secondaryColor = safeHex(settings.secondaryColor);
      const accentColor    = safeHex(settings.accentColor);

      let css = ':root {';
      if (primaryColor)   css += `--bg:${primaryColor};--bg-2:${primaryColor};--deep-purple:${primaryColor};`;
      if (secondaryColor) css += `--blue:${secondaryColor};`;
      if (accentColor)    css += `--accent:${accentColor};`;
      css += '}';
      if (topbarColor)  css += `.topbar{background:${topbarColor}!important;}`;
      if (primaryColor) css += `.drawer{background:${primaryColor}!important;}`;

      let styleTag = document.getElementById('theme-dynamic-vars');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'theme-dynamic-vars';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = css;

      // Topbar text — use textContent to prevent XSS
      if (settings.announcementText) {
        const bar = document.querySelector('.topbar');
        if (bar) {
          const iconSpan = document.createElement('span');
          iconSpan.textContent = settings.announcementIcon || '←';
          const textSpan = document.createElement('span');
          textSpan.textContent = settings.announcementText;
          bar.innerHTML = '';
          bar.appendChild(iconSpan);
          bar.appendChild(textSpan);
        }
      }

      // Logo — only allow http/https URLs
      if (settings.logoUrl && /^https?:\/\//i.test(settings.logoUrl)) {
        document.querySelectorAll('.logo-wrap img, .drawer-logo img').forEach(img => {
          img.src = settings.logoUrl;
        });
      }

      // WhatsApp floating button — only allow digits
      if (settings.whatsappNumber && /^\d{7,15}$/.test(settings.whatsappNumber)) {
        const wa = document.querySelector('.whatsapp-float');
        if (wa) wa.href = `https://wa.me/${settings.whatsappNumber}`;
      }
    }

    // Build hero from theme hero_slider section (custom image slides)
    function buildHeroFromSlides(sectionSettings) {
      const slides = Array.isArray(sectionSettings.slides)
        ? sectionSettings.slides.filter(s => s && s.imageUrl)
        : [];
      if (!slides.length) return false;

      const track = document.getElementById('heroTrack');
      const dots  = document.getElementById('heroDots');
      heroState.items   = slides;
      heroState.current = 0;

      track.innerHTML = slides.map(slide => `
        <div class="hero-slide">
          <a class="hero-card" href="${escapeHtml(slide.link || '#')}">
            <div class="hero-image">
              <img src="${escapeHtml(slide.imageUrl)}"
                alt="${escapeHtml(slide.buttonText || '')}" loading="eager"
                style="width:100%;height:100%;object-fit:cover;">
            </div>
            ${slide.buttonText
              ? `<div class="hero-info"><div class="hero-btn">${escapeHtml(slide.buttonText)}</div></div>`
              : ''}
          </a>
        </div>`).join('');

      dots.innerHTML = slides.map((_, i) => `
        <button class="hero-dot ${i === 0 ? 'active' : ''}" type="button"
          data-dot-index="${i}" aria-label="Slide ${i + 1}"></button>`).join('');

      dots.querySelectorAll('[data-dot-index]').forEach(dot => {
        dot.addEventListener('click', () => {
          goToHeroSlide(Number(dot.dataset.dotIndex || 0));
          restartHeroAuto();
        });
      });

      updateHeroUi();
      const autoplay  = sectionSettings.autoplay !== false;
      const interval  = Number(sectionSettings.interval) || 4000;
      if (autoplay && slides.length > 1) {
        clearInterval(heroState.timer);
        heroState.timer = setInterval(nextHero, interval);
      }
      return true;
    }

    // Inject banner sections into the page after the hero
    function injectBannerSections(themeSections) {
      const banners = themeSections.filter(
        s => s.type === 'banner' && Number(s.is_visible) === 1 && s.settings && s.settings.imageUrl
      );
      if (!banners.length) return;

      const main = document.querySelector('main.page');
      const hero = main && main.querySelector('.hero');
      if (!main || !hero) return;

      let anchor = hero;
      for (const banner of banners) {
        const s   = banner.settings;
        const div = document.createElement('div');
        div.style.cssText = 'margin:8px 0;';
        div.innerHTML = `
          <a href="${escapeHtml(s.link || '#')}"
            style="display:block;border-radius:12px;overflow:hidden;">
            <img src="${escapeHtml(s.imageUrl)}"
              alt="${escapeHtml(s.text || 'Banner')}"
              style="width:100%;display:block;">
          </a>`;
        anchor.insertAdjacentElement('afterend', div);
        anchor = div;
      }
    }

    async function initPage() {
      const [products, collections, themeSettings, themeSections] = await Promise.all([
        fetchAllProducts(),
        fetchAllCollections(),
        fetchThemeSettings(),
        fetchHomeSections(),
      ]);

      allProducts   = uniqueProducts(products);
      allCollections = collections;

      // Apply colors, logo, topbar text, WhatsApp from theme
      applyThemeSettings(themeSettings);

      // Inject banner sections after hero
      injectBannerSections(themeSections);

      updateCartCount();

      // Hero: use custom slides if configured, else fall back to products
      const heroSection  = themeSections.find(
        s => s.type === 'hero_slider' && Number(s.is_visible) === 1
      );
      const usedThemeHero = heroSection && buildHeroFromSlides(heroSection.settings || {});
      if (!usedThemeHero) buildHero(allProducts);

      fillTrack('latestTrack',     allProducts,    'products');
      fillTrack('collectionsTrack', allCollections, 'collections');
    }

    document.getElementById('menuBtn').addEventListener('click', openMenu);
    document.getElementById('drawerClose').addEventListener('click', closeMenu);
    document.getElementById('drawerBackdrop').addEventListener('click', closeMenu);

    document.getElementById('searchBtn').addEventListener('click', openSearch);
    document.getElementById('drawerSearchBtn').addEventListener('click', () => {
      closeMenu();
      openSearch();
    });
    document.getElementById('searchClose').addEventListener('click', closeSearch);
    document.getElementById('searchPanel').addEventListener('click', (e) => {
      if (e.target.id === 'searchPanel') closeSearch();
    });
    document.getElementById('searchInput').addEventListener('input', (e) => renderSearch(e.target.value));
    document.getElementById('toastClose').addEventListener('click', hideCartToast);
    document.getElementById('toastContinue').addEventListener('click', (e) => {
      e.preventDefault();
      hideCartToast();
    });
    document.getElementById('heroPrev').addEventListener('click', () => {
      prevHero();
      restartHeroAuto();
    });
    document.getElementById('heroNext').addEventListener('click', () => {
      nextHero();
      restartHeroAuto();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
        closeSearch();
        hideCartToast();
      }
    });

    initPage().catch(err => {
      console.error(err);
    });
  </script>

  <div id="site-footer"></div>
  <script src="./footer.js"></script>
  <script src="/js/live-visitors.js"></script>
</body>
</html>
