<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="/js/theme-preview-bootstrap.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">مجموعة - Smart Kids Kuwait</title>
  <meta name="description" id="pageDescription" content="مجموعة - Smart Kids Kuwait" />

  <script src="/js/meta-pixel.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-dark: #4d0f62;
      --purple-light: #8f50c8;
      --deep-purple: #3c0646;
      --blue: #3160e0;
      --page-bg-1: #5f2b86;
      --page-bg-2: #7a3fa8;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.12);
      --text-light: #f6eef9;
      --text-soft: rgba(255,255,255,0.78);
      --price: #fff3e2;
      --btn-border: rgba(255,255,255,0.65);
      --offer-bg: #42104c;

      --toast-bg:#ffffff;
      --toast-text:#2d2140;
      --toast-border:#e8dff0;
      --toast-shadow:0 18px 40px rgba(0,0,0,.18);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--page-bg-1) 0%, var(--page-bg-2) 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; }

    .topbar {
      background: #3f0448;
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .topbar-arrow { font-size: 1.2rem; line-height: 1; flex: 0 0 auto; }

    .header {
      background: #fff;
      min-height: 86px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      position: relative;
      z-index: 20;
    }

    .header-back {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(106, 76, 147, 0.10);
      color: var(--purple-dark);
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .header-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .header-logo img {
      width: 320px;
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      display: block;
    }

    .header-icons {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--blue);
      text-decoration: none;
      font-size: 1.55rem;
      cursor: pointer;
      line-height: 1;
      position: relative;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #5b1970;
      color: #fff;
      font-size: .75rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .collection-hero {
      background: rgba(255,255,255,0.10);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-radius: 0 0 22px 22px;
      padding: 14px 14px 18px;
      box-shadow: 0 8px 24px rgba(31, 38, 135, 0.10);
      text-align: center;
      color: #fff;
    }

    .collection-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: nowrap;
      margin-top: 6px;
    }

    .collection-icon {
      font-size: 1.8rem;
      line-height: 1;
      flex: 0 0 auto;
      display: none;
    }

    .collection-info h1 {
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 0.3rem;
      line-height: 1.35;
      font-weight: 800;
    }

    .collection-info p {
      color: rgba(255,255,255,.84);
      font-size: 0.95rem;
      line-height: 1.45;
      display: none;
    }

    .collection-stats {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: rgba(255,255,255,.16);
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,.18);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }

    .nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .8rem;
      margin: 1rem 0 1.2rem;
    }

    .nav a {
      padding: 10px 18px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,.14);
    }

    .search-container {
      text-align: center;
      margin: 1rem 0 1.4rem;
    }

    .search-input {
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 25px;
      background: rgba(255,255,255,0.14);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 1rem;
      width: 100%;
      max-width: 520px;
      outline: none;
    }

    .search-input::placeholder { color: rgba(255,255,255,.75); }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 18px;
      margin: 0 0 1.2rem;
      align-items: start;
    }

    .product { background: transparent; border-radius: 18px; overflow: visible; transition: transform .2s ease; }
    .product:hover { transform: translateY(-4px); }
    .product-link { display: block; color: inherit; }
    .product-media { position: relative; margin-bottom: 12px; }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #5f4777;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
    }

    .product-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .offer-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--offer-bg);
      color: #fff;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(0,0,0,.22);
      z-index: 2;
    }

    .product-info { padding: 0 2px; background: transparent; }

    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-light);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3.2em;
    }

    .product-vendor { color: var(--text-soft); font-size: 0.92rem; margin-bottom: 8px; line-height: 1.4; }

    .price-stack { margin-bottom: 14px; min-height: 56px; }

    .product-compare-price {
      color: rgba(255,255,255,.65);
      font-size: 0.92rem;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      margin-bottom: 2px;
      direction: ltr;
      text-align: right;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 500;
      color: var(--price);
      direction: ltr;
      text-align: right;
      line-height: 1.2;
      white-space: nowrap;
    }

    .product-actions { display: grid; grid-template-columns: 1fr; gap: 10px; }

    .add-to-cart,
    .view-details {
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0 14px;
      text-align: center;
    }

    .add-to-cart {
      background: transparent;
      color: #fff;
      border: 3px solid var(--btn-border);
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }

    .view-details {
      background: rgba(255,255,255,.96);
      color: #6a4c93;
      border: 1px solid rgba(106,76,147,0.16);
    }

    .add-to-cart:hover,
    .view-details:hover { transform: translateY(-2px); }

    .loading,
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      grid-column: 1 / -1;
      color: white;
    }

    .load-more-wrap{
      display:flex;
      justify-content:center;
      margin: 0 0 1.7rem;
    }

    .load-more-btn{
      min-height:48px;
      padding: 12px 18px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.55);
      background: rgba(255,255,255,.12);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    .load-more-btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .back-to-collections { text-align: center; margin: 1.5rem 0 0; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 12px 24px;
      background: rgba(255,255,255,0.14);
      color: white;
      border-radius: 25px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,.14);
    }

    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    .whatsapp-icon-img { width: 34px; height: 34px; object-fit: contain; display: block; }

    .toast{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%) translateY(-130%);
      width:min(94vw,620px);
      background:var(--toast-bg);
      color:var(--toast-text);
      border:1px solid var(--toast-border);
      border-radius:18px;
      box-shadow:var(--toast-shadow);
      z-index:2000;
      transition:transform .3s ease, opacity .3s ease;
      opacity:0;
      overflow:hidden;
    }

    .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

    .toast-inner{
      display:grid;
      grid-template-columns:72px 1fr 44px;
      gap:12px;
      align-items:center;
      padding:12px;
    }

    .toast-thumb{ width:72px;height:72px;border-radius:14px;overflow:hidden;background:#f1f1f1;border:1px solid #eee; }
    .toast-thumb img{ width:100%;height:100%;object-fit:cover;display:block; }

    .toast-content{ min-width:0; }
    .toast-title{ font-size:1rem;font-weight:800;color:#384;margin-bottom:4px; }
    .toast-name{ font-size:.96rem;color:#111;line-height:1.5;margin-bottom:8px; }
    .toast-actions{ display:flex;gap:8px;flex-wrap:wrap; }

    .toast-actions a{
      min-height:34px;padding:0 12px;border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:.9rem;font-weight:700;
    }

    .toast-cart-link{ background:#5b1970;color:#fff; }
    .toast-continue{ background:#f3eef7;color:#5b1970; }

    .toast-close{
      width:36px;height:36px;border:0;border-radius:999px;
      background:#f5f2f8;color:#6f6380;cursor:pointer;font-size:1.2rem;
    }
  </style>
  <link rel="stylesheet" href="./site-theme.css">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="96x96" href="/brand/icon-96.png"><link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png"><link rel="manifest" href="/site.webmanifest">

<body>
  <div id="site-header"></div>
  <script src="./header.js"></script>
<a href="https://wa.me/96566635393" target="_blank" rel="noopener noreferrer" class="whatsapp-float" title="تواصل عبر واتساب">
  <img src="/icon-whatsapp.webp" alt="WhatsApp" class="whatsapp-icon-img">
</a>

  <div class="collection-hero" hidden>
    <div class="collection-header">
      <span class="collection-icon" id="collectionIcon"></span><img id="collectionCover" alt="" hidden style="width:min(28vw,160px);height:auto;max-height:160px;object-fit:contain;border-radius:12px">
      <div class="collection-info">
        <h1 id="collectionTitle">تحميل المجموعة...</h1>
        <p id="collectionDescription"></p>
      </div>
    </div>


  </div>

  <div class="container">


    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="🔍 ابحث في منتجات هذه المجموعة..."

        id="searchInput"
      >
    </div>

    <div class="products" id="products">
      <div class="loading">
        <h3>📦 جاري تحميل منتجات المجموعة...</h3>
        <p>يرجى الانتظار قليلاً</p>
      </div>
    </div>

    <div class="load-more-wrap">
      <button class="load-more-btn" id="loadMoreBtn" type="button" onclick="loadMoreProducts()" disabled>تحميل المزيد</button>
    </div>

  </div>

  <script src="/js/storefront-components.js"></script><script src="/js/storefront-catalog.js"></script>

  <div id="site-footer"></div>
  <script src="./footer.js"></script>
  <script src="/js/live-visitors.js"></script>
  <script src="/js/theme-runtime.js" defer></script>
</body>
</html>
