<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">مجموعة - Smart Kids Kuwait</title>
  <meta name="description" id="pageDescription" content="تصفح منتجات المجموعة المختارة من Smart Kids Kuwait" />
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-dark: #6a4c93;
      --purple-light: #9b59b6;
      --deep-purple: #41064b;
      --blue: #3160e0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a4c93 0%, #9b59b6 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      background: #3f0448;
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .topbar-arrow {
      font-size: 1.2rem;
      line-height: 1;
      flex: 0 0 auto;
    }

    .header {
      background: #fff;
      min-height: 86px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      position: relative;
      z-index: 20;
    }

    .header-back {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(106, 76, 147, 0.10);
      color: var(--purple-dark);
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .header-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .header-logo img {
      width: 320px;
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      display: block;
    }

    .header-icons {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--blue);
      text-decoration: none;
      font-size: 1.55rem;
      cursor: pointer;
      line-height: 1;
      position: relative;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #5b1970;
      color: #fff;
      font-size: .75rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .collection-hero {
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(18px);
      border-radius: 0 0 22px 22px;
      padding: 14px 14px 18px;
      box-shadow: 0 8px 24px rgba(31, 38, 135, 0.18);
      text-align: center;
    }

    .collection-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: nowrap;
      margin-top: 6px;
    }

    .collection-icon {
      font-size: 1.8rem;
      line-height: 1;
      flex: 0 0 auto;
    }

    .collection-info h1 {
      font-size: 1.25rem;
      color: var(--purple-dark);
      margin-bottom: 0.3rem;
      line-height: 1.35;
    }

    .collection-info p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .collection-stats {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 1rem 2rem;
    }

    .nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem 0 1.5rem;
    }

    .nav a {
      padding: 10px 20px;
      background: rgba(255,255,255,0.9);
      color: var(--purple-dark);
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 0.9rem;
    }

    .search-container {
      text-align: center;
      margin: 1.5rem 0;
    }

    .search-input {
      padding: 15px 25px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 25px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      color: #333;
      font-size: 1.05rem;
      width: 100%;
      max-width: 460px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      margin: 1rem 0 2rem;
    }

    .product {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      transition: all 0.3s;
    }

    .product-image {
      height: 280px;
      overflow: hidden;
      background: linear-gradient(45deg, #8e44ad, #c39bd3);
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 1.5rem;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }

    .product-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #333;
      line-height: 1.4;
    }

    .product-description {
      color: #555;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-category {
      font-size: 0.85rem;
      color: #666;
      background: rgba(106, 76, 147, 0.15);
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .product-price {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--purple-dark);
      margin-bottom: 1rem;
    }

    .product-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .add-to-cart,
    .view-details {
      flex: 1 1 160px;
      min-height: 48px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      border: 0;
    }

    .add-to-cart {
      background: linear-gradient(45deg, #6a4c93, #9b59b6);
      color: white;
    }

    .view-details {
      background: rgba(255,255,255,0.85);
      color: var(--purple-dark);
      border: 1px solid rgba(106,76,147,0.18);
    }

    .loading,
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      grid-column: 1 / -1;
      color: white;
    }

    .back-to-collections {
      text-align: center;
      margin: 2rem 0 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 12px 24px;
      background: rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }

    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    .whatsapp-icon-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 768px) {
      .header {
        min-height: 82px;
        grid-template-columns: 52px 1fr 92px;
        padding: 10px 12px;
      }

      .header-logo img {
        max-height: 54px;
      }

      .header-icon-btn {
        width: 40px;
        height: 40px;
        font-size: 1.45rem;
      }

      .collection-hero {
        padding: 12px 12px 16px;
        border-radius: 0 0 18px 18px;
      }

      .products {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .product-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="topbar-arrow">←</span>
    <span>التوصيل مجاناً للطلبات بقيمة 20 د.ك أو أكثر</span>
  </div>

  <header class="header">
    <a href="./collections.html" class="header-back" aria-label="العودة">←</a>

    <div class="header-logo">
      <img src="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Logo_smart_kids-of-header-tag.png?v=1756574543" alt="Smart Kids Kuwait Logo" />
    </div>

    <div class="header-icons">
      <a href="./cart.html" class="header-icon-btn" aria-label="السلة">
        🛍️
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="./products-full.html" class="header-icon-btn" aria-label="بحث">🔍</a>
    </div>
  </header>

  <a href="https://wa.me/96566635393" target="_blank" class="whatsapp-float" title="تواصل عبر واتساب">
    <img src="/whatsapp-icon.png" alt="WhatsApp" class="whatsapp-icon-img">
  </a>

  <div class="collection-hero">
    <div class="collection-header">
      <span class="collection-icon" id="collectionIcon">📦</span>
      <div class="collection-info">
        <h1 id="collectionTitle">تحميل المجموعة...</h1>
        <p id="collectionDescription">جاري التحميل...</p>
      </div>
    </div>

    <div class="collection-stats">
      <div class="stat-badge" id="productCount">جاري التحميل...</div>
    </div>
  </div>

  <div class="container">
    <div class="nav">
      <a href="./collections.html">🏷️ جميع المجموعات</a>
      <a href="./products-full.html">🛍️ المتجر</a>
      <a href="./index.html">🏠 الصفحة الرئيسية</a>
    </div>

    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="🔍 ابحث في منتجات هذه المجموعة..."
        oninput="searchInCollection(this.value)"
        id="searchInput"
      >
    </div>

    <div class="products" id="products">
      <div class="loading">
        <h3>📦 جاري تحميل منتجات المجموعة...</h3>
        <p>يرجى الانتظار قليلاً</p>
      </div>
    </div>

    <div class="back-to-collections">
      <a href="./collections.html" class="back-btn">← العودة إلى المجموعات</a>
    </div>
  </div>

  <script src="./collections-manager.js"></script>
  <script>
    let currentCollection = null;
    let allCollectionProducts = [];
    let filteredProducts = [];
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');

    function escapeHtml(str) {
      return String(str || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeJs(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    async function loadCollection() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const collectionId = urlParams.get('id');

        if (!collectionId) {
          showError('معرف المجموعة غير موجود');
          return;
        }

        const manager = window.initCollectionsManager();
        await manager.loadProducts();
        currentCollection = manager.getCollectionByKey(collectionId);

        if (!currentCollection) {
          showError('المجموعة غير موجودة');
          return;
        }

        allCollectionProducts = currentCollection.products || [];
        filteredProducts = [...allCollectionProducts];

        updateCollectionInfo();
        renderProducts();
        updateCartDisplay();
      } catch (error) {
        console.error('خطأ في تحميل المجموعة:', error);
        showError('حدث خطأ في تحميل المجموعة');
      }
    }

    function updateCollectionInfo() {
      if (!currentCollection) return;

      document.getElementById('collectionIcon').textContent = currentCollection.icon || '📦';
      document.getElementById('collectionTitle').textContent = currentCollection.name || 'المجموعة';
      document.getElementById('collectionDescription').textContent = currentCollection.description || 'تصفح منتجات هذه المجموعة';
      document.getElementById('productCount').textContent = `${currentCollection.productCount || 0} منتج`;

      document.getElementById('pageTitle').textContent = `${currentCollection.name} - Smart Kids Kuwait`;
      document.title = `${currentCollection.name} - Smart Kids Kuwait`;
    }

    function renderProducts() {
      const productsContainer = document.getElementById('products');

      if (filteredProducts.length === 0) {
        productsContainer.innerHTML = `
          <div class="empty-state">
            <h3>😔 لا توجد منتجات في هذه المجموعة</h3>
            <p>يرجى المحاولة مع مجموعة أخرى</p>
          </div>
        `;
        return;
      }

      productsContainer.innerHTML = filteredProducts.map(product => {
        const price = extractPrice(product);
        const image = extractImage(product);
        const description = extractDescription(product.description || product.body_html);
        const title = product.name || product.title || 'منتج';
        const category = product.category || product.type || 'عام';
        const id = product.id || product.handle || '';

        return `
          <div class="product">
            <div class="product-image">
              <img
                src="${image}"
                alt="${escapeHtml(title)}"
                onerror="this.src='https://via.placeholder.com/300x300?text=${encodeURIComponent(title)}'"
              >
            </div>
            <div class="product-info">
              <div class="product-title">${escapeHtml(title)}</div>
              <div class="product-description">${escapeHtml(description)}</div>
              <div class="product-category">التصنيف: ${escapeHtml(category)}</div>
              <div class="product-price">${price.toFixed(3)} د.ك</div>

              <div class="product-actions">
                <button
                  class="add-to-cart"
                  type="button"
                  onclick="addToCart('${escapeJs(title)}', ${price}, '${escapeJs(id)}', '${escapeJs(image)}')"
                >
                  أضف للسلة
                </button>

                <a class="view-details" href="./products-full.html">عرض التفاصيل</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function searchInCollection(query) {
      if (!query.trim()) {
        filteredProducts = [...allCollectionProducts];
      } else {
        const searchQuery = query.toLowerCase();
        filteredProducts = allCollectionProducts.filter(product =>
          (product.title || product.name || '').toLowerCase().includes(searchQuery) ||
          (product.body_html && product.body_html.toLowerCase().includes(searchQuery)) ||
          (product.description && product.description.toLowerCase().includes(searchQuery)) ||
          (product.type && product.type.toLowerCase().includes(searchQuery)) ||
          (product.category && product.category.toLowerCase().includes(searchQuery))
        );
      }
      renderProducts();
    }

    function extractPrice(product) {
      if (product.price != null && !isNaN(parseFloat(product.price))) return parseFloat(product.price);
      if (product.variants && product.variants.length > 0 && product.variants[0].price) return parseFloat(product.variants[0].price);
      return 0;
    }

    function extractImage(product) {
      if (product.image) return product.image;
      if (product.images && product.images.length > 0) {
        if (typeof product.images[0] === 'string') return product.images[0];
        if (product.images[0] && product.images[0].src) return product.images[0].src;
      }
      return `https://via.placeholder.com/300x300?text=${encodeURIComponent(product.title || product.name || 'منتج')}`;
    }

    function extractDescription(bodyHtml) {
      if (!bodyHtml) return 'وصف المنتج غير متوفر';
      const div = document.createElement('div');
      div.innerHTML = bodyHtml;
      const text = div.textContent || div.innerText || '';
      return text.length > 150 ? text.substring(0, 150) + '...' : text;
    }

    function addToCart(name, price, productId = null, productImage = '') {
      const existingItem = cart.find(item => item.id === productId || item.name === name);

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({
          id: productId || name,
          name,
          price: Number(price) || 0,
          quantity: 1,
          image: productImage || 'https://via.placeholder.com/300x300?text=Product'
        });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const cartBadge = document.getElementById('cartBadge');
      const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);

      if (totalQty > 0) {
        cartBadge.style.display = 'flex';
        cartBadge.textContent = totalQty;
      } else {
        cartBadge.style.display = 'none';
        cartBadge.textContent = '0';
      }
    }

    function showError(message) {
      const productsContainer = document.getElementById('products');
      productsContainer.innerHTML = `
        <div style="text-align:center; grid-column:1 / -1; padding:3rem; color:#dc3545;">
          <h3>⚠️ ${message}</h3>
          <a href="./collections.html" style="display:inline-block; margin-top:1rem; padding:10px 20px; background:#007bff; color:white; text-decoration:none; border-radius:5px;">
            العودة للمجموعات
          </a>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadCollection();
      updateCartDisplay();
    });
  </script>

  <footer style="background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); padding: 2rem 1rem; margin-top: 3rem; border-top: 1px solid rgba(255,255,255,0.3);">
    <div style="max-width: 900px; margin: 0 auto; text-align: center;">
      <p style="color: #666; font-size: 0.9rem;">&copy; 2024 Smart Kids Kuwait - تابعونا لآخر العروض</p>
    </div>
  </footer>
</body>
</html>
