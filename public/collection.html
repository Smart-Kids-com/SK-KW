<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">مجموعة - Smart Kids Kuwait</title>
  <meta name="description" id="pageDescription" content="مجموعة - Smart Kids Kuwait" />
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457" />
  <script src="/js/meta-pixel.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-dark: #4d0f62;
      --purple-light: #8f50c8;
      --deep-purple: #3c0646;
      --blue: #3160e0;
      --page-bg-1: #5f2b86;
      --page-bg-2: #7a3fa8;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.12);
      --text-light: #f6eef9;
      --text-soft: rgba(255,255,255,0.78);
      --price: #fff3e2;
      --btn-border: rgba(255,255,255,0.65);
      --offer-bg: #42104c;

      --toast-bg:#ffffff;
      --toast-text:#2d2140;
      --toast-border:#e8dff0;
      --toast-shadow:0 18px 40px rgba(0,0,0,.18);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--page-bg-1) 0%, var(--page-bg-2) 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; }

    .topbar {
      background: #3f0448;
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .topbar-arrow { font-size: 1.2rem; line-height: 1; flex: 0 0 auto; }

    .header {
      background: #fff;
      min-height: 86px;
      display: grid;
      grid-template-columns: 52px 1fr 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      position: relative;
      z-index: 20;
    }

    .header-back {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(106, 76, 147, 0.10);
      color: var(--purple-dark);
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .header-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .header-logo img {
      width: 320px;
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      display: block;
    }

    .header-icons {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--blue);
      text-decoration: none;
      font-size: 1.55rem;
      cursor: pointer;
      line-height: 1;
      position: relative;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #5b1970;
      color: #fff;
      font-size: .75rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .collection-hero {
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(14px);
      border-radius: 0 0 22px 22px;
      padding: 14px 14px 18px;
      box-shadow: 0 8px 24px rgba(31, 38, 135, 0.10);
      text-align: center;
      color: #fff;
    }

    .collection-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: nowrap;
      margin-top: 6px;
    }

    .collection-icon {
      font-size: 1.8rem;
      line-height: 1;
      flex: 0 0 auto;
      display: none;
    }

    .collection-info h1 {
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 0.3rem;
      line-height: 1.35;
      font-weight: 800;
    }

    .collection-info p {
      color: rgba(255,255,255,.84);
      font-size: 0.95rem;
      line-height: 1.45;
      display: none;
    }

    .collection-stats {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: rgba(255,255,255,.16);
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,.18);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }

    .nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .8rem;
      margin: 1rem 0 1.2rem;
    }

    .nav a {
      padding: 10px 18px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,.14);
    }

    .search-container {
      text-align: center;
      margin: 1rem 0 1.4rem;
    }

    .search-input {
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 25px;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 1rem;
      width: 100%;
      max-width: 520px;
      outline: none;
    }

    .search-input::placeholder { color: rgba(255,255,255,.75); }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 18px;
      margin: 0 0 1.2rem;
      align-items: start;
    }

    .product { background: transparent; border-radius: 18px; overflow: visible; transition: transform .2s ease; }
    .product:hover { transform: translateY(-4px); }
    .product-link { display: block; color: inherit; }
    .product-media { position: relative; margin-bottom: 12px; }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #5f4777;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
    }

    .product-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .offer-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--offer-bg);
      color: #fff;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(0,0,0,.22);
      z-index: 2;
    }

    .product-info { padding: 0 2px; background: transparent; }

    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-light);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3.2em;
    }

    .product-vendor { color: var(--text-soft); font-size: 0.92rem; margin-bottom: 8px; line-height: 1.4; }

    .price-stack { margin-bottom: 14px; min-height: 56px; }

    .product-compare-price {
      color: rgba(255,255,255,.65);
      font-size: 0.92rem;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      margin-bottom: 2px;
      direction: ltr;
      text-align: right;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 500;
      color: var(--price);
      direction: ltr;
      text-align: right;
      line-height: 1.2;
      white-space: nowrap;
    }

    .product-actions { display: grid; grid-template-columns: 1fr; gap: 10px; }

    .add-to-cart,
    .view-details {
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0 14px;
      text-align: center;
    }

    .add-to-cart {
      background: transparent;
      color: #fff;
      border: 3px solid var(--btn-border);
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }

    .view-details {
      background: rgba(255,255,255,.96);
      color: #6a4c93;
      border: 1px solid rgba(106,76,147,0.16);
    }

    .add-to-cart:hover,
    .view-details:hover { transform: translateY(-2px); }

    .loading,
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      grid-column: 1 / -1;
      color: white;
    }

    .load-more-wrap{
      display:flex;
      justify-content:center;
      margin: 0 0 1.7rem;
    }

    .load-more-btn{
      min-height:48px;
      padding: 12px 18px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.55);
      background: rgba(255,255,255,.12);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    .load-more-btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .back-to-collections { text-align: center; margin: 1.5rem 0 0; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 12px 24px;
      background: rgba(255,255,255,0.14);
      color: white;
      border-radius: 25px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,.14);
    }

    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    .whatsapp-icon-img { width: 34px; height: 34px; object-fit: contain; display: block; }

    .toast{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%) translateY(-130%);
      width:min(94vw,620px);
      background:var(--toast-bg);
      color:var(--toast-text);
      border:1px solid var(--toast-border);
      border-radius:18px;
      box-shadow:var(--toast-shadow);
      z-index:2000;
      transition:transform .3s ease, opacity .3s ease;
      opacity:0;
      overflow:hidden;
    }

    .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

    .toast-inner{
      display:grid;
      grid-template-columns:72px 1fr 44px;
      gap:12px;
      align-items:center;
      padding:12px;
    }

    .toast-thumb{ width:72px;height:72px;border-radius:14px;overflow:hidden;background:#f1f1f1;border:1px solid #eee; }
    .toast-thumb img{ width:100%;height:100%;object-fit:cover;display:block; }

    .toast-content{ min-width:0; }
    .toast-title{ font-size:1rem;font-weight:800;color:#384;margin-bottom:4px; }
    .toast-name{ font-size:.96rem;color:#111;line-height:1.5;margin-bottom:8px; }
    .toast-actions{ display:flex;gap:8px;flex-wrap:wrap; }

    .toast-actions a{
      min-height:34px;padding:0 12px;border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:.9rem;font-weight:700;
    }

    .toast-cart-link{ background:#5b1970;color:#fff; }
    .toast-continue{ background:#f3eef7;color:#5b1970; }

    .toast-close{
      width:36px;height:36px;border:0;border-radius:999px;
      background:#f5f2f8;color:#6f6380;cursor:pointer;font-size:1.2rem;
    }
  </style>
</head>
<body>

  <div class="container">

      <input
        type="text"

        id="searchInput"
      >
    </div>

    <div class="products" id="products">
      <div class="loading">
        <h3>📦 جاري تحميل منتجات المجموعة...</h3>
        <p>يرجى الانتظار قليلاً</p>
      </div>
    </div>

    <div class="load-more-wrap">
      <button class="load-more-btn" id="loadMoreBtn" type="button" onclick="loadMoreProducts()" disabled>تحميل المزيد</button>
    </div>

    <div class="back-to-collections">
      <a href="./collections.html" class="back-btn">← العودة إلى المجموعات</a>
    </div>
  </div>

  <script>
    const COLLECTIONS_API = '/api/collections';
    const ARCHIVED_STATUS = 'archived';
    const FETCH_TIMEOUT_MS = 35000;

    let currentCollection = null;
    let allCollectionProducts = [];
    let filteredProducts = [];
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    let toastTimer = null;

    // خفض limit ليتوافق مع collection-edit.html ويقلل timeout
    let productsLoading = true;
    let productsOffset = 0;
    const productsLimit = 10;
    let productsTotal = null;
    let productsHasMore = false;

    function escapeHtml(str) {
      return String(str || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeText(value, fallback = '') {
      const text = String(value ?? '').trim();
      return text || fallback;
    }

    function safeNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function getCollectionIcon(collection) { return safeText(collection?.icon, ''); }
    function getProductTitle(product) { return safeText(product.product_name ?? product.name ?? product.title, 'منتج'); }
    function getProductVendor(product) { return safeText(product.vendor, ''); }
    function extractPrice(product) { return safeNumber(product.price ?? product.sale_price ?? product.regular_price, 0); }

    function getComparePrice(product) {
      const sale = safeNumber(product.sale_price, 0);
      const price = extractPrice(product);
      return sale > price ? sale : null;
    }

    function hasDiscount(product) {
      const compare = getComparePrice(product);
      const price = extractPrice(product);
      return compare !== null && compare > price;
    }

    function extractImage(product) {
      const image =
        product.image ??
        product.image_url ??
        product.primary_image ??
        (Array.isArray(product.images) && product.images[0] && (product.images[0].image_url || product.images[0].url || product.images[0].src)) ??
        '';

      return safeText(image, `https://via.placeholder.com/400x400?text=${encodeURIComponent(getProductTitle(product))}`);
    }

    function getProductUrl(product) {
      const slug = safeText(product.slug);
      const id = safeText(product.id);
      if (slug) return `./product-page.html?slug=${encodeURIComponent(slug)}`;
      return `./product-page.html?id=${encodeURIComponent(id)}`;
    }

    function getSortLabel(sortMode) {
      const map = {
        manual: 'Manual',
        best_selling: 'Best selling',
        title_asc: 'A → Z',
        title_desc: 'Z → A',
        price_desc: 'Highest price',
        price_asc: 'Lowest price',
        newest: 'Newest',
        oldest: 'Oldest'
      };
      return map[sortMode] || 'Manual';
    }

    function showCartToast(product) {
      const toast = document.getElementById('cartToast');
      document.getElementById('toastImage').src = extractImage(product);
      document.getElementById('toastName').textContent = getProductTitle(product);

      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    function hideCartToast() {
      document.getElementById('cartToast').classList.remove('show');
      clearTimeout(toastTimer);
    }

    async function fetchJsonWithTimeout(url, timeoutMs = FETCH_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const response = await fetch(url, {
          cache: 'no-store',
          headers: { Accept: 'application/json' },
          signal: controller.signal
        });
        const result = await response.json().catch(() => null);
        return { response, result };
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchCollectionMeta() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = safeText(urlParams.get('slug'));
      const id = safeText(urlParams.get('id'));

      if (!slug && !id) throw new Error('اسم المجموعة غير موجود');

      const endpoint = slug
        ? `${COLLECTIONS_API}/slug/${encodeURIComponent(slug)}?includeProducts=0`
        : `${COLLECTIONS_API}/${encodeURIComponent(id)}?includeProducts=0`;

      const { response, result } = await fetchJsonWithTimeout(endpoint);

      if (!response.ok || !result || !result.success) {
        throw new Error(result?.error || `HTTP ${response.status}`);
      }

      if (String(result.data?.status || '').toLowerCase() === ARCHIVED_STATUS) {
        throw new Error('هذه المجموعة مؤرشفة وغير متاحة للعرض');
      }

      return result.data;
    }

    async function fetchCollectionProductsPage(collectionId, sortMode, limit, offset) {
      const params = new URLSearchParams();
      params.set('sort', sortMode || 'manual');
      params.set('limit', String(limit));
      params.set('offset', String(offset));

      const { response, result } = await fetchJsonWithTimeout(
        `${COLLECTIONS_API}/${encodeURIComponent(collectionId)}/products?${params.toString()}`
      );

      if (!response.ok || !result || !result.success) {
        throw new Error(result?.error || `HTTP ${response.status}`);
      }

      const rows = Array.isArray(result.data) ? result.data : [];
      const pagination = result.pagination || {};
      return { rows, pagination };
    }

    function updateCollectionInfo() {
      const title = safeText(currentCollection?.title, 'المجموعة');
      const description = safeText(currentCollection?.description, '');
      const sortMode = safeText(currentCollection?.sort_mode, 'manual');

      const iconEl = document.getElementById('collectionIcon');
      const descEl = document.getElementById('collectionDescription');

      const iconValue = getCollectionIcon(currentCollection);

      if (iconValue) {
        iconEl.textContent = iconValue;
        iconEl.style.display = 'inline-block';
      } else {
        iconEl.textContent = '';
        iconEl.style.display = 'none';
      }

      document.getElementById('collectionTitle').textContent = title;

      if (description) {
        descEl.textContent = description;
        descEl.style.display = 'block';
      } else {
        descEl.textContent = '';
        descEl.style.display = 'none';
      }

      document.getElementById('productCount').textContent =
        productsLoading ? 'جاري التحميل...' : `${filteredProducts.length} منتج (المحمّل)`;

      document.getElementById('collectionSortBadge').textContent = getSortLabel(sortMode);

      document.getElementById('pageTitle').textContent = `${title} - Smart Kids Kuwait`;
      document.getElementById('pageDescription').setAttribute('content', description || title);
      document.title = `${title} - Smart Kids Kuwait`;
    }

    function renderProducts() {
      const productsContainer = document.getElementById('products');

      if (productsLoading && filteredProducts.length === 0) {
        productsContainer.innerHTML = `
          <div class="loading">
            <h3>📦 جاري تحميل منتجات المجموعة...</h3>
            <p>يرجى الانتظار قليلاً</p>
          </div>
        `;
        return;
      }

      if (filteredProducts.length === 0) {
        productsContainer.innerHTML = `
          <div class="empty-state">
            <h3>😔 لا توجد منتجات في هذه المجموعة</h3>
            <p>يرجى المحاولة مع مجموعة أخرى</p>
          </div>
        `;
        return;
      }

      productsContainer.innerHTML = filteredProducts.map(product => {
        const price = extractPrice(product);
        const comparePrice = getComparePrice(product);
        const image = extractImage(product);
        const title = getProductTitle(product);
        const vendor = getProductVendor(product);
        const url = getProductUrl(product);
        const id = product.id || product.slug || title;

        return `
          <article class="product">
            <a class="product-link" href="${url}">
              <div class="product-media">
                <div class="product-image">
                  <img
                    src="${image}"
                    alt="${escapeHtml(title)}"
                    onerror="this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(title)}'"
                  >
                </div>
                ${hasDiscount(product) ? `<div class="offer-badge">عرض خاص</div>` : ``}
              </div>

              <div class="product-info">
                <div class="product-title">${escapeHtml(title)}</div>
                ${vendor ? `<div class="product-vendor">${escapeHtml(vendor)}</div>` : ``}

                <div class="price-stack">
                  ${comparePrice && comparePrice > price ? `<div class="product-compare-price">${comparePrice.toFixed(3)} KWD</div>` : ``}
                  <div class="product-price">${price.toFixed(3)} KWD</div>
                </div>
              </div>
            </a>

            <div class="product-info">
              <div class="product-actions">
                <button class="add-to-cart" type="button" data-product-id="${escapeHtml(String(id))}">
                  أضف إلى عربة التسوق
                </button>
                <a class="view-details" href="${url}">عرض المنتج</a>
              </div>
            </div>
          </article>
        `;
      }).join('');

      productsContainer.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();

          const id = btn.dataset.productId;
          const product = filteredProducts.find(p => String(p.id || p.slug || getProductTitle(p)) === String(id));
          if (product) addToCart(product);
        });
      });
    }

    function updateLoadMoreButton() {
      const btn = document.getElementById('loadMoreBtn');

      if (!currentCollection?.id) {
        btn.disabled = true;
        btn.textContent = 'تحميل المزيد';
        return;
      }

      if (productsLoading) {
        btn.disabled = true;
        btn.textContent = 'جاري التحميل...';
        return;
      }

      btn.disabled = !productsHasMore;
      btn.textContent = productsHasMore ? 'تحميل المزيد' : 'لا يوجد المزيد';
    }

    async function loadMoreProducts() {
      if (!currentCollection?.id) return;
      if (productsLoading) return;
      if (!productsHasMore) return;

      try {
        productsLoading = true;
        updateLoadMoreButton();

        const sortMode = safeText(currentCollection?.sort_mode, 'manual');
        const { rows, pagination } = await fetchCollectionProductsPage(
          currentCollection.id,
          sortMode,
          productsLimit,
          productsOffset
        );

        allCollectionProducts = [...allCollectionProducts, ...rows];
        filteredProducts = [...allCollectionProducts];

        productsTotal = Number(pagination?.total ?? productsTotal);
        productsOffset = productsOffset + rows.length;

        productsHasMore = productsTotal != null
          ? productsOffset < productsTotal
          : rows.length === productsLimit;

        productsLoading = false;
        updateCollectionInfo();
        renderProducts();
        updateLoadMoreButton();
      } catch (error) {
        console.error(error);
        productsLoading = false;
        productsHasMore = false;
        updateLoadMoreButton();
        showError(
          error?.name === 'AbortError'
            ? 'انتهى وقت تحميل المنتجات (Timeout). حاول مرة أخرى.'
            : (error?.message || 'حدث خطأ أثناء تحميل المنتجات')
        );
      }
    }

    function searchInCollection(query) {
      const q = String(query || '').trim().toLowerCase();
      if (!q) {
        filteredProducts = [...allCollectionProducts];
      } else {
        filteredProducts = allCollectionProducts.filter(product => {
          const hay = [
            getProductTitle(product),
            safeText(product.description),
            safeText(product.category),
            safeText(product.vendor),
            safeText(product.sku)
          ].join(' ').toLowerCase();
          return hay.includes(q);
        });
      }
      updateCollectionInfo();
      renderProducts();
    }

    function addToCart(product) {
      const title = getProductTitle(product);
      const price = extractPrice(product);
      const productId = product.id || product.slug || title;
      const productImage = extractImage(product);

      const existingItem = cart.find(item => String(item.id) === String(productId) || item.name === title);

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({
          id: productId,
          slug: safeText(product.slug),
          name: title,
          price: Number(price) || 0,
          quantity: 1,
          image: productImage
        });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartDisplay();
      showCartToast(product);
    }

    function updateCartDisplay() {
      const cartBadge = document.getElementById('cartBadge');
      const totalQty = cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0);

      if (totalQty > 0) {
        cartBadge.style.display = 'flex';
        cartBadge.textContent = totalQty;
      } else {
        cartBadge.style.display = 'none';
        cartBadge.textContent = '0';
      }
    }

    function showError(message) {
      const productsContainer = document.getElementById('products');
      productsContainer.innerHTML = `
        <div style="text-align:center; grid-column:1 / -1; padding:3rem; color:#fff;">
          <h3>⚠️ ${escapeHtml(message)}</h3>
          <a href="./collections.html" style="display:inline-block; margin-top:1rem; padding:10px 20px; background:#ffffff; color:#4d0f62; text-decoration:none; border-radius:999px; font-weight:700;">
            العودة للمجموعات
          </a>
        </div>
      `;
    }

    async function init() {
      try {
        productsLoading = true;
        updateLoadMoreButton();
        updateCartDisplay();
        renderProducts();

        currentCollection = await fetchCollectionMeta();
        productsOffset = 0;
        productsTotal = null;
        allCollectionProducts = [];
        filteredProducts = [];

        productsHasMore = true;
        productsLoading = false;
        updateCollectionInfo();
        renderProducts();
        updateLoadMoreButton();

        await loadMoreProducts();
      } catch (error) {
        console.error(error);
        productsLoading = false;
        updateLoadMoreButton();
        showError(error?.message || 'حدث خطأ أثناء تحميل المجموعة');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      init();
      document.getElementById('toastClose')?.addEventListener('click', hideCartToast);
      document.getElementById('toastContinue')?.addEventListener('click', (e) => {
        e.preventDefault();
        hideCartToast();
      });
    });
  </script>

  <div id="site-footer"></div>
  <script src="./footer.js"></script>
</body>
</html>
