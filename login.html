<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Smart Kids Kuwait</title>
    <meta name="description" content="تسجيل الدخول إلى حسابك في Smart Kids Kuwait للاستمتاع بتجربة تسوق مخصصة">
    <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Confirmed_google_small_icone_logo_of_sk_smart-kids.png?v=1756770457">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --purple-light: #c39bd3;
            --purple-dark: #6a4c93;
            --glass-bg: rgba(255,255,255,0.25);
            --glass-border: rgba(255,255,255,0.18);
            --success-color: #28a745;
            --error-color: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        .header h1 {
            color: var(--purple-dark);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            color: var(--purple-dark);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--purple-dark);
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            font-size: 1rem;
            color: #333;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--purple-dark);
            background: rgba(255,255,255,0.4);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--purple-dark), var(--purple-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(106, 76, 147, 0.3);
        }

        .login-options {
            text-align: center;
            margin-top: 1.5rem;
        }

        .login-options a {
            color: var(--purple-dark);
            text-decoration: none;
            font-size: 0.9rem;
            margin: 0 0.5rem;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #666;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.3);
        }

        .divider span {
            padding: 0 1rem;
            font-size: 0.9rem;
        }

        .social-login {
            display: grid;
            gap: 1rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
            color: #333;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .social-btn:hover {
            background: rgba(255,255,255,0.3);
            border-color: var(--purple-dark);
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: var(--purple-dark);
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-link a:hover {
            background: rgba(255,255,255,0.3);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            color: var(--error-color);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .success-message {
            background: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            border: 1px solid rgba(40, 167, 69, 0.2);
        }

        @media (max-width: 768px) {
            .login-container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            .header {
                margin-bottom: 1rem;
                padding: 1.5rem;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1rem;">
            <img src="https://cdn.shopify.com/s/files/1/0697/3318/7805/files/Logo_smart_kids-of-header-tag.png?v=1756574543" alt="Smart Kids Kuwait Logo" style="height: 60px; object-fit: contain;">
        </div>
        <h1>🔐 تسجيل الدخول</h1>
        <p>أهلاً بك في Smart Kids Kuwait</p>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h2>👋 مرحباً بعودتك</h2>
            <p>سجل الدخول للوصول إلى حسابك</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">📧 البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required placeholder="أدخل بريدك الإلكتروني">
            </div>

            <div class="form-group">
                <label for="password">🔒 كلمة المرور</label>
                <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" class="login-btn">🚀 تسجيل الدخول</button>
        </form>

        <div class="login-options">
            <a href="#" onclick="forgotPassword()">🔑 نسيت كلمة المرور؟</a>
            <span>|</span>
            <a href="#" onclick="createAccount()">➕ إنشاء حساب جديد</a>
        </div>

        <div class="divider">
            <span>أو</span>
        </div>

        <div class="social-login">
            <a href="#" class="social-btn" onclick="socialLogin('google')">
                🔵 تسجيل الدخول بـ Google
            </a>
            <a href="#" class="social-btn" onclick="socialLogin('facebook')">
                📘 تسجيل الدخول بـ Facebook
            </a>
        </div>
    </div>

    <div class="back-link">
        <a href="./index.html">🏠 العودة للصفحة الرئيسية</a>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // محاكاة تسجيل الدخول
            if (email && password) {
                showSuccess('تم تسجيل الدخول بنجاح! 🎉');
                
                // حفظ بيانات المستخدم
                localStorage.setItem('userLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', email.split('@')[0]);
                
                // توجيه للصفحة الرئيسية بعد 2 ثانية
                setTimeout(() => {
                    window.location.href = './index.html';
                }, 2000);
            } else {
                showError('يرجى ملء جميع الحقول المطلوبة');
            }
        }

        function forgotPassword() {
            alert('🔑 سيتم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني');
        }

        function createAccount() {
            alert('➕ ميزة إنشاء حساب جديد ستكون متوفرة قريباً');
        }

        function socialLogin(provider) {
            alert(`تسجيل الدخول بـ ${provider} سيكون متوفراً قريباً`);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        // التحقق من حالة تسجيل الدخول
        window.onload = function() {
            if (localStorage.getItem('userLoggedIn') === 'true') {
                showSuccess('أنت مسجل دخول بالفعل!');
                setTimeout(() => {
                    window.location.href = './profile.html';
                }, 2000);
            }
        };
    </script>
</body>
</html>
